<!--
================================================================================
 HOLADAY — TRIP-READY LANGUAGE & CULTURE COURSES
 Product Requirements Document, embedded as HTML comments, wrapping a working
 click-through prototype of the core flow. View this file in a browser to
 experience the demo; read the source (comments) for the PRD.
================================================================================

1. PROBLEM
--------------------------------------------------------------------------------
Mainstream language apps (Duolingo, Babbel, Rosetta Stone) teach general
proficiency across months or years. Most people booking a holiday don't want
general proficiency — they have a specific trip, a specific window of time
(often 6-8 weeks out), and a narrow set of situations they'll actually face:
airport and arrival, ordering food, asking directions, basic courtesy, local
customs that prevent embarrassing mistakes. General courses don't prioritise
for that, so people either quit a generic course before the trip or never
start one at all.

2. SOLUTION
--------------------------------------------------------------------------------
Holaday generates a short, finite course (6-8 weeks) scoped to ONE upcoming
trip: the destination country and the kind of trip (city break, food & wine,
family trip, etc). The course ends when the trip is ready to happen — it is
not an ongoing subscription-style curriculum. Content is prioritised by
situational usefulness over grammatical completeness.

3. TARGET USER
--------------------------------------------------------------------------------
Someone who has already booked or is about to book international travel,
wants to be a more respectful and capable visitor, and has weeks (not years)
to prepare. Low tolerance for busywork; high tolerance for short, dense,
trip-relevant lessons.

4. KEY DIFFERENTIATOR
--------------------------------------------------------------------------------
- Scoped by TRIP, not by LANGUAGE. Course = country + trip type + duration.
- Finite and disposable by design: a course "completes" before departure and
  is archived, rather than continuing indefinitely.
- Culture, not just vocabulary: etiquette/customs content is a first-class
  lesson type alongside phrases, because "don't accidentally offend anyone"
  is as valuable to this user as "can order a coffee."
- Visual identity of each course is themed from the destination's national
  flag colours, so a user's course list is instantly scannable and each
  course feels bespoke to that trip.

5. CORE USER JOURNEY (what this prototype demonstrates)
--------------------------------------------------------------------------------
  Home (My Trips)                     — airport-departure-board metaphor;
                                         shows active + past courses.
    -> [no active course] "Book a course" CTA in the empty active slot
    -> Step 1: Choose a country        (grid of destinations)
    -> Step 2: Describe the trip       (trip-type chips + free-text notes)
    -> Generating course               (brief synthesis moment)
    -> Course dashboard                (flag-themed, week-by-week outline,
                                         first three weeks unlocked)
    -> Lesson: Airport & Arrival Essentials  (info page, then separate quiz page)
    -> Lesson: trip-type-flavoured lesson 2  (info page, then separate quiz page)
    -> Lesson: Public Transport & Getting Around (CULTURE lesson — etiquette
                                         + transit phrases — info page, then
                                         separate quiz page)
    -> Back to Home                    — new course now shows as "current",
                                         previous course still listed below.

Every lesson is two pages, not one long scroll (see PRD §11): an info page
told as a single walk-through scenario, then a separate quiz page with
nothing else on it. The split is deliberate — a quick-check that shares
a scrollable page with the answers isn't really testing recall.

Note on emoji use: the UI is otherwise emoji-free by design (see PRD §12)
except for each country's flag, which doubles as its primary visual
identifier on cards and course rows.

6. WHY THE AIRPORT-BOARD METAPHOR
--------------------------------------------------------------------------------
The home screen borrows split-flap departure-board language because it maps
cleanly onto the product's own mental model, not just decoration:
  - A "flight" = a course. It has a destination, a status, and a countdown.
  - BOARDING   = course just generated, not yet started.
  - IN PROGRESS = course underway, shows current week like a "gate."
  - LANDED      = course completed (trip has presumably happened).
This gives users a familiar, glanceable status language instead of a generic
progress bar, and reinforces "this course exists to get you on a plane
prepared," not "this is a permanent subscription."

7. CONTENT MODEL (as implemented in this prototype's JS — see DATA below)
--------------------------------------------------------------------------------
Course = { country, tripType, durationWeeks, currentWeek, status, notes }
Country = { name, capital, colours{primary, secondary, tertiary},
            phrasebank[8 phrases], cultureTip,
            transport{ intro, phrases[3], etiquette[3], scenario, beatPlan } }
(Flags are looked up separately, by country key, from a constant map of
inline SVGs — see PRD §12 — rather than stored as a field on Country.)
TripType = { label, durationWeeks, lesson2Title }
In production, `durationWeeks` and the week-by-week syllabus would likely be
generated by a content model + curated phrase/etiquette database keyed by
country, with trip-type acting as a weighting/prioritisation signal rather
than a hard-coded lesson swap. This prototype hard-codes 6 countries and 6
trip types, and reuses each country's 8-phrase bank across lessons 1 & 2
(rather than authoring 36 unique phrase sets) to keep the demo honest about
scope while still proving the concept end-to-end with real translations.
Week 3 (Public Transport) is the one lesson type that is NOT phrase-bank
reuse — it has its own per-country intro paragraph, 3 transit-specific
phrases, 3 etiquette bullets, and a scenario question, because it exists
specifically to prove out the "culture, not just vocabulary" differentiator
from PRD §4 with real content rather than a placeholder.

Every built lesson (weeks 1-3) IS a 5-question multiple-choice sequence, one
question per page (`buildLessonBeats` in the JS — see §11a), mixing question
styles rather than one repeated drill. "Mark lesson complete" only appears
on the final question and stays disabled until it's answered — a deliberate,
if small, gate so the prototype feels like it's testing retention rather
than just displaying content to scroll past.

8. MVP SCOPE vs OUT OF SCOPE (for a v1 build)
--------------------------------------------------------------------------------
 In scope for v1:
  - Country + trip-type intake, generated course with weekly structure
  - Progressive unlock (future weeks locked until prior week complete)
  - Phrase lessons AND at least one distinct culture/etiquette lesson type
  - Lessons delivered as a sequence of graded questions gating completion,
    not passive content followed by a separate quiz
  - Flag-derived colour theming per course
  - Downloadable offline phrasebook, unlocked once a course is completed
 Explicitly out of scope for v1 (visible in this prototype as disabled stubs):
  - "Explore" and "Profile" bottom-tab destinations
  - Audio pronunciation playback
  - Real spaced-repetition / adaptive quizzing
  - Multi-trip mixing (e.g. multi-city itineraries spanning >1 country)
  - Offline access

9. SUCCESS METRICS (proposed, not instrumented in this prototype)
--------------------------------------------------------------------------------
CORE ASSUMPTION THIS SECTION TESTS: Scoping a course to one finite, dated
trip — rather than an open-ended subscription — is what drives people to
actually FINISH, not just start. General apps fail on completion because
they're open-ended; the bet here is that finiteness + trip-relevance fixes
that.

HYPOTHESIS: We believe trip-scoped, dated courses will produce meaningfully
higher completion rates than general-purpose language apps' typically low
completion. We'll know this is wrong if trip-scoped completion isn't
meaningfully better than general-app baseline once we have real data —
i.e. finiteness and relevance alone aren't enough to overcome the same
drop-off patterns everyone else sees.

  - % of started courses reaching "trip-ready" (all weeks complete) before
    the user's stated travel date (the direct test of the hypothesis above)
  - Completion rate segmented by weeks-to-departure at signup (does more
    urgency at signup predict higher completion?)
  - Completion rate benchmarked against published/estimated completion
    rates for general-purpose language apps, as an external baseline —
    without this, "our number" has nothing to be better than
  - Lesson completion rate in the final 2 weeks before departure (proxy for
    "did this actually get used right before the trip, when it matters")
  - Self-reported confidence delta (pre/post course, 1-5 scale)
  - Post-trip customer satisfaction / NPS, collected once the user's actual
    travel date has passed (see `needsFeedback` / `screenFeedback` in the JS
    below — trip dates are now captured on the trip-details step and stored
    on the course object as `travelStart` / `travelEnd`)

10. OPEN QUESTIONS
--------------------------------------------------------------------------------
  - We now capture actual departure/return dates (see PRD §9 and §14), but
    only to know when to trigger the post-trip feedback prompt — do we also
    use them to back-calculate lesson pacing instead of the flat 6-8 week
    default per trip type?
  - What happens to a course if the trip is postponed/cancelled? (Its
    `travelStart`/`travelEnd` would need to be editable after course
    creation, which isn't supported yet.)
  - Should trip type be multi-select (a trip is rarely just one archetype)?

11. LESSON = A SEQUENCE OF ONE-QUESTION PAGES
--------------------------------------------------------------------------------
Revision history: the very first builds put vocab/etiquette content and a
3-question quiz on one long scrollable page (bad — the quiz measured how far
someone would scroll, not what they remembered). The next revision split that
into an "info" page (a walk-through of phrases/etiquette) followed by a
separate "quiz" page. User testing on THAT version said it still didn't feel
like a lesson — it read as a reference card you skimmed, then a quiz on
content you'd just seen seconds ago, which barely tests retention.

So a lesson is no longer "content, then quiz." It's a sequence of graded
question pages — `payload.stepIndex` picks which one to show, each pushed as
its own stack entry (see `screenLesson`, `buildLessonBeats`, `beat-continue`
action). Every page is scenario-framed and asks exactly one question; there
is no separate content page to read first. The back button still lets someone
return to a prior question, and going back re-presents it fresh (unanswered) —
same one-attempt-per-question spirit as before, just per-page instead of
per-quiz.

11a. MIXED QUESTION STYLES, NOT ONE REPEATED DRILL
--------------------------------------------------------------------------------
Further revision based on feedback: "How do you say X?" five times in a row
is still just a flashcard deck wearing a scenario costume. Each lesson now
mixes three question styles across its 5 questions (`buildLessonBeats` /
`buildBeat` in the JS), all scenario-framed so it still reads as one
situation playing out, not five disconnected drills:
  - "produce"     — "How do you say X?" — English prompt, answer in the
    local language. Tests recall/production.
  - "comprehend"  — a local phrase is quoted as something someone just said
    to you ("The officer says: '...' — what are they telling you?") — local
    phrase shown, answer in English. Tests listening/comprehension, the
    reverse direction of "produce."
  - "symbol"      — a sign or icon is shown ("You notice this on a seat —
    what does it mean?") with a small inline SVG (`SYMBOLS` in the JS, same
    font-independent rationale as `FLAGS` — see §12) standing in for a real
    transit/customs sign. Tests recognition of non-verbal cues, not just
    vocabulary.
  - "situational" — week 3 (Public Transport) only, "what would you do?"
    judgement calls. Reuses each country's existing `transport.scenario`
    content unchanged, just delivered as one beat among the five instead of
    a bonus 3rd quiz question tacked onto the end.

Weeks 1 and 2 pull from generic, shared beat plans (`ARRIVAL_BEAT_PLAN`,
`EXPLORE_BEAT_PLAN`) applied to each country's 8-phrase bank — see PRD §7,
still no 36 hand-authored phrase sets — since arriving and greeting someone
plays out the same way regardless of destination; only the scene-setting
context flexes per country (week 1) or trip type (week 2, via `exploreIntro`).
Week 3 (Public Transport) is bespoke per country (`transport.beatPlan` on
each Country, see DATA below), because its phrases/etiquette were already
bespoke per country and the symbol/situational beats are tied to a specific
country's real transit rules (e.g. Japan's quiet carriages, Italy's ticket
validation, Morocco's taxi meters) — a generic prompt wouldn't fit all six.

12. ICONOGRAPHY / EMOJI POLICY
--------------------------------------------------------------------------------
No decorative emoji anywhere in the UI (trip-type chips, tab bar, buttons).
Country flags are the one visual identifier that matters enough to keep, but
they are NOT Unicode flag emoji — those are font-dependent, and several
common platforms (older Windows, many Linux desktops without a colour-emoji
font) silently fall back to rendering a flag sequence as plain two-letter
text (e.g. "JP"), which quietly defeats "flag = instant visual identity."
Flags are instead small inline SVGs (the `FLAGS` constant in the JS, one
per country, built from the same colours already stored per Country), so
every viewer sees an actual coloured flag chip regardless of OS or installed
fonts.

13. OFFLINE PHRASEBOOK
--------------------------------------------------------------------------------
Deliberately gated to COMPLETED courses only (see the `ticket__cta` button
that appears in `screenDashboard` when `course.status === "completed"`),
not available mid-course. Rationale: the phrasebook is framed as the
take-away artefact from a finished course — "you did the prep, here's the
condensed reference for the trip itself" — rather than a shortcut that
lets someone skip the lessons and just grab the phrase list on day one.
A real v1 might reconsider this (e.g. unlock per-lesson as content is
completed, so a partially-finished course still has a partial phrasebook),
but "completed only" is the simplest version that proves the feature.

Content is compiled, not separately authored: it's the same country
phrasebank + transport phrasebank + cultureTip + transport etiquette
already used across the lessons (`screenPhrasebook`), reassembled into one
reference page — there is no new content model here, just a new view over
existing data.

The "Download for offline use" button is an intentional stub (see
`download-phrasebook` in the event delegation) — it shows a toast instead
of producing a file, exactly like the disabled Explore/Profile tabs. In a
real build this would generate a PDF or add-to-device-storage flow; this
prototype only needs to prove that the entry point and framing exist.

14. POST-TRIP FEEDBACK
--------------------------------------------------------------------------------
Trip details (Step 2) now asks for departure and return dates alongside trip
type and notes, stored on the course as `travelStart` / `travelEnd`. This
exists to answer the PRD §9 metric that couldn't be collected before: NPS
and a culture-content-specific question, gathered once the trip has actually
happened rather than at course completion (a course can be "trip-ready"
before departure and still not have a real post-trip result yet).

`needsFeedback(course)` is true once `travelEnd` is in the past and
`feedbackSubmitted` is still false, regardless of whether the course's
lessons were ever finished — a badly-prepared trip is exactly the case we
most want feedback on, not just the well-completed ones. This is
check-on-render rather than a scheduled push (see PRD §10 note on
`finalizeCourse`): the dashboard ticket shows a "Share trip feedback" CTA,
and the home board row appends "Feedback requested" to the row subtitle, so
the prompt is visible wherever the course already surfaces rather than
interrupting with a separate notification.

This prototype now starts with no seed/demo course (see STATE below) — to
see the feedback CTA, generate a course and pick a return date in the past;
the date inputs don't restrict picking a past date for exactly this reason
(a real build would likely disallow a return date before departure, which
this prototype does validate, but wouldn't otherwise constrain the range).

15. ADMIN / CONTENT AUTHORING — PLANNED, NOT YET BUILT
--------------------------------------------------------------------------------
Everything below this line still describes the TRAVELER-facing prototype
only. This file has no admin/content-authoring surface yet — every country,
phrase, beat plan, and trip type is a hardcoded JS literal maintained by
hand, not authored/reviewed/published content.

See ADMIN-CONTENT-PLAN.md (repo root) for the full design: a content
hierarchy of Phrase -> Question -> Lesson -> Module -> Trip Type Blueprint,
each with its own Draft -> In Review -> Approved -> Published lifecycle
(Author vs. Approver roles); a reusable content library so a Question like
"how do you say hello" is authored once and attached to many Lessons
instead of re-embedded per lesson; and a Blueprint concept where a course
is a series of named "Legs" (e.g. Leg 1: Slightly Scared Tourist, Leg 2:
Confident Traveller) that repeat the same core themes at increasing
difficulty/length rather than a flat one-topic-per-week list. Search this
file for "TODO(admin)" for where each piece of that plan lands in the
current code.

--------------------------------------------------------------------------------
 The rest of the comments in this file are scoped to the section they sit
 above/inside, covering UX rationale and implementation notes at that level.
================================================================================

  /* ============================================================
     DESIGN TOKENS
     Palette is deliberately airport/signage-inspired (ink, paper,

     --flag-* variables injected on the dashboard/lesson screens,
     pulled from that destination's national flag. This keeps every
     course feeling bespoke without turning the whole UI into a
     rainbow — the neutral chrome is the constant, the flag accent
     is the variable.
     ============================================================ */
  :root{
    --ink: #14181f;
    --ink-soft: #232a37;
    --ink-line: #333c4d;
    --paper: #f5f3ee;
    --paper-dim: #e8e4d9;
    --paper-line: #d8d2c2;
    --amber: #ffb300;
    --amber-deep: #8a5c00;
    --slate: #6b7280;
    --green-ok: #1e8f5f;
    --red-alert: #d8402b;
    --radius-s: 6px;
    --radius-m: 12px;
    --font-display: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    font-family: var(--font-display);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,p,ul{ margin:0; }
  button{ font-family:inherit; }
  ::selection{ background: var(--amber); color: var(--ink); }

  /* Visible keyboard focus everywhere — quality floor, not decoration */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ============================================================
     MOBILE-FIRST APP SHELL
     Base rules below target a phone viewport with no media query.
     A min-width query further down adds a "device frame" so the
     same mobile layout can be reviewed comfortably on a desktop

     ============================================================ */
  .app-shell{
    position: relative;
    width: 100%;

    flex-direction: column;

  .statusbar__batt::before{ content:""; position:absolute; inset:1.5px; width:70%; background:var(--ink); border-radius:1px; }

  .appbar{
    flex-shrink: 0;
    display:flex; align-items:center; gap:10px;
    padding: 6px 16px 14px;
    min-height: 44px;
  }
  .appbar__back{
    appearance:none; border:none; background:none; cursor:pointer;
    width:34px; height:34px; border-radius:50%;

  .country-grid{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .country-card{
    display:flex; align-items:center; gap:14px;
    background:#fff; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding: 14px; cursor:pointer; width:100%; text-align:left;
  }
  .country-card:active{ transform: scale(0.98); }
  .country-card__flag{ width:36px; height:24px; }
  .country-card__body{ flex:1; min-width:0; }
  .country-card__name{ font-weight:800; font-size:15.5px; }
  .country-card__capital{ font-size:12.5px; color: var(--slate); margin-top:1px; }

  /* ============================================================
     TRIP DETAILS
     ============================================================ */
  .chip-grid{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .chip{
    display:flex; align-items:center; gap:12px;
    background:#fff; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding: 12px 14px; cursor:pointer; width:100%; text-align:left;
  }
  .chip__label{ font-weight:700; font-size:14px; flex:1; }
  .chip__weeks{ font-family: var(--font-mono); font-size:10.5px; color: var(--slate); }
  .chip[data-selected="true"]{ border-color: var(--ink); background: var(--paper-dim); }
  .chip[data-selected="true"] .chip__weeks{ color: var(--ink); font-weight:700; }

  .field-label{ font-size:12.5px; font-weight:700; color: var(--ink); margin: 20px 2px 8px; display:block; }
  textarea.notes{
    width:100%; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding:12px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px;
    background:#fff;
  }
  textarea.notes:focus{ outline:none; border-color:var(--ink); }

  .date-row{ display:flex; gap:10px; }
  .date-field{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .date-field label{ font-size:11.5px; font-weight:700; color: var(--slate); }
  .date-field input[type="date"]{
    border:1.5px solid var(--paper-line); border-radius: var(--radius-s);
    padding:10px; font-family:inherit; font-size:13px; background:#fff; color: var(--ink);
  }
  .date-field input[type="date"]:focus{ outline:none; border-color:var(--ink); }
  .date-hint{ font-size:11.5px; color: var(--slate); margin:8px 2px 0; min-height:14px; }
  .date-hint[data-tone="bad"]{ color: var(--red-alert); }

  .feedback-scale{ display:flex; gap:8px; margin-top:6px; }
  .feedback-scale button{
    flex:1; appearance:none; cursor:pointer; background:#fff;
    border:1.5px solid var(--paper-line); border-radius: var(--radius-s);
    padding:12px 4px; font-family: var(--font-mono); font-weight:700; font-size:14px;
  }
  .feedback-scale button[data-selected="true"]{ border-color: var(--ink); background: var(--paper-dim); }
  .feedback-scale-labels{ display:flex; justify-content:space-between; font-size:10.5px; color: var(--slate); margin-top:5px; }
  .feedback-yn{ display:flex; gap:10px; margin-top:6px; }
  .feedback-yn button{
    flex:1; appearance:none; cursor:pointer; background:#fff;
    border:1.5px solid var(--paper-line); border-radius: var(--radius-s);
    padding:11px 12px; font-weight:700; font-size:13.5px;
  }
  .feedback-yn button[data-selected="true"]{ border-color: var(--ink); background: var(--paper-dim); }

  .sticky-cta{ position:sticky; bottom:0; padding-top:16px; background: linear-gradient(180deg, transparent, var(--paper) 30%); }

  /* ============================================================
     GENERATING SCREEN — signature split-flap moment
     ============================================================ */
  .generating{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; gap:22px; }
  .flap{
    font-family: var(--font-mono); font-weight:700; font-size:15px;
    background: var(--ink); color: var(--amber);
    padding: 14px 18px; border-radius: var(--radius-s);
    letter-spacing: 0.04em; min-width:230px;
  }
  .flap-char{ display:inline-block; }
  .generating__sub{ font-size:12.5px; color: var(--slate); }
  .spinner-dots{ display:flex; gap:6px; }
  .spinner-dots span{ width:7px; height:7px; border-radius:50%; background: var(--ink); animation: dotPulse 1s ease-in-out infinite; }
  .spinner-dots span:nth-child(2){ animation-delay:.15s; }
  .spinner-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes dotPulse{ 0%,80%,100%{ opacity:.25; transform:scale(.8);} 40%{ opacity:1; transform:scale(1);} }

  /* ============================================================
     DASHBOARD — flag-themed course home
     --flag-primary / --flag-secondary / --flag-tertiary / --flag-ink
     are injected inline per course. Everything below reads only
     from those variables, so no per-country CSS is hand-written.
     ============================================================ */
  .ticket{
    border-radius: var(--radius-m);
    background: linear-gradient(135deg, var(--flag-primary), color-mix(in srgb, var(--flag-primary) 55%, black));
    color: #fff;
    padding: 18px 16px 16px;
    margin-top:6px;
    position:relative;
    overflow:hidden;
  }
  .ticket__stripe{ display:flex; height:6px; border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .ticket__stripe span{ flex:1; }
  .ticket__eyebrow{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; opacity:.8; }
  .ticket__title{ font-size:21px; font-weight:800; margin-top:4px; letter-spacing:-0.01em; display:flex; align-items:center; gap:9px; }
  .ticket__flag{ width:30px; height:20px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .ticket__meta{ display:flex; gap:16px; margin-top:14px; }
  .ticket__meta div{ font-family: var(--font-mono); }
  .ticket__meta b{ display:block; font-size:15px; }
  .ticket__meta small{ font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; opacity:.75; }
  .ticket__progress{ margin-top:14px; }
  .ticket__progress-track{ height:6px; border-radius:6px; background: rgba(255,255,255,.25); overflow:hidden; }
  .ticket__progress-fill{ height:100%; background: var(--flag-secondary); border-radius:6px; }
  .ticket__progress-label{ font-family: var(--font-mono); font-size:10.5px; margin-top:6px; opacity:.85; }
  .ticket__cta{
    appearance:none; cursor:pointer; width:100%; margin-top:16px;
    background: rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.5);
    color:#fff; font-weight:700; font-size:13.5px; padding:11px 14px; border-radius:10px;
  }
  .ticket__cta:active{ background: rgba(255,255,255,.22); }
  .ticket__notch{
    position:absolute; right:-10px; top:50%; width:20px; height:20px; background: var(--paper);
    border-radius:50%; transform:translateY(-50%);
  }

  .week-list{ margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .week-row{
    display:flex; align-items:center; gap:12px;
    background:#fff; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding:13px 14px; width:100%; text-align:left; cursor:pointer;
  }
  .week-row[data-locked="true"]{ opacity:.5; cursor:default; }
  .week-row:not([data-locked="true"]):active{ transform:scale(0.98); }
  .week-row__num{
    font-family: var(--font-mono); font-weight:800; font-size:12px;
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: color-mix(in srgb, var(--flag-primary) 14%, white);
    color: var(--flag-primary);
  }
  .week-row__num[data-done="true"]{ background: var(--green-ok); color:#fff; }
  .week-row__title{ font-weight:700; font-size:13.5px; flex:1; }
  .week-row__tag{ font-family: var(--font-mono); font-size:10px; color: var(--slate); text-transform:uppercase; letter-spacing:.06em; }

  .culture-card{
    margin-top:18px; background: color-mix(in srgb, var(--flag-primary) 8%, white);
    border: 1.5px solid color-mix(in srgb, var(--flag-primary) 25%, white);
    border-radius: var(--radius-m); padding:14px;
  }
  .culture-card__label{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color: var(--flag-primary); font-weight:700; }
  .culture-card__body{ font-size:13.5px; margin-top:6px; line-height:1.45; }
  .etiquette-list{ margin:6px 0 0; padding-left:18px; font-size:13.5px; line-height:1.5; }
  .etiquette-list li{ margin-bottom:6px; }
  .etiquette-list li:last-child{ margin-bottom:0; }

  /* ============================================================
     LESSON SCREEN
     ============================================================ */
  .lesson-hero{
    background: var(--flag-primary); color:#fff; border-radius: var(--radius-m);
    padding:16px; margin-top:6px;
  }
  .lesson-hero__eyebrow{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
  .lesson-hero__title{ font-size:19px; font-weight:800; margin-top:4px; }

  .lesson-intro{ font-size:13.5px; line-height:1.5; color: var(--ink); margin-top:14px; }

  .vocab-grid{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .vocab-card{
    background:#fff; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding:12px 14px;
  }
  .vocab-card__en{ font-size:13.5px; color: var(--slate); }
  .vocab-card__local{ font-weight:800; font-size:16px; margin-top:2px; color: var(--flag-primary); }
  .vocab-card__translit{ font-family: var(--font-mono); font-size:11.5px; color: var(--slate); margin-top:2px; }

  /* ============================================================
     BEAT — a lesson is now a sequence of one-question-per-page
     screens ("beats"), not a walkthrough followed by a quiz. Each
     beat is scenario-framed and is one of three styles, mixed within
     a lesson: "produce" (how do you say X), "comprehend" (someone
     says X — what did they say), "symbol" (a sign/icon — what does
     it mean). See PRD §11a.
     ============================================================ */
  .beat-progress{ margin-top:14px; }
  .beat-progress__track{ height:6px; border-radius:6px; background: var(--paper-dim); overflow:hidden; }
  .beat-progress__fill{ height:100%; background: var(--flag-primary); border-radius:6px; }
  .beat-progress__label{
    font-family: var(--font-mono); font-size:10.5px; color: var(--slate);
    text-transform:uppercase; letter-spacing:.08em; margin-top:6px;
  }

  .beat-card{
    margin-top:16px; background:#fff; border:1.5px solid var(--paper-line);
    border-radius: var(--radius-m); padding:16px;
  }
  .beat-card__context{ font-size:13.5px; font-style:italic; color: var(--slate); line-height:1.45; margin-bottom:14px; }
  .beat-heard{
    font-weight:800; font-size:19px; text-align:center; color: var(--flag-primary);
    background: color-mix(in srgb, var(--flag-primary) 8%, white);
    border-radius: var(--radius-s); padding:14px; margin-bottom:14px;
  }
  .beat-symbol{ display:flex; justify-content:center; margin-bottom:14px; }
  .beat-symbol__icon{
    width:68px; height:68px; padding:14px; color: var(--flag-primary);
    background: color-mix(in srgb, var(--flag-primary) 8%, white);
    border: 1.5px solid color-mix(in srgb, var(--flag-primary) 25%, white);
    border-radius:50%;
  }
  .beat-symbol__icon svg{ display:block; width:100%; height:100%; }
  .beat-card__question{ font-weight:700; font-size:15px; margin-bottom:12px; }

  .quiz__opt{
    display:block; width:100%; text-align:left; background: var(--paper);
    border:1.5px solid var(--paper-line); border-radius: var(--radius-s);
    padding:10px 12px; font-size:13.5px; margin-bottom:7px; cursor:pointer;
  }
  .quiz__opt[data-state="correct"]{ background: rgba(30,143,95,.15); border-color: var(--green-ok); }
  .quiz__opt[data-state="wrong"]{ background: rgba(216,64,43,.12); border-color: var(--red-alert); }
  .quiz__feedback{ font-size:12.5px; font-weight:700; margin-top:4px; min-height:16px; }
  .quiz__feedback[data-tone="good"]{ color: var(--green-ok); }
  .quiz__feedback[data-tone="bad"]{ color: var(--red-alert); }

  .lesson-cta{ margin-top:20px; }
  .lesson-complete-badge{
    display:inline-flex; align-items:center; gap:6px; font-family: var(--font-mono);
    font-size:11px; color: var(--green-ok); font-weight:700; margin-top:10px;
  }

  /* ============================================================
     ADMIN SURFACE (demo-phase shortcut — see ADMIN-CONTENT-PLAN.md
     §10). Same ink/paper/amber tokens as the traveler app, but the
     400px phone frame is a poor fit for review queues and forms, so
     the frame widens and the status bar disappears whenever the top
     of the stack is an admin-* screen (see .app-shell.is-admin,
     toggled in render()).
     ============================================================ */
  @media (min-width: 640px){
    .app-shell.is-admin{
      width: 100%; max-width: 1080px; height: auto; min-height: 100vh;
      border-radius: 0; box-shadow: none;
    }
  }
  .app-shell.is-admin .statusbar{ display:none; }
  .app-shell.is-admin main#app{ padding: 4px 28px 96px; max-width: 900px; margin: 0 auto; width:100%; }

  .admin-role-toggle{ display:flex; gap:8px; margin: 6px 2px 20px; }
  .admin-role-toggle button{
    flex:1; padding:10px; border-radius: var(--radius-m); border:1.5px solid var(--paper-line);
    background:#fff; font-weight:700; font-size:12.5px; cursor:pointer; color: var(--slate);
  }
  .admin-role-toggle button[data-active="true"]{ background: var(--ink); color: var(--amber); border-color: var(--ink); }
  .admin-role-hint{ font-size:12px; color: var(--slate); margin: -12px 2px 20px; }

  .admin-card{
    display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--paper-line);
    border-radius: var(--radius-m); padding:16px; margin-bottom:10px; cursor:pointer;
  }
  .admin-card:active{ transform: scale(0.99); }
  .admin-card[disabled]{ opacity:.5; cursor:default; }
  .admin-card__title{ font-weight:800; font-size:15px; }
  .admin-card__meta{ font-size:12px; color: var(--slate); margin-top:4px; font-family: var(--font-mono); }

  .admin-status{
    font-family: var(--font-mono); font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; padding:3px 8px; border-radius:4px; display:inline-block; white-space:nowrap;
  }
  .admin-status--draft{ background: var(--paper-dim); color: var(--slate); }
  .admin-status--in_review{ background: rgba(255,179,0,.2); color: var(--amber-deep); }
  .admin-status--changes_requested{ background: rgba(216,64,43,.12); color: var(--red-alert); }
  .admin-status--approved{ background: rgba(30,143,95,.15); color: var(--green-ok); }
  .admin-status--published{ background: var(--ink); color: var(--amber); }
  .admin-status--archived{ background: var(--paper-dim); color: var(--slate); }

  .admin-list-row{
    display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--paper-line);
    border-radius: var(--radius-m); padding:12px 14px; margin-bottom:8px; cursor:pointer; width:100%; text-align:left;
  }
  .admin-list-row:active{ transform: scale(0.99); }
  .admin-list-row__flag{ width:30px; height:20px; flex-shrink:0; }
  .admin-list-row__mid{ flex:1; min-width:0; }
  .admin-list-row__name{ font-weight:700; font-size:14px; }
  .admin-list-row__sub{ font-size:11.5px; color: var(--slate); margin-top:2px; font-family: var(--font-mono); }

  .admin-empty{
    border: 1.5px dashed var(--paper-line); border-radius: var(--radius-m);
    padding: 20px 16px; text-align:center; color: var(--slate); font-size:13px; margin-top:6px;
  }

  .text-input{
    width:100%; border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding:12px; font-family:inherit; font-size:13.5px; background:#fff; color: var(--ink);
  }
  .text-input:focus{ outline:none; border-color:var(--ink); }
  .admin-form-grid{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
  .admin-colour-field{ display:flex; flex-direction:column; gap:4px; }
  .admin-colour-field label{ font-size:10.5px; color: var(--slate); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:.05em; }
  .admin-colour-field input[type="color"]{
    width:100%; height:38px; border:1.5px solid var(--paper-line); border-radius: var(--radius-s);
    padding:2px; background:#fff; cursor:pointer;
  }
  select.admin-select{
    width:100%; border:1.5px solid var(--paper-line); border-radius: var(--radius-m); padding:11px 12px;
    font-family:inherit; font-size:13.5px; background:#fff; color: var(--ink);
  }
  .admin-checkbox-row{
    display:flex; align-items:center; gap:10px; margin:16px 2px 6px;
    font-size:13px; font-weight:700; color: var(--ink); cursor:pointer;
  }
  .admin-checkbox-row input[type="checkbox"]{ width:18px; height:18px; flex-shrink:0; }

  .admin-preview{ margin-top:24px; padding-top:18px; border-top:1.5px dashed var(--paper-line); }
  .admin-preview__label{ font-family: var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color: var(--slate); margin-bottom:10px; }
  .admin-preview .country-card{ margin-bottom:14px; }
  .admin-preview .ticket{ margin-bottom:14px; }

  .admin-actions{ display:flex; gap:10px; }
  .admin-actions .btn-primary, .admin-actions .btn-secondary{ margin:0; }
  .admin-hint{ font-size:12.5px; color: var(--slate); margin-top:16px; padding:12px; background: var(--paper-dim); border-radius: var(--radius-m); }
  .admin-change-note{
    font-size:13px; color: var(--red-alert); background: rgba(216,64,43,.08);
    border:1.5px solid rgba(216,64,43,.25); border-radius: var(--radius-m); padding:12px 14px; margin: 4px 0 4px;
  }

  /* Module completeness grid (§4) and Lesson question editor (§3) */
  .admin-grid-scroll{ overflow-x:auto; margin-top:12px; }
  .admin-grid-table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:360px; }
  .admin-grid-table th, .admin-grid-table td{ border:1px solid var(--paper-line); padding:0; text-align:center; }
  .admin-grid-table th{
    background: var(--paper-dim); font-family: var(--font-mono); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--slate); padding:8px 6px;
  }
  .admin-grid-table td.admin-grid-row-label{
    text-align:left; font-weight:700; background: var(--paper-dim); padding:8px 10px; white-space:nowrap;
  }
  .admin-grid-cell{
    cursor:pointer; border:none; background:none; width:100%; padding:10px 6px; font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .admin-grid-cell:hover{ background: rgba(0,0,0,.04); }

  .admin-question-card{
    border:1.5px solid var(--paper-line); border-radius: var(--radius-m);
    padding:14px; margin-bottom:12px; background:#fff;
  }
  .admin-question-card__head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .admin-question-card__index{ font-family: var(--font-mono); font-size:11px; color:var(--slate); font-weight:700; text-transform:uppercase; }

  .admin-question-card .field-label{ margin:12px 2px 6px; }
  .admin-question-card .field-label:first-of-type{ margin-top:0; }
</style>
</head>
<body>

<!--
  App shell: a fixed status bar (cosmetic — establishes "this is a phone
  screen" framing for reviewers), an app bar that is re-rendered per
  screen (title/back-button/badge change with context), the single
  #app mount point that all screens render into, and a bottom tab bar
  where only "Trips" is implemented — Explore/Profile are visible but
  disabled to signal planned-but-out-of-scope surface area.
-->
<div class="app-shell">
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons">
      <span class="statusbar__bars"><span></span><span></span><span></span><span></span></span>
      <span class="statusbar__batt"></span>
    </span>
  </div>

  <header class="appbar" id="appbar"></header>

  <main id="app"></main>

  <!--
    Admin entry point (see ADMIN-CONTENT-PLAN.md §10): the 4th "Admin" tab
    below drops into the admin stack (admin-home / admin-destinations /
    admin-review-queue / admin-destination), rendered full-width with the
    Author/Approver role toggle standing in for real auth — see
    .app-shell.is-admin and the admin-* SCREENS entries.
    STILL NOT the intended end state: this is demo-phase scaffolding for
    validating the flows. The real admin surface should be its own
    separate app, optimised for desktop/laptop, not a mode bolted onto
    this mobile traveler app or shipped in the same bundle.
  -->
  <div class="tabbar">
    <button class="tabbar__item" data-active="true" data-action="go-home"><span>Trips</span></button>
    <button class="tabbar__item" disabled data-action="stub-tab"><span>Explore</span></button>
    <button class="tabbar__item" disabled data-action="stub-tab"><span>Profile</span></button>
    <button class="tabbar__item" data-action="go-admin"><span>Admin</span></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================================================================
   FLAG ICONS
   Deliberately NOT Unicode flag emoji: those are font-dependent —
   several common platforms (older Windows, many Linux desktops
   without a colour-emoji font) fall back to rendering a flag
   sequence as plain two-letter text, which defeats the entire point
   of "flag = instant visual identity" from PRD §6/§11. These are
   small inline SVGs instead, so every user sees the same coloured
   flag regardless of OS/font support.
   ================================================================ */
const FLAGS = {

// Generic 8-week syllabus shell. Weeks 1-3 ship as built, interactive
// lessons in this prototype (see PRD §8) — weeks beyond that render as
// locked/upcoming to demonstrate progressive unlock rather than dumping
// the whole course on day one. Week 3 is always the "culture" lesson
// (Public Transport) rather than another phrase drill, so every course
// proves out the etiquette/customs side of the product, not just vocab.
//
// TODO(admin): This whole hardcoded 8-entry array is what a Blueprint (see
// TRIP_TYPES TODO above) should generate instead. As a traveler, the
// syllabus I see should come from resolving my Trip Type's published
// Blueprint — walking its Legs, and within each Leg pulling the published
// Lesson at the right Tier for each gated Module — against the country
// I'm traveling to, not slicing a fixed array by week count. As a content
// author, I need a "dry-run" preview (reusing screenDashboard's rendering,
// see that TODO below) that runs this same resolution against my Draft
// Blueprint for a chosen country, so I can see the real Leg-by-Leg
// syllabus before submitting for review. See ADMIN-CONTENT-PLAN.md §5.
function syllabus(tripKey){
  const t = TRIP_TYPES[tripKey];
  const all = [
    { title:"Airport & Arrival Essentials", type:"Phrase" },
    { title:t.lesson2, type:"Phrase" },
    { title:"Public Transport & Getting Around", type:"Culture" },
    { title:"Local Etiquette Deep-Dive", type:"Culture" },
    { title:"Numbers, Time & Directions", type:"Phrase" },
    { title:"Food, Drink & Dining Out", type:"Phrase" },
    { title:"Handling the Unexpected", type:"Phrase" },
    { title:"Review & Trip-Ready Checkpoint", type:"Culture" }
  ];
  return all.slice(0, t.weeks);
}

/* ================================================================
   ADMIN CONTENT BANK (demo-phase, in-memory) — ADMIN-CONTENT-PLAN.md
   §2a/§6. This pass implements the Destination-creation flow plus the
   shared approval state machine; Phrase/Question/Lesson/Module/
   Blueprint authoring (§3-5) follow the same record/status shape as a
   later pass and are stubbed as "coming soon" in screenAdminHome.

   State machine (identical for every content type per §6):
     draft -> in_review -> approved -> published -> archived
                 ^              |
                 └─ changes_requested (author edits, resubmits)

   Seeded with the six existing hardcoded COUNTRIES as read-only-by-
   default "published" legacy rows so the review queue/state machine
   has real content on day one, and a 7th destination can be authored
   right alongside them — the exact motivating example from
   ADMIN-CONTENT-PLAN.md §1/§2a. A legacy row can still be revised via
   "Create new draft version," which produces a normal (non-legacy)
   draft that, once published, archives the legacy row.
   ================================================================ */
const FLAG_PATTERNS = {
  "vertical-tricolor": "Vertical tricolor",
  "horizontal-tricolor": "Horizontal tricolor",
  "circle-on-field": "Circle on field",
  "cross-on-field": "Cross on field"
};

// Per PRD §12, flags are hand-built shapes from the destination's three
// colours, not an upload/photo picker — this is that "small in-app tool"
// called for in ADMIN-CONTENT-PLAN.md §2a step 2, applied to whichever
// colours the author has picked so far.
function buildFlagSvg(pattern, colours){
  const p = colours.primary, s = colours.secondary, t = colours.tertiary;
  switch (pattern){
    case "horizontal-tricolor":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${s}"/><rect width="30" height="6.67" fill="${p}"/><rect y="13.33" width="30" height="6.67" fill="${t}"/></svg>`;
    case "circle-on-field":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${s}"/><circle cx="15" cy="10" r="6" fill="${p}"/><circle cx="15" cy="10" r="6" fill="none" stroke="${t}" stroke-width="1.2"/></svg>`;
    case "cross-on-field":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${t}"/><rect x="12" width="6" height="20" fill="${s}"/><rect y="7" width="30" height="6" fill="${s}"/><rect x="13.2" width="3.6" height="20" fill="${p}"/><rect y="8.2" width="30" height="3.6" fill="${p}"/></svg>`;
    case "vertical-tricolor":
    default:
      return `<svg viewBox="0 0 30 20"><rect width="10" height="20" fill="${p}"/><rect x="10" width="10" height="20" fill="${s}"/><rect x="20" width="10" height="20" fill="${t}"/></svg>`;
  }
}

function adminFlagMarkup(record){
  if (record.legacy) return FLAGS[record.countryKey];
  return buildFlagSvg(record.data.flagPattern || "vertical-tricolor", record.data.colours);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "destination";

let adminIdSeq = 1;

/* ----------------------------------------------------------------
   Language — a lightweight taxonomy dimension, not approval-gated
   content (no draft/review lifecycle like Country/Module/Lesson get).
   Every Country names one Language it uses; Modules/Lessons authored
   as "applies to all countries using this language" resolve against
   whichever Countries currently carry that languageId, so adding a
   7th country in an already-covered language picks up that content
   automatically instead of needing it re-authored per country.
   ---------------------------------------------------------------- */
let adminLanguages = [];
function ensureLanguage(name){
  let lang = adminLanguages.find(l => l.name.toLowerCase() === name.toLowerCase());
  if (!lang){
    lang = { id: nextAdminId("lang"), name };
    adminLanguages.push(lang);
  }
  return lang;
}
const COUNTRY_LANGUAGES = {
  japan: "Japanese", italy: "Italian", greece: "Greek",
  mexico: "Spanish", morocco: "Arabic", france: "French"
};
Object.values(COUNTRY_LANGUAGES).forEach(ensureLanguage);

let adminDestinations = Object.entries(COUNTRIES).map(([key, c]) => ({
  id: nextAdminId("dest"),
  countryKey: key,
  status: "published",
  version: 1,
  legacy: true,
  changeNote: null,
  data: {
    name: c.name,
    capital: c.capital,
    colours: { ...c.colours },
    flagPattern: null,
    cultureTip: c.cultureTip,
    languageId: ensureLanguage(COUNTRY_LANGUAGES[key]).id
  }
}));

let adminLanguageDraft = null; // working copy of a Language while an Author is editing it

let adminRole = "author"; // "author" | "approver" — stands in for real auth, per §10
let adminDraft = null;    // working copy of a destination while an Author is editing it

// Destinations Module/Lesson content is authored against — only published
// ones are offered, so authoring a 7th destination (see the Destination
// flow above) genuinely unlocks it as a target here, the same way it
// would gate a real Blueprint's country coverage (§4/§6).
function publishedDestinations(){
  return adminDestinations.filter(d => d.status === "published");
}

/* ================================================================
   ADMIN CONTENT BANK — Module (§4) + Lesson (§3)

   A Lesson always names the Module + Tier it belongs to; a Module's
   "tier ladder completeness" grid (§4 step 3) is derived by scanning
   Lessons for that (moduleId, tier[, countryKey]) rather than stored
   redundantly, so the two can never drift out of sync. Publishing a
   Module is blocked until every cell it claims is itself Published
   (moduleIsComplete below) — the gating cascade from §6.

   Question authoring here is a deliberate simplification of §3 step 2:
   the plan calls for a searchable, reusable Phrase/Question library
   ("attach by reference, only create new if nothing fits" — see §7).
   This pass authors each Question inline on the Lesson instead of
   against a separate library, so content isn't actually reused across
   Lessons yet — the record shape (kind/context/prompt/answer/
   distractors) is what a future library-backed picker would slot into
   without a rewrite.
   ================================================================ */
let adminModules = [];
let adminModuleDraft = null;
let adminLessons = [];
let adminLessonDraft = null;
let adminLessonPreviewIndex = 0; // which authored question the Lesson editor's live preview is showing

const ADMIN_STATUS_RANK = { missing:0, archived:0, draft:1, changes_requested:1, in_review:2, approved:3, published:4 };

function countryByKey(countryKey){
  return adminDestinations.find(d => d.countryKey === countryKey) || null;
}
// Countries currently published under a Language — deliberately computed
// live rather than stored on the Language/Module/Lesson, so a Country
// added later in an already-authored Language picks up "applies to all
// countries using this language" content without that content needing
// to be re-saved.
function countriesForLanguage(languageId){
  return publishedDestinations().filter(d => d.data.languageId === languageId);
}
function languageName(languageId){
  const lang = adminLanguages.find(l => l.id === languageId);
  return lang ? lang.name : "Unknown language";
}
function moduleScopeLabel(mod){
  if (mod.data.kind === "generic") return "Generic — every country";
  if (mod.data.languageWide) return `All countries using ${languageName(mod.data.languageId)}`;
  const country = countryByKey(mod.data.countryKey);
  return country ? country.data.name : "No country set";
}
function lessonScopeLabel(lesson){
  if (lesson.data.scope === "generic") return "Generic — every country";
  if (lesson.data.languageWide) return `All countries using ${languageName(lesson.data.languageId)}`;
  const country = countryByKey(lesson.data.countryKey);
  return country ? country.data.name : "No country set";
}
// A bespoke Module/Lesson "applies to" a country either because it's
// pinned to that exact country, or because it's language-wide and the
// country's languageId matches — this is the hook that makes browsing
// modules/lessons for a Country also surface content authored against
// that Country's Language.
function moduleAppliesToCountry(mod, countryKey){
  if (mod.data.kind === "generic") return true;
  if (mod.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!mod.data.languageId && country.data.languageId === mod.data.languageId;
  }
  return mod.data.countryKey === countryKey;
}
function lessonAppliesToCountry(lesson, countryKey){
  if (lesson.data.scope === "generic") return true;
  if (lesson.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!lesson.data.languageId && country.data.languageId === lesson.data.languageId;
  }
  return lesson.data.countryKey === countryKey;
}
// Stricter match used for the tier-ladder grid/blueprint resolution: only
// a Lesson actually scoped to a country (bespoke, not "generic") can fill
// a bespoke Module's per-country cell — see moduleLessonCandidates below.
function lessonMatchesGridCountry(lesson, countryKey){
  if (lesson.data.scope !== "country-specific") return false;
  if (lesson.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!lesson.data.languageId && country.data.languageId === lesson.data.languageId;
  }
  return lesson.data.countryKey === countryKey;
}

function moduleLessonCandidates(mod, tier, countryKey){
  return adminLessons.filter(l =>
    l.data.moduleId === mod.id &&
    l.data.tier === tier &&
    (mod.data.kind === "generic" ? l.data.scope === "generic" : lessonMatchesGridCountry(l, countryKey))
  );
}
function moduleCellStatus(mod, tier, countryKey){
  const candidates = moduleLessonCandidates(mod, tier, countryKey);
  if (!candidates.length) return "missing";
  return candidates.reduce((best, l) => ADMIN_STATUS_RANK[l.status] > ADMIN_STATUS_RANK[best] ? l.status : best, "missing");
}
// A language-wide bespoke Module's grid rows are every published country
// currently using its Language (see countriesForLanguage) rather than a
// fixed list, so the completeness grid stays accurate as new countries
// join that language.
function moduleGridRows(mod){
  if (mod.data.kind === "generic") return [null];
  if (mod.data.languageWide) return countriesForLanguage(mod.data.languageId).map(d => d.countryKey);
  return mod.data.countryKey ? [mod.data.countryKey] : [];
}
function moduleIsComplete(mod){
  const rows = moduleGridRows(mod);
  if (!rows.length) return false;
  for (const countryKey of rows){
    for (let tier = 1; tier <= mod.data.tierCount; tier++){
      if (moduleCellStatus(mod, tier, countryKey) !== "published") return false;
    }
  }
  return true;
}

// Turns an admin-authored Question row into the exact beat shape
// renderBeat()/makeQuestion() already produce for the traveler-facing
// lesson screen (see buildBeat below), so the Lesson editor's live
// preview is the literal traveler beat renderer, not a lookalike copy —
// ADMIN-CONTENT-PLAN.md §3 step 3.
function adminQuestionToBeat(q){
  const mq = makeQuestion(q.question, q.correctAnswer, (q.distractors || []).filter(Boolean));
  if (q.kind === "symbol") return { kind:"symbol", context:q.context, symbol:q.symbol, ...mq };
  if (q.kind === "comprehend") return { kind:"comprehend", context:q.context, heard:q.heard, ...mq };
  return { kind:q.kind, context:q.context, ...mq };
}

/* ================================================================
   ADMIN CONTENT BANK — Trip Type Blueprint (§5)

   Simplification: authored against the 6 existing hardcoded TRIP_TYPES
   keys rather than also supporting "define a new Trip Type" (§5 step 1)
   — adding a wholly new trip type is really its own small Destination-
   shaped flow (name a thing, theme it) and isn't needed to demonstrate
   the Blueprint/Leg/gating machinery itself.

   Leg gating is deliberately cheap to compute: a Module's own Publish
   action already requires moduleIsComplete() (§4) — every Tier it
   claims, for every country it claims, has a Published Lesson — so a
   Blueprint only needs to check that every Module it gates in is
   itself Published; it doesn't need to re-walk tiers/countries itself.
   ================================================================ */
const LEG_LADDER = ["Slightly Scared Tourist", "Confident Traveller", "Seasoned Explorer", "Honorary Local"];

let adminBlueprints = [];
let adminBlueprintDraft = null;
let adminBlueprintPreviewCountry = null;

function blankLeg(name){
  return { name: name || "", blurb: "", moduleGates: [] };
}

function resolveBlueprintGateLesson(gate, countryKey){
  const mod = adminModules.find(m => m.id === gate.moduleId);
  if (!mod) return null;
  return adminLessons.find(l =>
    l.status === "published" &&
    l.data.moduleId === mod.id &&
    l.data.tier === gate.tier &&
    (mod.data.kind === "generic" ? l.data.scope === "generic" : lessonMatchesGridCountry(l, countryKey))
  ) || null;
}

function blueprintIsPublishable(bp){
  const allGates = bp.data.legs.flatMap(leg => leg.moduleGates);
  if (!allGates.length) return false;
  return allGates.every(gate => {
    const mod = adminModules.find(m => m.id === gate.moduleId);
    return mod && mod.status === "published";
  });
}

// Resolves a traveler's (countryKey, tripKey) against a published
// Blueprint for that Trip Type (§8/§9), one "week" per gated Module in
// Leg order. Skips empty Legs and any gate that fails to resolve for
// this specific country (only possible for a bespoke Module gated to a
// different country than the traveler picked — a published Blueprint
// otherwise guarantees every gate resolves, since Module publish itself
// requires every tier/country cell to already be a published Lesson).
// Returns null if there's no published Blueprint for this Trip Type, or
// nothing resolves for this country — the caller falls back to the
// legacy hardcoded syllabus() so unauthored Trip Types keep working.
function resolveBlueprintSyllabus(countryKey, tripKey){
  const bp = adminBlueprints.find(b => b.status === "published" && b.data.tripKey === tripKey);
  if (!bp) return null;
  const legs = [];
  const weeks = [];
  bp.data.legs.forEach(leg => {
    if (!leg.moduleGates.length) return;
    const legIndex = legs.length;
    let legUsed = false;
    leg.moduleGates.forEach(gate => {
      const lesson = resolveBlueprintGateLesson(gate, countryKey);
      if (!lesson) return;
      if (!legUsed){ legs.push({ name: leg.name, blurb: leg.blurb }); legUsed = true; }
      weeks.push({ title: lesson.data.title, type: lesson.data.type, source: "authored", legIndex, lessonId: lesson.id });
    });
  });
  if (!weeks.length) return null;
  return { legs, weeks };
}

function push(name, payload){ stack.push({ name, payload }); render(); }
function pop(){ if (stack.length > 1){ stack.pop(); render(); } }
function resetToHome(){ stack = [{ name:"home" }]; render(); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("is-visible");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove("is-visible"), 1600);
}

/* ================================================================
   SCREEN: HOME

   ASSUMPTION: The departure-board status language (BOARDING / IN
   PROGRESS / LANDED) is more legible and motivating at a glance than a
   conventional progress bar or percentage, and reinforces "this is
   finite, not a subscription" without needing explanatory copy.

   HYPOTHESIS: We believe users correctly infer course state from the
   status labels alone — without confusing "Boarding" for "not started
   yet, nothing to do," or "Landed" for "archived/inaccessible." We'll
   know this is wrong if usability sessions show users misreading a
   status label, or hesitating over what action to take from a given
   status.

   VALIDATION METRIC: Quick comprehension check in early usability
   sessions — show the home screen and ask users to say, in their own
   words, what each status means and what happens if they tap it; track
   % correct per label. In-app, tap-through rate on "Landed" rows (do
   people still open completed courses, e.g. to revisit the phrasebook)
   as a secondary signal.
   ================================================================ */
function screenHome(){
  const current = courses.filter(c => c.status === "active");
  const previous = courses.filter(c => c.status === "completed");

  const currentHtml = current.length
    ? current.map(rowHtml).join("")
    : `
      <div class="board-empty">
        <div class="board-empty__flap">NO ACTIVE TRIP</div>
        <button class="btn-primary" data-action="start-course">Book a course</button>
      </div>`;

  const previousHtml = previous.length
    ? previous.map(rowHtml).join("")
    : `<p style="font-size:12.5px;color:var(--slate);padding:4px 2px;">Completed courses will land here.</p>`;

  return `
    <div class="section-label">Current</div>
    ${currentHtml}
    <div class="section-label">Previous</div>
    ${previousHtml}
  `;

  // TODO(admin): As a traveler, I want this row's subtitle to read "Leg 2
  // of 3 · Lesson 2 of 4" instead of "Week 4 of 7", once courses carry
  // currentLeg/totalLegs/legName (see STATE and finalizeCourse TODOs
  // above) — the Home board is the other place progression should be
  // legible at a glance, not just inside the dashboard. See
  // ADMIN-CONTENT-PLAN.md §9.
  function rowHtml(c){
    const country = COUNTRIES[c.countryKey];
    const statusClass = c.status === "completed" ? "status--landed" : (c.currentWeek <= 1 ? "status--boarding" : "status--progress");
    const statusText = c.status === "completed" ? "Landed" : (c.currentWeek <= 1 ? "Boarding" : "In progress");
    return `
      <button class="board-row" data-action="open-course" data-course="${c.id}">
        <span class="board-row__flag flag-icon">${FLAGS[c.countryKey]}</span>
        <span class="board-row__mid">
          <div class="board-row__dest">${country.name.toUpperCase()} · ${TRIP_TYPES[c.tripKey].label}</div>
          <div class="board-row__sub">${c.status === "completed" ? "Completed · " + c.weeks + " wks" : "Week " + c.currentWeek + " of " + c.weeks}${needsFeedback(c) ? " · Feedback requested" : ""}</div>
        </span>
        <span class="board-row__status ${statusClass}">${statusText}</span>
      </button>`;
  }
}

/* ================================================================
   SCREEN: COUNTRY PICKER

   ASSUMPTION: The 6 hard-coded countries (Japan, Italy, Greece, Mexico,
   Morocco, France) are a representative-enough sample of where early
   testers are actually traveling to validate the "trip-scoped course"
   concept — not an arbitrary set chosen because it looks good in a demo.

   HYPOTHESIS: We believe these 6 destinations cover enough of our early
   tester pool's actual trips that we can validate the core concept
   without broader country coverage yet. We'll know this assumption is
   wrong if a meaningful share of prospective testers' destinations
   aren't on the list.

   VALIDATION METRIC: During recruiting/onboarding, capture each early
   tester's actual destination (even before they use the app) and
   compare against this 6-country list — track % mismatch. In-app, an
   "add a country" request tap (logged with free-text) as a lighter-
   weight ongoing signal once testing is live.
   ================================================================ */
function screenCountry(){

    <p style="font-size:13px;color:var(--slate);margin:6px 2px 14px;">Step 1 of 2 — where are you headed? Your course will be themed around that destination.</p>
    <div class="country-grid">
      ${Object.entries(COUNTRIES).map(([key, c]) => `

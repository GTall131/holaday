    <button class="admin-list-row" data-action="admin-open-language" data-id="${l.id}">

function languagesFilterHtml(){

function languagesLessonsTabHtml(){

function languagesPhrasesTabHtml(){

  return `
    ${languagesFilterHtml()}
    ${contentListRowsHtml([], [], phrases)}

}

// Shared by the Country and Language detail screens — rows for whatever
// Modules/Lessons/Phrases are relevant, using the same scope-label
// vocabulary (moduleScopeLabel/lessonScopeLabel/phraseScopeLabel) so
// "why is this listed here" reads the same way in both places.
function contentListRowsHtml(mods, lessons, phrases){
  phrases = phrases || [];
  if (!mods.length && !lessons.length && !phrases.length) return `<div class="admin-empty">No modules, lessons, or phrases here yet.</div>`;
  return mods.map(m => `
    <button class="admin-list-row" data-action="admin-open-module" data-id="${m.id}">
      <span class="admin-list-row__mid">
        <div class="admin-list-row__name">${escapeHtml(m.data.name)}</div>
        <div class="admin-list-row__sub">Module · ${moduleScopeLabel(m)}</div>
      </span>
      ${adminStatusChip(m.status)}
    </button>
  `).join("") + lessons.map(l => `
    <button class="admin-list-row" data-action="admin-open-lesson" data-id="${l.id}">
      <span class="admin-list-row__mid">
        <div class="admin-list-row__name">${escapeHtml(l.data.title)}</div>
        <div class="admin-list-row__sub">Lesson · ${lessonScopeLabel(l)}</div>
      </span>
      ${adminStatusChip(l.status)}
    </button>
  `).join("") + phrases.map(p => `
    <button class="admin-list-row" data-action="admin-open-phrase" data-id="${p.id}">
      <span class="admin-list-row__mid">
        <div class="admin-list-row__name">${escapeHtml(p.data.en)}</div>
        <div class="admin-list-row__sub">Phrase · ${phraseScopeLabel(p)}</div>
      </span>
      ${adminStatusChip(p.status)}

  `).join("");
}

// Reads the editable form fields into `adminDraft` — called before every
// Save Draft / Stage, same "read on submit" pattern as confirm-trip
// (trip-notes/trip-start/trip-end) rather than binding on every
// keystroke, so the fields never lose focus mid-render.
function readAdminDestinationForm(){
  adminDraft.data.name = document.getElementById("admin-dest-name").value.trim();
  adminDraft.data.capital = document.getElementById("admin-dest-capital").value.trim();
  const languageSelectValue = document.getElementById("admin-dest-language").value;
  const newLanguageEl = document.getElementById("admin-dest-language-new");
  if (languageSelectValue === "__new__"){
    adminDraft.data.languageId = "__new__";
    adminDraft.data.newLanguageName = newLanguageEl ? newLanguageEl.value : "";
  } else {
    adminDraft.data.languageId = languageSelectValue || null;
    adminDraft.data.newLanguageName = "";
  }
  adminDraft.data.cultureTip = document.getElementById("admin-dest-culturetip").value.trim();
  adminDraft.data.flagPattern = document.getElementById("admin-dest-pattern").value;
  adminDraft.data.colours = {
    primary: document.getElementById("admin-dest-primary").value,
    secondary: document.getElementById("admin-dest-secondary").value,
    tertiary: document.getElementById("admin-dest-tertiary").value
  };
}

function commitAdminDraft(status){
  readAdminDestinationForm();
  if (!adminDraft.data.name){
    showToast("Destination name is required");
    return false;
  }
  if (adminDraft.data.languageId === "__new__"){
    const newName = (adminDraft.data.newLanguageName || "").trim();
    if (!newName){
      showToast("Type a name for the new language");
      return false;
    }
    adminDraft.data.languageId = ensureLanguage(newName).id;
    adminDraft.data.newLanguageName = "";
  }
  if (!adminDraft.data.languageId){
    showToast("Pick a language for this destination");
    return false;
  }
  if (!adminDraft.id){
    adminDraft.id = nextAdminId("dest");
    adminDraft.countryKey = slugify(adminDraft.data.name);
    adminDraft.version = 1;
    adminDraft.legacy = false;
    adminDestinations.push(adminDraft);
  } else {
    const idx = adminDestinations.findIndex(d => d.id === adminDraft.id);
    if (idx >= 0) adminDestinations[idx] = adminDraft;
  }
  adminDraft.status = status;
  return true;
}

// Live-updates the preview pane straight from the DOM on every keystroke/
// colour change, same "direct DOM patch, no full render()" approach as
// updateTripCta — a full re-render here would close the native colour
// picker mid-pick and drop cursor position in the text fields.
function refreshAdminPreview(){
  const nameEl = document.getElementById("admin-dest-name");
  if (!nameEl) return;
  const name = nameEl.value.trim() || "Untitled destination";
  const capital = document.getElementById("admin-dest-capital").value.trim() || "—";
  const cultureTip = document.getElementById("admin-dest-culturetip").value.trim() || "No culture tip written yet.";
  const colours = {
    primary: document.getElementById("admin-dest-primary").value,
    secondary: document.getElementById("admin-dest-secondary").value,
    tertiary: document.getElementById("admin-dest-tertiary").value
  };
  const flagSvg = buildFlagSvg(document.getElementById("admin-dest-pattern").value, colours);

  document.getElementById("admin-preview-name").textContent = name;
  document.getElementById("admin-preview-name2").textContent = name;
  document.getElementById("admin-preview-capital").textContent = capital;
  document.getElementById("admin-preview-culturetip").textContent = cultureTip;
  document.getElementById("admin-preview-flag-a").innerHTML = flagSvg;
  document.getElementById("admin-preview-flag-b").innerHTML = flagSvg;

  const ticket = document.getElementById("admin-preview-ticket");
  applyFlagVars(ticket, colours);
  ticket.querySelectorAll(".ticket__stripe span").forEach((span, i) => {
    span.style.background = [colours.primary, colours.secondary, colours.tertiary][i];
  });
}

// Mirrors readAdminDestinationForm/commitAdminDraft: read-on-submit
// rather than live-bound, but here it's also called before every action
// that re-renders the grid (kind/tierCount/country toggles) so a real
// re-render never clobbers whatever's currently in the Name field.
function readAdminModuleForm(){
  const d = adminModuleDraft.data;
  d.name = document.getElementById("admin-module-name").value.trim();
  d.kind = document.getElementById("admin-module-kind").value;
  d.tierCount = Math.max(1, Math.min(6, Number(document.getElementById("admin-module-tiercount").value) || 1));

  const languageEl = document.getElementById("admin-module-language");
  d.languageId = (d.kind === "bespoke" && languageEl) ? (languageEl.value || null) : null;
  const wideEl = document.getElementById("admin-module-languagewide");
  d.languageWide = (d.kind === "bespoke" && wideEl) ? wideEl.checked : false;
  const countryEl = document.getElementById("admin-module-country");
  d.countryKey = (d.kind === "bespoke" && !d.languageWide && countryEl) ? (countryEl.value || null) : null;
}

function commitAdminModuleDraft(status){
  readAdminModuleForm();
  const d = adminModuleDraft.data;
  if (!d.name){
    showToast("Module name is required");
    return false;
  }
  if (d.kind === "bespoke"){
    if (!d.languageId){
      showToast("Pick a language for a bespoke module");
      return false;
    }
    if (!d.languageWide && !d.countryKey){
      showToast("Pick a country, or tick 'applies to all countries using this language'");
      return false;
    }
  }
  if (!adminModuleDraft.id){
    adminModuleDraft.id = nextAdminId("mod");
    adminModuleDraft.version = 1;
    adminModules.push(adminModuleDraft);
  } else {
    const idx = adminModules.findIndex(m => m.id === adminModuleDraft.id);
    if (idx >= 0) adminModules[idx] = adminModuleDraft;
  }
  adminModuleDraft.status = status;
  return true;
}

/* ================================================================
   ADMIN SCREENS — Lesson (§3)
   ================================================================ */
function blankAdminQuestion(){
  return {
    kind:"produce", context:"", question:"", correctAnswer:"", distractors:[],
    symbol:Object.keys(SYMBOLS)[0], heard:"", source:"custom", phraseId:null
  };
}

// Phrase pool a Lesson's produce/comprehend Questions can draw from
// (§7) — only offered for a country-specific Lesson, since a Phrase is
// always text in one specific local language and a "generic" Lesson has
// no definite language to draw from.
function phrasesForLesson(lessonData){
  if (lessonData.scope !== "country-specific" || !lessonData.languageId) return [];
  if (lessonData.languageWide){
    return adminPhrases.filter(p => p.data.languageWide && p.data.languageId === lessonData.languageId);
  }
  return adminPhrases.filter(p => phraseAppliesToCountry(p, lessonData.countryKey));
}

// Known gap: the Module and Scope selects below are independently
// editable with no cross-validation, so a Lesson can still be hand-
// edited into a Module/Scope combination that no longer matches any
// grid cell in that Module (moduleLessonCandidates filters generic-
// Module cells to scope:"generic" lessons and bespoke-Module cells to
// lessonMatchesGridCountry matches only). Pre-existing, orthogonal to
// lesson creation now being Module-only — not fixed here.
function readAdminLessonForm(){
  const d = adminLessonDraft.data;
  d.title = document.getElementById("admin-lesson-title").value.trim();
  d.type = document.getElementById("admin-lesson-type").value;
  d.moduleId = document.getElementById("admin-lesson-module").value || null;
  d.tier = Math.max(1, Number(document.getElementById("admin-lesson-tier").value) || 1);
  d.scope = document.getElementById("admin-lesson-scope").value;
  const languageEl = document.getElementById("admin-lesson-language");
  d.languageId = (d.scope === "country-specific" && languageEl) ? (languageEl.value || null) : null;
  const wideEl = document.getElementById("admin-lesson-languagewide");
  d.languageWide = (d.scope === "country-specific" && wideEl) ? wideEl.checked : false;
  const countryEl = document.getElementById("admin-lesson-country");
  d.countryKey = (d.scope === "country-specific" && !d.languageWide && countryEl) ? (countryEl.value || null) : null;

  d.questions.forEach((q, i) => {
    const kindEl = document.getElementById(`q-kind-${i}`);
    if (!kindEl) return; // row was removed from the DOM already
    q.kind = kindEl.value;
    const sourceEl = document.getElementById(`q-source-${i}`);
    if (sourceEl) q.source = sourceEl.value;
    const phraseEl = document.getElementById(`q-phrase-${i}`);
    if (phraseEl) q.phraseId = phraseEl.value || null;

    // Every field below is guarded on the element actually existing, not
    // just symbol/heard (the original two exceptions) — since a
    // phrase-sourced question (§7) hides question/correctAnswer/
    // distractors/heard in favour of the phrase picker, and the symbol/
    // heard fields only exist in the DOM when the row's kind already was
    // symbol/comprehend at last render. Either way, if a read was
    // triggered by a select switching TO a state whose fields haven't
    // rendered yet, keep whatever value was already on the draft
    // (blankAdminQuestion seeds a sane default).
    const contextEl = document.getElementById(`q-context-${i}`);
    if (contextEl) q.context = contextEl.value.trim();
    const questionEl = document.getElementById(`q-question-${i}`);
    if (questionEl) q.question = questionEl.value.trim();
    const answerEl = document.getElementById(`q-answer-${i}`);
    if (answerEl) q.correctAnswer = answerEl.value.trim();
    const distractorsEl = document.getElementById(`q-distractors-${i}`);
    if (distractorsEl) q.distractors = distractorsEl.value.split(",").map(s => s.trim()).filter(Boolean);
    const symbolEl = document.getElementById(`q-symbol-${i}`);
    if (q.kind === "symbol" && symbolEl) q.symbol = symbolEl.value;
    const heardEl = document.getElementById(`q-heard-${i}`);
    if (q.kind === "comprehend" && heardEl) q.heard = heardEl.value.trim();
  });
}

function commitAdminLessonDraft(status){
  readAdminLessonForm();
  const d = adminLessonDraft.data;
  if (!d.title){ showToast("Lesson title is required"); return false; }
  if (!d.moduleId){ showToast("Pick a module for this lesson"); return false; }
  const mod = adminModules.find(m => m.id === d.moduleId);
  if (mod && d.tier > mod.data.tierCount){ showToast(`${mod.data.name} only goes up to Tier ${mod.data.tierCount}`); return false; }
  if (d.scope === "country-specific"){
    if (!d.languageId){ showToast("Pick a language for this lesson"); return false; }
    if (!d.languageWide && !d.countryKey){ showToast("Pick a country, or tick 'applies to all countries using this language'"); return false; }
  }

  if (status === "staged"){
    if (d.questions.length < 5){ showToast("Needs at least 5 questions before it can be staged"); return false; }
    if (new Set(d.questions.map(q => q.kind)).size < 2){ showToast("Mix at least 2 question kinds before staging (per PRD §11a)"); return false; }
    for (const q of d.questions){
      if (q.source === "phrase"){
        const phrase = q.phraseId ? adminPhrases.find(p => p.id === q.phraseId) : null;
        if (!phrase || phrase.status !== "published"){
          showToast("Every phrase-bank question needs a published Phrase before this lesson can be staged");
          return false;
        }
        if (q.kind === "comprehend" && !q.question.trim()){
          showToast("Every comprehend question needs a prompt, even when it's phrase-sourced");
          return false;
        }
      } else if (!q.question.trim() || !q.correctAnswer.trim() || q.distractors.length < 1){
        showToast("Every question needs prompt text, a correct answer, and at least one distractor");
        return false;
      }
    }
  }

  if (!adminLessonDraft.id){
    adminLessonDraft.id = nextAdminId("lsn");
    adminLessonDraft.version = 1;
    adminLessons.push(adminLessonDraft);
  } else {
    const idx = adminLessons.findIndex(l => l.id === adminLessonDraft.id);
    if (idx >= 0) adminLessons[idx] = adminLessonDraft;
  }
  adminLessonDraft.status = status;
  return true;
}

      <div class="admin-actions" style="margin-top:10px;">

// A phrase-sourced preview line so an author can see what will actually
// render without needing to jump to the live preview below — mirrors
// exactly what adminQuestionToBeat() will derive at render time.
function phraseQuestionPreviewText(q, phrase){
  if (!phrase) return "Pick a phrase above.";
  if (q.kind === "comprehend") return `Hears: ${phrase.data.local} → ${phrase.data.en}`;
  return `Prompt: How do you say "${phrase.data.en}"? → ${phrase.data.local}`;
}

function adminQuestionCardHtml(q, i, lessonData){
  const canUsePhraseBank = (q.kind === "produce" || q.kind === "comprehend")
    && lessonData.scope === "country-specific" && !!lessonData.languageId;
  const usingPhraseBank = canUsePhraseBank && q.source === "phrase";
  const phrasePool = canUsePhraseBank ? phrasesForLesson(lessonData) : [];
  const selectedPhrase = usingPhraseBank && q.phraseId ? adminPhrases.find(p => p.id === q.phraseId) : null;

  return `
    <div class="admin-question-card">
      <div class="admin-question-card__head">
        <span class="admin-question-card__index">Question ${i + 1}</span>
        <button type="button" class="admin-remove-btn" data-action="admin-lesson-remove-question" data-index="${i}">Remove</button>
      </div>

      <label class="field-label">Kind</label>
      <select class="admin-select" id="q-kind-${i}">
        <option value="produce" ${q.kind === "produce" ? "selected" : ""}>Produce — "How do you say X?"</option>
        <option value="comprehend" ${q.kind === "comprehend" ? "selected" : ""}>Comprehend — hear a phrase, pick what it means</option>
        <option value="symbol" ${q.kind === "symbol" ? "selected" : ""}>Symbol — read a sign/icon</option>
        <option value="situational" ${q.kind === "situational" ? "selected" : ""}>Situational — "what would you do?"</option>
      </select>

      <label class="field-label">Scenario context</label>
      <textarea class="notes" id="q-context-${i}" style="min-height:44px;" placeholder="e.g. You sit down and a waiter hands you a menu.">${escapeHtml(q.context)}</textarea>

      ${q.kind === "symbol" ? `
        <label class="field-label">Symbol icon</label>
        <select class="admin-select" id="q-symbol-${i}">
          ${Object.keys(SYMBOLS).map(key => `<option value="${key}" ${q.symbol === key ? "selected" : ""}>${key}</option>`).join("")}
        </select>
      ` : ""}

      ${canUsePhraseBank ? `
        <label class="field-label">Content source</label>
        <select class="admin-select" id="q-source-${i}">
          <option value="custom" ${q.source === "custom" ? "selected" : ""}>Custom text</option>
          <option value="phrase" ${q.source === "phrase" ? "selected" : ""}>From phrase bank</option>
        </select>
      ` : ""}

      ${usingPhraseBank ? `
        <label class="field-label">Phrase</label>
        <select class="admin-select" id="q-phrase-${i}">
          <option value="">— pick a phrase —</option>
          ${phrasePool.map(p => `<option value="${p.id}" ${q.phraseId === p.id ? "selected" : ""}>${escapeHtml(p.data.en)} — ${escapeHtml(p.data.local)}${p.status !== "published" ? ` (${ADMIN_STATUS_LABELS[p.status]})` : ""}</option>`).join("")}
        </select>
        ${!phrasePool.length ? `<p class="admin-hint">No phrases authored yet for this Lesson's country/language — add one from the Country or Language page.</p>` : ""}
        <p class="admin-hint">${escapeHtml(phraseQuestionPreviewText(q, selectedPhrase))}</p>
      ` : ""}

      ${(!usingPhraseBank && q.kind === "comprehend") ? `
        <label class="field-label">What they say (local phrase)</label>
        <input class="text-input" id="q-heard-${i}" value="${escapeHtml(q.heard)}" placeholder="e.g. Nan-ban-sen desu ka?">
      ` : ""}

      ${(!usingPhraseBank || q.kind === "comprehend") ? `
        <label class="field-label">Question prompt</label>
        <input class="text-input" id="q-question-${i}" value="${escapeHtml(q.question)}" placeholder="e.g. What are they asking?">
      ` : ""}

      ${!usingPhraseBank ? `
        <label class="field-label">Correct answer</label>
        <input class="text-input" id="q-answer-${i}" value="${escapeHtml(q.correctAnswer)}" placeholder="The right option">

        <label class="field-label">Distractors (comma-separated)</label>
        <input class="text-input" id="q-distractors-${i}" value="${escapeHtml((q.distractors || []).join(", "))}" placeholder="Wrong option one, wrong option two">
      ` : ""}
    </div>
  `;
}

/* ================================================================
   ADMIN SCREENS — Phrase (§2/§7)

   The reusable content-library entity ADMIN-CONTENT-PLAN.md §7
   describes: a Phrase carries the same draft/staged/published/archived
   lifecycle as everything else (§6), and a Lesson's produce/comprehend
   Questions can attach to one by reference instead of hand-typing
   prompt/answer/distractors (see phrasesForLesson / adminQuestionToBeat
   in the Lesson section above). Unlike Module/Lesson, a Phrase has no
   "generic" scope — it's always text in one specific local language, so
   it's always either pinned to one Country or language-wide.
   ================================================================ */
function blankAdminPhrase(){
  return { en: "", local: "", translit: "", tags: [], languageId: null, languageWide: false, countryKey: null };
}

function readAdminPhraseForm(){
  const d = adminPhraseDraft.data;
  d.en = document.getElementById("admin-phrase-en").value.trim();
  d.local = document.getElementById("admin-phrase-local").value.trim();
  d.translit = document.getElementById("admin-phrase-translit").value.trim();
  d.tags = document.getElementById("admin-phrase-tags").value.split(",").map(s => s.trim()).filter(Boolean);
  d.languageId = document.getElementById("admin-phrase-language").value || null;
  const wideEl = document.getElementById("admin-phrase-languagewide");
  d.languageWide = wideEl ? wideEl.checked : false;
  const countryEl = document.getElementById("admin-phrase-country");
  d.countryKey = (!d.languageWide && countryEl) ? (countryEl.value || null) : null;
}

function commitAdminPhraseDraft(status){
  readAdminPhraseForm();
  const d = adminPhraseDraft.data;
  if (!d.en){ showToast("English text is required"); return false; }
  if (!d.local){ showToast("Local-language text is required"); return false; }
  if (!d.languageId){ showToast("Pick a language for this phrase"); return false; }
  if (!d.languageWide && !d.countryKey){ showToast("Pick a country, or tick 'applies to all countries using this language'"); return false; }
  if (status === "staged" && !d.translit){ showToast("Transliteration is required before this phrase can be staged"); return false; }

  if (!adminPhraseDraft.id){
    adminPhraseDraft.id = nextAdminId("phr");
    adminPhraseDraft.version = 1;
    adminPhrases.push(adminPhraseDraft);
  } else {
    const idx = adminPhrases.findIndex(p => p.id === adminPhraseDraft.id);
    if (idx >= 0) adminPhrases[idx] = adminPhraseDraft;
  }
  adminPhraseDraft.status = status;
  return true;
}

function screenAdminPhrase(payload){
  const id = payload && payload.id;
  const record = id ? adminPhrases.find(p => p.id === id) : null;
  const canEdit = !record || record.status === "draft";

  if (canEdit && (!adminPhraseDraft || adminPhraseDraft.id !== id)){
    adminPhraseDraft = record ? JSON.parse(JSON.stringify(record)) : adminPhraseDraft;
  }
  const view = canEdit ? adminPhraseDraft : record;
  if (!view) return `<div class="admin-empty">Phrase not found.</div>`;

  const phraseLangCountries = view.data.languageId ? activeCountriesForLanguage(view.data.languageId) : [];
  const fields = canEdit ? `
    <label class="field-label" for="admin-phrase-en">English</label>
    <input class="text-input" id="admin-phrase-en" value="${escapeHtml(view.data.en)}" placeholder="e.g. Hello">

    <label class="field-label" for="admin-phrase-local">Local phrase</label>
    <input class="text-input" id="admin-phrase-local" value="${escapeHtml(view.data.local)}" placeholder="e.g. Konnichiwa">

    <label class="field-label" for="admin-phrase-translit">Transliteration</label>
    <input class="text-input" id="admin-phrase-translit" value="${escapeHtml(view.data.translit)}" placeholder="e.g. こんにちは">

    <label class="field-label" for="admin-phrase-tags">Tags (comma-separated)</label>
    <input class="text-input" id="admin-phrase-tags" value="${escapeHtml((view.data.tags || []).join(", "))}" placeholder="greeting, essentials">

    <label class="field-label" for="admin-phrase-language">Language</label>
    <select class="admin-select" id="admin-phrase-language">
      <option value="">— pick a language —</option>
      ${adminLanguages.map(l => `<option value="${l.id}" ${view.data.languageId === l.id ? "selected" : ""}>${escapeHtml(l.name)}</option>`).join("")}
    </select>

    <label class="admin-checkbox-row" for="admin-phrase-languagewide">
      <input type="checkbox" id="admin-phrase-languagewide" ${view.data.languageWide ? "checked" : ""}>
      This phrase applies to all countries using this language
    </label>

    ${!view.data.languageWide ? `
      <label class="field-label" for="admin-phrase-country">Country</label>
      <select class="admin-select" id="admin-phrase-country">
        <option value="">— pick a country —</option>
        ${phraseLangCountries.map(d => `<option value="${d.countryKey}" ${view.data.countryKey === d.countryKey ? "selected" : ""}>${escapeHtml(d.data.name)}</option>`).join("")}
      </select>
      ${!phraseLangCountries.length ? `<p class="admin-hint">${view.data.languageId ? "No countries use this language yet." : "Pick a language first."}</p>` : ""}
    ` : ""}
  ` : `
    <div style="font-weight:800;font-size:19px;margin-top:14px;">${escapeHtml(view.data.en)}</div>
    <div style="font-size:13px;color:var(--slate);margin-bottom:10px;">${phraseScopeLabel(view)}</div>
  `;

  const previewHtml = `
    <div class="admin-preview">
      <div class="admin-preview__label">Live preview</div>
      <div class="vocab-grid">${vocabCardHtml(view.data)}</div>
    </div>
  `;

  let actionsHtml = "";
  if (canEdit){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-phrase-save-draft">Save Draft</button>
        <button class="btn-primary" data-action="admin-phrase-stage">Stage</button>
      </div>`;
  } else if (record && record.status === "staged"){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-phrase-unstage">Back to Draft</button>
        <button class="btn-primary" data-action="admin-phrase-publish">Publish</button>
      </div>`;
  } else if (record && record.status === "published"){
    actionsHtml = `<div class="sticky-cta admin-actions"><button class="btn-secondary" data-action="admin-phrase-new-version">Create new draft version</button></div>`;
  } else if (record && record.status === "archived"){
    actionsHtml = `<p class="admin-hint">Archived — superseded by a newer published version.</p>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 4px;">
      <span style="font-size:12px;color:var(--slate);font-family:var(--font-mono);">${record ? "v" + record.version : "New phrase"}</span>
      ${adminStatusChip(view.status)}
    </div>
    ${fields}
    ${previewHtml}
    ${actionsHtml}
  `;
}

/* ================================================================
   ADMIN SCREENS — Trip Type Blueprint (§5)
   ================================================================ */
function screenAdminBlueprints(){
  const rows = adminBlueprints
    .slice()
    .sort((a, b) => TRIP_TYPES[a.data.tripKey].label.localeCompare(TRIP_TYPES[b.data.tripKey].label))
    .map(bp => `
      <button class="admin-list-row" data-action="admin-open-blueprint" data-id="${bp.id}">
        <span class="admin-list-row__mid">
          <div class="admin-list-row__name">${escapeHtml(TRIP_TYPES[bp.data.tripKey].label)}</div>
          <div class="admin-list-row__sub">${bp.data.legs.length} leg${bp.data.legs.length === 1 ? "" : "s"} · v${bp.version}</div>
        </span>
        ${adminStatusChip(bp.status)}
      </button>
    `).join("");
  return `
    <button class="btn-primary" style="margin:6px 0 18px;" data-action="admin-new-blueprint" ${adminModules.length ? "" : "disabled"}>+ New blueprint</button>
    ${!adminModules.length ? `<p class="admin-hint">Create a Module first — Blueprints gate Modules into Legs.</p>` : ""}
    ${rows || `<div class="admin-empty">No blueprints yet.</div>`}
  `;
}

function readAdminBlueprintForm(){
  const d = adminBlueprintDraft.data;
  const tripEl = document.getElementById("admin-bp-triptype");
  if (tripEl) d.tripKey = tripEl.value;
  d.legs.forEach((leg, li) => {
    const nameEl = document.getElementById(`bp-leg-name-${li}`);
    if (!nameEl) return; // leg row isn't in the DOM (view-only render)
    leg.name = nameEl.value.trim();
    leg.blurb = document.getElementById(`bp-leg-blurb-${li}`).value.trim();
    const gates = [];
    adminModules.forEach(mod => {
      const chk = document.getElementById(`bp-gate-${li}-${mod.id}`);
      if (chk && chk.checked){
        const tierEl = document.getElementById(`bp-gate-tier-${li}-${mod.id}`);
        const tier = Math.max(1, Math.min(mod.data.tierCount, Number(tierEl.value) || 1));
        gates.push({ moduleId: mod.id, tier });
      }
    });
    leg.moduleGates = gates;
  });
}

function commitAdminBlueprintDraft(status){
  readAdminBlueprintForm();
  const d = adminBlueprintDraft.data;
  if (!d.legs.length){ showToast("Add at least one leg"); return false; }
  if (d.legs.some(leg => !leg.name)){ showToast("Every leg needs a name"); return false; }
  if (status === "staged" && !d.legs.some(leg => leg.moduleGates.length)){
    showToast("Gate at least one module into a leg before staging");
    return false;
  }
  if (!adminBlueprintDraft.id){
    adminBlueprintDraft.id = nextAdminId("bp");
    adminBlueprintDraft.version = 1;
    adminBlueprints.push(adminBlueprintDraft);
  } else {
    const idx = adminBlueprints.findIndex(b => b.id === adminBlueprintDraft.id);
    if (idx >= 0) adminBlueprints[idx] = adminBlueprintDraft;
  }
  adminBlueprintDraft.status = status;
  return true;
}

function adminLegCardHtml(leg, li){
  return `
    <div class="admin-question-card">
      <div class="admin-question-card__head">
        <span class="admin-question-card__index">${LEG_LADDER[li] || `Leg ${li + 1}`}</span>
        <button type="button" class="admin-remove-btn" data-action="admin-blueprint-remove-leg" data-index="${li}">Remove</button>
      </div>

      <label class="field-label">Leg name</label>
      <input class="text-input" id="bp-leg-name-${li}" value="${escapeHtml(leg.name)}" placeholder="e.g. ${LEG_LADDER[li] || "Leg name"}">

      <label class="field-label">Blurb</label>
      <textarea class="notes" id="bp-leg-blurb-${li}" style="min-height:44px;" placeholder="What does this leg feel like for the traveler?">${escapeHtml(leg.blurb)}</textarea>

      <label class="field-label">Modules gated into this leg</label>
      ${adminModules.length ? adminModules.map(mod => {
        const gate = leg.moduleGates.find(g => g.moduleId === mod.id);
        return `
          <div class="admin-list-row" style="cursor:default;">
            <input type="checkbox" id="bp-gate-${li}-${mod.id}" ${gate ? "checked" : ""} style="width:18px;height:18px;flex-shrink:0;">
            <span class="admin-list-row__mid">
              <div class="admin-list-row__name">${escapeHtml(mod.data.name)}</div>
              <div class="admin-list-row__sub">${moduleScopeLabel(mod)} · up to Tier ${mod.data.tierCount}${mod.status !== "published" ? " · not yet published" : ""}</div>
            </span>
            <input class="text-input" type="number" min="1" max="${mod.data.tierCount}" id="bp-gate-tier-${li}-${mod.id}" value="${gate ? gate.tier : 1}" style="width:52px;text-align:center;flex-shrink:0;">
          </div>
        `;
      }).join("") : `<p class="admin-hint">No modules yet — create one first.</p>`}
    </div>
  `;
}

function screenAdminBlueprint(payload){
  const id = payload && payload.id;
  const record = id ? adminBlueprints.find(b => b.id === id) : null;
  const canEdit = !record || record.status === "draft";

  if (canEdit && (!adminBlueprintDraft || adminBlueprintDraft.id !== id)){
    adminBlueprintDraft = record ? JSON.parse(JSON.stringify(record)) : adminBlueprintDraft;
  }
  const view = canEdit ? adminBlueprintDraft : record;
  if (!view) return `<div class="admin-empty">Blueprint not found.</div>`;

  const dests = publishedDestinations();
  if (!adminBlueprintPreviewCountry || !dests.some(d => d.countryKey === adminBlueprintPreviewCountry)){
    adminBlueprintPreviewCountry = dests.length ? dests[0].countryKey : null;
  }

  const fields = canEdit ? `
    <label class="field-label" for="admin-bp-triptype">Trip Type</label>
    <select class="admin-select" id="admin-bp-triptype">
      ${Object.entries(TRIP_TYPES).map(([key, t]) => `<option value="${key}" ${view.data.tripKey === key ? "selected" : ""}>${t.label}</option>`).join("")}
    </select>

    <label class="field-label" style="margin-top:24px;">Legs (${view.data.legs.length}/${LEG_LADDER.length})</label>
    ${view.data.legs.map((leg, li) => adminLegCardHtml(leg, li)).join("")}
    ${view.data.legs.length < LEG_LADDER.length
      ? `<button type="button" class="btn-secondary" data-action="admin-blueprint-add-leg">+ Add leg</button>`
      : `<p class="admin-hint">Maximum of ${LEG_LADDER.length} legs.</p>`}
  ` : `
    <div style="font-weight:800;font-size:19px;margin-top:14px;">${escapeHtml(TRIP_TYPES[view.data.tripKey].label)}</div>
    <div style="font-size:13px;color:var(--slate);margin-bottom:10px;">${view.data.legs.length} leg${view.data.legs.length === 1 ? "" : "s"}</div>
    ${view.data.legs.map((leg, li) => `
      <div class="admin-question-card">
        <div class="admin-question-card__head"><span class="admin-question-card__index">${escapeHtml(leg.name) || (LEG_LADDER[li] || `Leg ${li + 1}`)}</span></div>
        <div style="font-size:13px;color:var(--slate);">${escapeHtml(leg.blurb) || "No blurb yet."}</div>
        <div style="font-size:12px;color:var(--slate);margin-top:6px;">${leg.moduleGates.length} module${leg.moduleGates.length === 1 ? "" : "s"} gated</div>
      </div>
    `).join("")}
  `;


  // Dry-run preview (§5 step 3): resolves each Leg's gated Modules against
  // a real published country, reusing the traveler week-row markup — the
  // same resolution a Leg's actual syllabus generation will do (§8/§9),
  // just run here against the Draft instead of a traveler's course.
  const previewHtml = `
    <div class="admin-preview">
      <div class="admin-preview__label">Dry-run preview — resolves this Blueprint's Legs against a real country, the way a traveler's syllabus will (§8/§9)</div>
      ${dests.length ? `
        <label class="field-label" for="admin-bp-preview-country" style="margin-top:0;">Preview country</label>
        <select class="admin-select" id="admin-bp-preview-country">
          ${dests.map(d => `<option value="${d.countryKey}" ${adminBlueprintPreviewCountry === d.countryKey ? "selected" : ""}>${escapeHtml(d.data.name)}</option>`).join("")}
        </select>
        ${view.data.legs.map((leg, li) => `
          <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin:16px 2px 6px;">${escapeHtml(leg.name) || (LEG_LADDER[li] || `Leg ${li + 1}`)}</div>
          <div class="week-list">
            ${leg.moduleGates.length ? leg.moduleGates.flatMap(gate => {
              const mod = adminModules.find(m => m.id === gate.moduleId);
              const lessons = resolveBlueprintGateLessons(gate, adminBlueprintPreviewCountry);
              if (!lessons.length){
                return [`
                  <div class="week-row" style="cursor:default;">
                    <span class="week-row__num" data-done="false">&ndash;</span>
                    <span class="week-row__title">${mod ? escapeHtml(mod.data.name) : "Unknown module"} — not yet resolved</span>
                    <span class="week-row__tag">${mod ? escapeHtml(mod.data.name) : ""} · Tier ${gate.tier}</span>
                  </div>`];
              }
              return lessons.map(lesson => `
                <div class="week-row" style="cursor:default;">
                  <span class="week-row__num" data-done="true">&#10003;</span>
                  <span class="week-row__title">${escapeHtml(lesson.data.title)}</span>
                  <span class="week-row__tag">${mod ? escapeHtml(mod.data.name) : ""} · Tier ${gate.tier}</span>
                </div>`);
            }).join("") : `<div class="admin-empty">No modules gated into this leg yet.</div>`}
          </div>
        `).join("")}
      ` : `<p class="admin-hint">No published destinations yet — publish one to dry-run this Blueprint.</p>`}
    </div>
  `;

  let actionsHtml = "";
  if (canEdit){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-blueprint-save-draft">Save Draft</button>
        <button class="btn-primary" data-action="admin-blueprint-stage">Stage</button>
      </div>`;
  } else if (record && record.status === "staged"){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-blueprint-unstage">Back to Draft</button>
        ${blueprintIsPublishable(record) ? `<button class="btn-primary" data-action="admin-blueprint-publish">Publish</button>` : ""}
      </div>
      ${blueprintIsPublishable(record) ? "" : `<p class="admin-hint">Can't publish yet — every gated Module needs to be Published first.</p>`}`;
  } else if (record && record.status === "published"){
    actionsHtml = `<div class="sticky-cta admin-actions"><button class="btn-secondary" data-action="admin-blueprint-new-version">Create new draft version</button></div>`;
  } else if (record && record.status === "archived"){
    actionsHtml = `<p class="admin-hint">Archived — superseded by a newer published version.</p>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 4px;">
      <span style="font-size:12px;color:var(--slate);font-family:var(--font-mono);">${record ? "v" + record.version : "New blueprint"}</span>
      ${adminStatusChip(view.status)}
    </div>
    ${fields}
    ${previewHtml}
    ${actionsHtml}
  `;
}

/* ================================================================
   RENDER DISPATCH

   Admin screens (admin-home, admin-destinations, admin-staged,
   admin-destination, admin-languages, admin-language, admin-module,
   admin-lesson, admin-blueprints, admin-blueprint) are registered
   below alongside the traveler screens — a demo-phase shortcut
   (ADMIN-CONTENT-PLAN.md §10), not the intended end state. Modules
   and Lessons have no standalone list screen of their own anymore —
   they're reached via a Country/Language's own screen, or created
   generically from admin-destinations (§10a).
   ================================================================ */
const SCREENS = {
  home: screenHome,
  country: screenCountry,
  trip: screenTrip,
  generating: screenGenerating,
  dashboard: screenDashboard,
  lesson: screenLesson,
  phrasebook: screenPhrasebook,
  feedback: screenFeedback,
  "admin-home": screenAdminHome,
  "admin-languages": screenAdminLanguages,
  "admin-language": screenAdminLanguage,
  "admin-destinations": screenAdminDestinations,
  "admin-staged": screenAdminStaged,
  "admin-destination": screenAdminDestination,
  "admin-module": screenAdminModule,
  "admin-lesson": screenAdminLesson,
  "admin-phrase": screenAdminPhrase,
  "admin-blueprints": screenAdminBlueprints,
  "admin-blueprint": screenAdminBlueprint
};

function render(){
  const top = stack[stack.length - 1];
  renderAppBar(top);
  const app = document.getElementById("app");
  app.innerHTML = SCREENS[top.name](top.payload);
  app.scrollTop = 0;

  // Flag vars are set on #app (the shared ancestor of every element on the
  // screen) rather than on a single card, so every descendant that reads
  // var(--flag-*) — ticket, week rows, culture card, vocab cards, quiz —
  // picks up the same theme via normal CSS inheritance.
  if (top.name === "dashboard" || top.name === "lesson" || top.name === "phrasebook") applyFlagVars(app, travelerCountry(top.payload.course.countryKey).colours);
  if (top.name === "admin-blueprint" && adminBlueprintPreviewCountry){
    const previewDest = adminDestinations.find(d => d.countryKey === adminBlueprintPreviewCountry);
    if (previewDest) applyFlagVars(app, previewDest.data.colours);
  }
  if (top.name === "generating") runGenerating(top.payload);

  // Admin screens render full-width, outside the phone frame (see
  // .app-shell.is-admin — ADMIN-CONTENT-PLAN.md §10).
  document.querySelector(".app-shell").classList.toggle("is-admin", top.name.startsWith("admin"));

  // keep tab bar's active state honest — Trips/Admin are the only
  // implemented tabs
  const activeTab = top.name.startsWith("admin") ? "go-admin" : "go-home";
  document.querySelectorAll(".tabbar__item").forEach(el => el.dataset.active = (el.dataset.action === activeTab) ? "true" : "false");
}

/* ================================================================
   EVENT DELEGATION
   A single click listener on #app (plus one on the static chrome)
   keyed off data-action, so re-rendering a screen never orphans
   listeners the way many inline onclick rebuilds can.
   ================================================================ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  switch (action){
    case "back": pop(); break;
    case "go-home": resetToHome(); break;
    case "stub-tab": showToast("Not in this prototype — see PRD §8"); break;
    case "admin-stub": showToast(el.dataset.msg || "Not built yet in this prototype"); break;

    case "go-admin":
      adminDraft = null;
      stack = [{ name: "admin-home" }];
      render();
      break;

    case "admin-open-destinations":
      adminDestinationsTab = "countries";
      adminDestinationsFilterCountry = "";
      push("admin-destinations");
      break;
    case "admin-open-staged": push("admin-staged"); break;

    case "admin-destinations-tab":
      adminDestinationsTab = el.dataset.tab;
      render();
      break;

    case "admin-new-destination":
      adminDraft = {
        id: null, countryKey: null, status: "draft", version: 1, legacy: false,
        data: {
          name: "", capital: "", languageId: null, newLanguageName: "",
          colours: { primary: "#BC002D", secondary: "#FFFFFF", tertiary: "#14181F" },
          flagPattern: "vertical-tricolor", cultureTip: ""
        }
      };
      push("admin-destination", { id: null });
      break;

    case "admin-open-destination":
      adminDraft = null; // re-primed by screenAdminDestination if this record is editable
      push("admin-destination", { id: el.dataset.id });
      break;

    case "admin-save-draft": {
      if (commitAdminDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminDraft.id };
        render();
      }
      break;
    }

    case "admin-stage": {
      if (commitAdminDraft("staged")){
        showToast("Staged");
        stack[stack.length - 1].payload = { id: adminDraft.id };
        render();
      }
      break;
    }

    case "admin-unstage": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      rec.status = "draft";
      showToast("Back to draft");
      render();
      break;
    }

    case "admin-publish": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      // Publishing swaps the live version immediately (no backend, matches
      // this prototype's spirit — ADMIN-CONTENT-PLAN.md §6) by archiving
      // whatever else for this destination was previously published.
      adminDestinations
        .filter(d => d.countryKey === rec.countryKey && d.status === "published" && d.id !== rec.id)
        .forEach(d => { d.status = "archived"; });
      rec.status = "published";
      showToast(`${rec.data.name} is now live`);
      render();
      break;
    }

    case "admin-new-version": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("dest");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.legacy = false;
      copy.data.flagPattern = copy.data.flagPattern || "vertical-tricolor";
      adminDestinations.push(copy);
      showToast("New draft version created");
      adminDraft = null;
      push("admin-destination", { id: copy.id });
      break;
    }

    // ---- Language ----
    case "admin-open-languages":
      adminLanguagesTab = "languages";
      adminLanguagesFilterLanguage = "";
      push("admin-languages");
      break;

    case "admin-languages-tab":
      adminLanguagesTab = el.dataset.tab;
      render();
      break;

    case "admin-new-language":
      adminLanguageDraft = { id: null, name: "" };
      push("admin-language", { id: null });
      break;

    case "admin-open-language":
      adminLanguageDraft = null; // re-primed by screenAdminLanguage if editable
      push("admin-language", { id: el.dataset.id });
      break;

    case "admin-language-save": {
      const name = document.getElementById("admin-language-name").value.trim();
      if (!name){ showToast("Language name is required"); break; }
      adminLanguageDraft.name = name;
      if (!adminLanguageDraft.id){
        adminLanguageDraft.id = nextAdminId("lang");
        adminLanguages.push(adminLanguageDraft);
      } else {
        const idx = adminLanguages.findIndex(l => l.id === adminLanguageDraft.id);
        if (idx >= 0) adminLanguages[idx] = adminLanguageDraft;
      }
      showToast("Language saved");
      stack[stack.length - 1].payload = { id: adminLanguageDraft.id };
      render();
      break;
    }

    // ---- Module (§4) ----
    case "admin-new-module":
      adminModuleDraft = {
        id: null, status: "draft", version: 1,
        data: { name: "", kind: "generic", tierCount: 3, languageId: null, languageWide: false, countryKey: null }
      };
      push("admin-module", { id: null });
      break;

    case "admin-open-module":
      adminModuleDraft = null;
      push("admin-module", { id: el.dataset.id });
      break;

    // Pressing "Create Module" from a Country screen inherits that
    // Country's Language, defaulting to country-only (unticked) —
    // pressing it from a Language screen instead defaults to
    // language-wide (ticked). Two entry points, two defaults.
    case "admin-new-module-for-country": {
      const countryKey = el.dataset.country;
      const country = countryByKey(countryKey);
      adminModuleDraft = {
        id: null, status: "draft", version: 1,
        data: { name: "", kind: "bespoke", tierCount: 3, languageId: country ? country.data.languageId : null, languageWide: false, countryKey }
      };
      push("admin-module", { id: null });
      break;
    }

    case "admin-new-module-for-language": {
      adminModuleDraft = {
        id: null, status: "draft", version: 1,
        data: { name: "", kind: "bespoke", tierCount: 3, languageId: el.dataset.language, languageWide: true, countryKey: null }
      };
      push("admin-module", { id: null });
      break;
    }

    case "admin-module-save-draft": {
      if (commitAdminModuleDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminModuleDraft.id };
        render();
      }
      break;
    }

    case "admin-module-stage": {
      if (commitAdminModuleDraft("staged")){
        showToast("Staged");
        stack[stack.length - 1].payload = { id: adminModuleDraft.id };
        render();
      }
      break;
    }

    case "admin-module-unstage": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      rec.status = "draft";
      showToast("Back to draft");
      render();
      break;
    }

    case "admin-module-publish": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      if (!moduleIsComplete(rec)){ showToast("Tier ladder isn't fully published yet"); break; }
      rec.status = "published";
      if (rec.supersedesId){
        const prev = adminModules.find(m => m.id === rec.supersedesId);
        if (prev) prev.status = "archived";
      }
      showToast(`${rec.data.name} is now live`);
      render();
      break;
    }

    case "admin-module-new-version": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("mod");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.supersedesId = rec.id;
      adminModules.push(copy);
      showToast("New draft version created");
      adminModuleDraft = null;
      push("admin-module", { id: copy.id });
      break;
    }

    // ---- Lesson (§3) ----
    // Lessons are only created from inside a Module's tier grid — the
    // grid cell's dataset already pins moduleId/tier/countryKey, so
    // there's no free-standing "pick a module from a dropdown after
    // the fact" flow to keep in sync with the grid it feeds.
    case "admin-new-lesson-for-module": {
      const countryKey = el.dataset.country || null;
      const country = countryKey ? countryByKey(countryKey) : null;
      adminLessonDraft = {
        id: null, status: "draft", version: 1,
        data: {
          title: "", type: "Phrase", moduleId: el.dataset.moduleId, tier: Number(el.dataset.tier),
          scope: countryKey ? "country-specific" : "generic",
          languageId: country ? country.data.languageId : null, languageWide: false,
          countryKey, questions: []
        }
      };
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: null });
      break;
    }

    case "admin-open-lesson":
      adminLessonDraft = null;
      push("admin-lesson", { id: el.dataset.id });
      break;

    case "admin-lesson-add-question": {
      readAdminLessonForm();
      adminLessonDraft.data.questions.push(blankAdminQuestion());
      adminLessonPreviewIndex = adminLessonDraft.data.questions.length - 1;
      render();
      break;
    }

    case "admin-lesson-remove-question": {
      readAdminLessonForm();
      adminLessonDraft.data.questions.splice(Number(el.dataset.index), 1);
      adminLessonPreviewIndex = Math.max(0, Math.min(adminLessonPreviewIndex, adminLessonDraft.data.questions.length - 1));
      render();
      break;
    }

    case "admin-lesson-preview-step": {
      readAdminLessonForm();
      adminLessonPreviewIndex = Math.max(0, Math.min(
        adminLessonPreviewIndex + Number(el.dataset.dir),
        adminLessonDraft.data.questions.length - 1
      ));
      render();
      break;
    }

    case "admin-lesson-save-draft": {
      if (commitAdminLessonDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminLessonDraft.id };
        render();
      }
      break;
    }

    case "admin-lesson-stage": {
      if (commitAdminLessonDraft("staged")){
        showToast("Staged");
        stack[stack.length - 1].payload = { id: adminLessonDraft.id };
        render();
      }
      break;
    }

    case "admin-lesson-unstage": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      rec.status = "draft";
      showToast("Back to draft");
      render();
      break;
    }

    case "admin-lesson-publish": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      rec.status = "published";
      if (rec.supersedesId){
        const prev = adminLessons.find(l => l.id === rec.supersedesId);
        if (prev) prev.status = "archived";
      }
      showToast(`${rec.data.title} is now live`);
      render();
      break;
    }

    case "admin-lesson-new-version": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("lsn");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.supersedesId = rec.id;
      adminLessons.push(copy);
      showToast("New draft version created");
      adminLessonDraft = null;
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: copy.id });
      break;
    }

    // ---- Phrase (§2/§7) ----
    case "admin-new-phrase":
      adminPhraseDraft = { id: null, status: "draft", version: 1, supersedesId: null, data: blankAdminPhrase() };
      push("admin-phrase", { id: null });
      break;

    case "admin-new-phrase-for-country": {
      const countryKey = el.dataset.country;
      const country = countryByKey(countryKey);
      adminPhraseDraft = {
        id: null, status: "draft", version: 1, supersedesId: null,
        data: { ...blankAdminPhrase(), languageId: country ? country.data.languageId : null, countryKey }
      };
      push("admin-phrase", { id: null });
      break;
    }

    case "admin-new-phrase-for-language":
      adminPhraseDraft = {
        id: null, status: "draft", version: 1, supersedesId: null,
        data: { ...blankAdminPhrase(), languageId: el.dataset.language, languageWide: true }
      };
      push("admin-phrase", { id: null });
      break;

    case "admin-open-phrase":
      adminPhraseDraft = null;
      push("admin-phrase", { id: el.dataset.id });
      break;

    case "admin-phrase-save-draft": {
      if (commitAdminPhraseDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminPhraseDraft.id };
        render();
      }
      break;
    }

    case "admin-phrase-stage": {
      if (commitAdminPhraseDraft("staged")){
        showToast("Staged");
        stack[stack.length - 1].payload = { id: adminPhraseDraft.id };
        render();
      }
      break;
    }

    case "admin-phrase-unstage": {
      const rec = adminPhrases.find(p => p.id === stack[stack.length - 1].payload.id);
      rec.status = "draft";
      showToast("Back to draft");
      render();
      break;
    }

    case "admin-phrase-publish": {
      const rec = adminPhrases.find(p => p.id === stack[stack.length - 1].payload.id);
      rec.status = "published";
      if (rec.supersedesId){
        const prev = adminPhrases.find(p => p.id === rec.supersedesId);
        if (prev) prev.status = "archived";
      }
      showToast(`"${rec.data.en}" is now live`);
      render();
      break;
    }

    case "admin-phrase-new-version": {
      const rec = adminPhrases.find(p => p.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("phr");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.supersedesId = rec.id;
      adminPhrases.push(copy);
      showToast("New draft version created");
      adminPhraseDraft = null;
      push("admin-phrase", { id: copy.id });
      break;
    }

    // ---- Trip Type Blueprint (§5) ----
    case "admin-open-blueprints": push("admin-blueprints"); break;

    case "admin-new-blueprint":
      adminBlueprintDraft = {
        id: null, status: "draft", version: 1,
        data: { tripKey: Object.keys(TRIP_TYPES)[0], legs: [blankLeg(LEG_LADDER[0])] }
      };
      push("admin-blueprint", { id: null });
      break;

    case "admin-open-blueprint":
      adminBlueprintDraft = null;
      push("admin-blueprint", { id: el.dataset.id });
      break;

    case "admin-blueprint-add-leg": {
      readAdminBlueprintForm();
      if (adminBlueprintDraft.data.legs.length < LEG_LADDER.length){
        adminBlueprintDraft.data.legs.push(blankLeg(LEG_LADDER[adminBlueprintDraft.data.legs.length]));
      }
      render();
      break;
    }

    case "admin-blueprint-remove-leg": {
      readAdminBlueprintForm();
      adminBlueprintDraft.data.legs.splice(Number(el.dataset.index), 1);
      render();
      break;
    }

    case "admin-blueprint-save-draft": {
      if (commitAdminBlueprintDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminBlueprintDraft.id };
        render();
      }
      break;
    }

    case "admin-blueprint-stage": {
      if (commitAdminBlueprintDraft("staged")){
        showToast("Staged");
        stack[stack.length - 1].payload = { id: adminBlueprintDraft.id };
        render();
      }
      break;
    }

    case "admin-blueprint-unstage": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      rec.status = "draft";
      showToast("Back to draft");
      render();
      break;
    }

    case "admin-blueprint-publish": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      if (!blueprintIsPublishable(rec)){ showToast("Every gated module needs to be published first"); break; }
      rec.status = "published";
      if (rec.supersedesId){
        const prev = adminBlueprints.find(b => b.id === rec.supersedesId);
        if (prev) prev.status = "archived";
      }
      showToast(`${TRIP_TYPES[rec.data.tripKey].label} blueprint is now live`);
      render();
      break;
    }

    case "admin-blueprint-new-version": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("bp");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.supersedesId = rec.id;
      adminBlueprints.push(copy);
      showToast("New draft version created");
      adminBlueprintDraft = null;
      push("admin-blueprint", { id: copy.id });
      break;
    }

    case "start-course":
      draft = { countryKey:null, tripKey:null };
      push("country");
      break;

    case "select-country":
      draft.countryKey = el.dataset.country;
      push("trip");
      break;

    case "select-trip": {
      draft.tripKey = el.dataset.trip;
      document.querySelectorAll(".chip").forEach(chip => chip.dataset.selected = (chip.dataset.trip === draft.tripKey) ? "true" : "false");
      updateTripCta();
      break;
    }

    case "confirm-trip": {
      const notes = document.getElementById("trip-notes").value.trim();
      const startDate = document.getElementById("trip-start").value;
      const endDate = document.getElementById("trip-end").value;
      push("generating", { countryKey: draft.countryKey, tripKey: draft.tripKey, notes, startDate, endDate });
      break;
    }

    case "open-course": {
      const course = courses.find(c => c.id === el.dataset.course);
      push("dashboard", { course });
      break;
    }

    case "open-phrasebook": {
      const top = stack[stack.length - 1];
      push("phrasebook", { course: top.payload.course });
      break;
    }

    case "download-phrasebook":
      showToast("Download isn't wired up in this prototype");
      break;

    case "open-feedback": {
      const top = stack[stack.length - 1];
      push("feedback", { course: top.payload.course });
      break;
    }

    case "feedback-score": {
      feedbackDraft.score = Number(el.dataset.score);
      document.querySelectorAll("#feedback-scale button").forEach(b => b.dataset.selected = (Number(b.dataset.score) === feedbackDraft.score) ? "true" : "false");
      updateFeedbackCta();
      break;
    }

    case "feedback-culture": {
      feedbackDraft.cultureHelped = el.dataset.value;
      document.querySelectorAll("#feedback-culture button").forEach(b => b.dataset.selected = (b.dataset.value === feedbackDraft.cultureHelped) ? "true" : "false");
      break;
    }

    case "submit-feedback": {
      const top = stack[stack.length - 1];
      const course = top.payload.course;
      course.feedbackSubmitted = true;
      course.feedback = {
        score: feedbackDraft.score,
        cultureHelped: feedbackDraft.cultureHelped,
        notes: document.getElementById("feedback-notes").value.trim()
      };
      showToast("Thanks for sharing your trip feedback");
      pop();
      break;
    }

    case "open-lesson": {
      const top = stack[stack.length - 1];
      push("lesson", { course: top.payload.course, week: Number(el.dataset.week), stepIndex:0 });
      break;
    }

    case "beat-answer": {
      if (beatResult) return; // one attempt per question, like a real check
      const choiceIndex = Number(el.dataset.choiceIndex);
      const isCorrect = choiceIndex === currentBeat.correctIndex;
      beatResult = { choiceIndex, isCorrect };

      el.closest(".beat-card").querySelectorAll(".quiz__opt").forEach((opt, oi) => {
        if (oi === currentBeat.correctIndex) opt.dataset.state = "correct";
        else if (oi === choiceIndex) opt.dataset.state = "wrong";
      });
      const feedback = document.getElementById("beat-feedback");
      if (isCorrect){
        feedback.textContent = "Correct — nicely done.";
        feedback.dataset.tone = "good";
      } else {
        feedback.textContent = `Not quite — it's "${currentBeat.options[currentBeat.correctIndex]}".`;
        feedback.dataset.tone = "bad";
      }
      // Only the real traveler lesson screen has a "continue" button — the
      // admin Lesson editor's preview (see screenAdminLesson) reuses this
      // same handler via its own Prev/Next stepper instead, and has no
      // beat-continue-btn to update.
      const btn = document.getElementById("beat-continue-btn");
      if (btn){
        btn.disabled = false;
        btn.textContent = btn.dataset.final === "true" ? "Mark lesson complete" : "Next question";
      }
      break;
    }

    case "beat-continue": {
      if (!beatResult) return; // gated: see beat-answer
      const top = stack[stack.length - 1];
      const { course, week, stepIndex } = top.payload;
      const total = courseLessonBeats(course, week).length;

      if (stepIndex + 1 < total){
        push("lesson", { course, week, stepIndex: stepIndex + 1 });
        break;
      }
      const courseJustCompleted = course.currentWeek === week && course.currentWeek === course.weeks;
      if (course.currentWeek === week && course.currentWeek < course.weeks){
        course.currentWeek += 1;
      } else if (courseJustCompleted){
        course.status = "completed";
      }
      // Leg-grouped (Blueprint-resolved) courses get a Leg-complete toast
      // with the Leg's own blurb instead of the generic message, when the
      // lesson that just finished was the last one in its Leg — see the
      // TODO(admin) above screenDashboard.
      let toastMsg = "Lesson complete";
      if (course.legs){
        const finishedEntry = course.syllabus[week - 1];
        const nextEntry = course.syllabus[week];
        if (courseJustCompleted){
          toastMsg = "Trip-ready — every Leg complete!";
        } else if (finishedEntry && (!nextEntry || nextEntry.legIndex !== finishedEntry.legIndex)){
          const leg = course.legs[finishedEntry.legIndex];
          toastMsg = `${leg.name} complete — ${leg.blurb}`;
        }
      }
      showToast(toastMsg);
      // A lesson is now a stack of one-question-per-page beats — drop all
      // of them to land back on the dashboard, not just the last one.
      while (stack.length && stack[stack.length - 1].name === "lesson") stack.pop();
      render();
      break;
    }
  }
});

// Date inputs aren't [data-action] elements and fire "change", not
// "click", so they need their own listener outside the delegation above.
document.addEventListener("change", (e) => {
  if (e.target.id === "trip-start" || e.target.id === "trip-end") updateTripCta();

  // Module/Lesson selects that change which fields the form should show
  // (kind -> bespoke country picker, scope -> country picker, a
  // question's kind -> its symbol/heard field) sync the current form
  // into the working draft and do a full re-render, same reasoning as
  // date-field above: these aren't free-text fields, so a re-render
  // can't cost focus/cursor position the way it would on admin-dest-name.
  //
  // The render is deferred a tick rather than run inline: a real browser
  // fires this "change" event (via the implicit blur when focus leaves
  // the field) BEFORE it dispatches the click on whatever the user
  // clicked next — so a synchronous render() here would tear down and
  // replace that click's target mid-dispatch, and since a detached node
  // has nowhere left to bubble to, the click silently never reaches the
  // delegated listener on `document`. Deferring lets that click land
  // first; deferredAdminRerender re-checks the field still exists in
  // case the click navigated to a different screen in the meantime.
  const deferredAdminRerender = (fieldId, readFn) => setTimeout(() => {
    if (!document.getElementById(fieldId)) return;
    readFn();
    render();
  }, 0);
  if (e.target.id === "admin-module-kind" || e.target.id === "admin-module-tiercount" ||
      e.target.id === "admin-module-language" || e.target.id === "admin-module-languagewide"){
    deferredAdminRerender(e.target.id, readAdminModuleForm);
  }
  if (e.target.id === "admin-lesson-module" || e.target.id === "admin-lesson-scope" ||
      e.target.id === "admin-lesson-language" || e.target.id === "admin-lesson-languagewide"){
    deferredAdminRerender(e.target.id, readAdminLessonForm);
  }
  if (/^q-kind-\d+$/.test(e.target.id) || /^q-source-\d+$/.test(e.target.id) || /^q-phrase-\d+$/.test(e.target.id)){
    deferredAdminRerender(e.target.id, readAdminLessonForm);
  }
  if (e.target.id === "admin-phrase-language" || e.target.id === "admin-phrase-languagewide"){
    deferredAdminRerender(e.target.id, readAdminPhraseForm);
  }
  if (e.target.id === "admin-dest-pane-filter"){
    const newFilter = e.target.value;
    deferredAdminRerender(e.target.id, () => { adminDestinationsFilterCountry = newFilter; });
  }
  if (e.target.id === "admin-lang-pane-filter"){
    const newFilter = e.target.value;
    deferredAdminRerender(e.target.id, () => { adminLanguagesFilterLanguage = newFilter; });
  }
  if (e.target.id === "admin-dest-language"){
    deferredAdminRerender(e.target.id, readAdminDestinationForm);
  }
  if (e.target.id === "admin-bp-preview-country"){
    const newCountry = e.target.value;
    deferredAdminRerender(e.target.id, () => {
      adminBlueprintPreviewCountry = newCountry;
      if (adminBlueprintDraft) readAdminBlueprintForm();
    });
  }
});

// Admin destination form fields live-patch the preview pane on every
// keystroke/colour pick (see refreshAdminPreview) rather than going
// through a full render(), so text fields keep focus and the native
// colour picker doesn't get yanked shut mid-pick.
document.addEventListener("input", (e) => {
  if (e.target.id && e.target.id.startsWith("admin-dest-")) refreshAdminPreview();
});

render();
</script>

/* ================================================================
   SCREEN: TRIP DETAILS
   Chip selection updates the CTA's shown duration in place (no
   full re-render) so the free-text notes field never loses focus
   or content while the user is comparing trip types.

   ASSUMPTION: The 6 trip-type chips capture enough of how a real trip
   actually breaks down that trip-type alone is a sufficient signal to
   prioritize content — without needing the free-text notes to actually
   feed the generated course.

   HYPOTHESIS: We believe users can accurately self-categorize their trip
   into one of these 6 archetypes, rather than feeling like their trip is
   a poor fit for all of them. We'll know this is wrong if testers
   frequently say "none of these really describe my trip," or write notes
   that contradict/override their chip choice.

   VALIDATION METRIC: Track chip-selection hesitation — time spent on
   this screen before selecting, and whether users change their chip
   selection after starting to type notes (a proxy for "the chip didn't
   feel right, so they're compensating in free text").
   ================================================================ */
function screenTrip(){
  const country = COUNTRIES[draft.countryKey];
  return `
    <p style="font-size:13px;color:var(--slate);margin:6px 2px 14px;">Step 2 of 2 — what's the ${country.name} trip actually like? This shapes which lessons come first.</p>
    <div class="chip-grid" id="chip-grid">
      ${Object.entries(TRIP_TYPES).map(([key, t]) => `
        <button class="chip" data-action="select-trip" data-trip="${key}" data-selected="false">
          <span class="chip__label">${t.label}</span>
          <span class="chip__weeks">${t.weeks} wks</span>
        </button>
      `).join("")}
    </div>
    <label class="field-label">When are you traveling?</label>
    <div class="date-row">
      <div class="date-field">
        <label for="trip-start">Departure</label>
        <input type="date" id="trip-start">
      </div>
      <div class="date-field">
        <label for="trip-end">Return</label>
        <input type="date" id="trip-end">
      </div>
    </div>
    <div class="date-hint" id="date-hint"></div>
    <label class="field-label" for="trip-notes">Anything else worth knowing? (optional)</label>
    <textarea class="notes" id="trip-notes" placeholder="e.g. staying with family, mostly rural, doing a food tour on day 2..."></textarea>
    <div class="sticky-cta">
      <button class="btn-primary" id="trip-cta" data-action="confirm-trip" disabled>Choose a trip type above</button>
    </div>
  `;
}

// Trip-type chip selection and the two date inputs both gate the same CTA,
// so this is the single place that decides its enabled/disabled state and
// label — called from the "select-trip" click handler and from the date
// inputs' native "change" listener (dates aren't [data-action] elements,
// so they can't go through the click delegation below).
function updateTripCta(){
  const cta = document.getElementById("trip-cta");
  if (!cta) return;
  const hint = document.getElementById("date-hint");
  const start = document.getElementById("trip-start").value;
  const end = document.getElementById("trip-end").value;
  const datesEntered = !!(start && end);
  const datesValid = datesEntered && new Date(end) >= new Date(start);
  if (hint){
    hint.textContent = (datesEntered && !datesValid) ? "Return date can't be before the departure date." : "";
    hint.dataset.tone = (datesEntered && !datesValid) ? "bad" : "";
  }
  if (!draft.tripKey){
    cta.disabled = true;
    cta.textContent = "Choose a trip type above";
  } else if (!datesValid){
    cta.disabled = true;
    cta.textContent = "Add your travel dates above";
  } else {
    cta.disabled = false;
    cta.textContent = `Start my ${TRIP_TYPES[draft.tripKey].weeks}-week course`;
  }
}

/* ================================================================
   SCREEN: GENERATING
   The one place this prototype spends its "signature motion"
   budget: a split-flap-style status line cycling through synthesis
   steps, echoing the departure-board identity from the home screen,
   before auto-advancing into the freshly generated course.

   ASSUMPTION: Showing named synthesis steps ("SCANNING PHRASEBOOK,"
   "WEIGHTING BY TRIP TYPE," etc.) builds trust that the course is
   genuinely personalized to the user's trip — rather than reading as
   generic loading-screen theater that users see through and discount.

   HYPOTHESIS: We believe naming specific weighting/sequencing steps
   (vs. a generic spinner) increases users' perceived personalization of
   the resulting course. We'll know this is wrong if users can't recall
   or don't believe the steps reflected real personalization when asked
   afterward.

   VALIDATION METRIC: Post-generation micro-survey (single question,
   e.g. "How tailored does this course feel to your trip?" 1-5)
   compared between a group that sees the current step-by-step flap
   animation vs. a plain spinner control.
   ================================================================ */
function screenGenerating(){
  return `
    <div class="generating">
      <div class="flap" id="flap-text">SCANNING PHRASEBOOK</div>
      <div class="spinner-dots"><span></span><span></span><span></span></div>
      <div class="generating__sub">Building your course from real, weighted phrase priority — arrival first, small talk later.</div>
    </div>
  `;
}
function runGenerating(payload){
  const steps = ["SCANNING PHRASEBOOK", "WEIGHTING BY TRIP TYPE", "SEQUENCING 6–8 WEEKS", "PRINTING BOARDING PASS"];
  let i = 0;
  const el = document.getElementById("flap-text");
  const iv = setInterval(()=>{
    i++;
    if (!el) { clearInterval(iv); return; }
    if (i < steps.length){ el.textContent = steps[i]; }
  }, 420);
  setTimeout(()=>{
    clearInterval(iv);
    finalizeCourse(payload);
  }, 420 * steps.length + 250);
}

// Departure/return dates are captured on the trip details step
// (screenTrip) and stored here so `needsFeedback` (below `screenDashboard`)
// can check-on-render whether the trip has actually happened yet — see
// PRD §14. `weeks`/pacing still comes from the trip-type default, not from
// the date range (see PRD §10 open question — that's still unresolved).
//
// Resolves the traveler's Trip Type against a *published* Blueprint
// (ADMIN-CONTENT-PLAN.md §8/§9) rather than the flat TRIP_TYPES.weeks
// constant, when one exists for this Trip Type. `course.syllabus` is
// snapshotted here (each entry's `lessonId`, not a live Blueprint/Module
// lookup) so a Blueprint published later doesn't retroactively change the
// syllabus of a trip already in progress — the same effect the plan's
// "pin a templateVersion" note calls for, achieved by pinning the
// resolved Lesson ids instead of re-resolving from the Blueprint at
// render time. Trip Types with no published Blueprint yet fall back to
// the legacy hardcoded syllabus() so the rest of the prototype's trip
// types keep working unauthored.
function finalizeCourse(payload){
  const resolved = resolveBlueprintSyllabus(payload.countryKey, payload.tripKey);
  const syllabusWeeks = resolved
    ? resolved.weeks
    : syllabus(payload.tripKey).map(w => ({ title: w.title, type: w.type, source: "legacy", legIndex: null, lessonId: null }));
  const course = {
    id: "c" + Date.now(),
    countryKey: payload.countryKey,
    tripKey: payload.tripKey,
    weeks: syllabusWeeks.length,
    syllabus: syllabusWeeks,
    legs: resolved ? resolved.legs : null,
    currentWeek: 1,
    status: "active",
    notes: payload.notes || "",
    travelStart: payload.startDate,
    travelEnd: payload.endDate,
    feedbackSubmitted: false,
    feedback: null
  };
  courses.unshift(course);
  // Replace the generating screen in-place (don't leave it in back-stack)
  stack.pop();
  push("dashboard", { course });
}

// Check-on-render rather than a scheduled push notification (this
// prototype has no background/server component to run a scheduled job
// from) — called wherever a course is displayed, so the moment a user
// opens the app after their return date, the prompt is already there.
function tripEnded(course){
  return !!course.travelEnd && new Date(course.travelEnd) < new Date();
}
function needsFeedback(course){
  return tripEnded(course) && !course.feedbackSubmitted;
}

/* ================================================================
   SCREEN: DASHBOARD

   ASSUMPTION: Progressive unlock (future weeks locked until the prior
   week is marked complete) is read by users as helpful pacing/focus,
   not as an artificial gate that frustrates people who want to skim
   ahead or binge content before their trip.

   HYPOTHESIS: We believe locking future weeks increases actual lesson
   completion (vs. exposing the whole syllabus at once and letting
   people jump around), because it keeps users focused on one thing at
   a time rather than skimming and losing momentum. We'll know this is
   wrong if a meaningful share of testers tap locked weeks repeatedly
   (frustration signal), or say in feedback that they wanted to preview
   later content.

   VALIDATION METRIC: Tap-on-locked-week event rate (how often users
   try to open something that's locked) as a frustration proxy, plus a
   completion-rate comparison if/when we A/B against an
   unlocked-all-weeks variant.

   Course progression is Leg-grouped whenever `course.legs` is present
   (ADMIN-CONTENT-PLAN.md §8/§9) — i.e. the course was resolved from a
   published Blueprint rather than the legacy hardcoded syllabus():
     - Ticket stats: "Leg n of N" is added alongside total weeks (kept as
       a secondary stat for trip-date pacing, not replaced).
     - Week-list is Leg-grouped, reusing the existing `.section-label`
       pattern as Leg headers ("LEG 1 — SLIGHTLY SCARED TOURIST").
       Locking is still sequential by week number (not per-Leg) — a
       real build would lock a whole Leg until the prior one finishes;
       this demo keeps the simpler per-week unlock rule and layers Leg
       headers on top of it.
     - A dedicated Leg-complete toast (see the beat-continue handler
       below) fires the Leg's `blurb` copy instead of the generic
       "Lesson complete" message when the finished lesson was the last
       one in its Leg.
   ================================================================ */
function applyFlagVars(container, colours){
  container.style.setProperty("--flag-primary", colours.primary);
  container.style.setProperty("--flag-secondary", colours.secondary);
  container.style.setProperty("--flag-tertiary", colours.tertiary);
}

function screenDashboard(payload){
  const c = payload.course;
  const country = COUNTRIES[c.countryKey];
  const trip = TRIP_TYPES[c.tripKey];
  const weeks = c.syllabus;
  const doneCount = c.status === "completed" ? c.weeks : Math.max(0, c.currentWeek - 1);
  const pct = Math.round((doneCount / c.weeks) * 100);

  const weekRowHtml = (week, idx) => {
    const num = idx + 1;
    // Legacy weeks 1-3 have real lesson content in this prototype; every
    // authored (Blueprint-resolved) week does, since Module publish
    // already requires a real Lesson behind every tier/country cell.
    const built = week.source === "authored" || num <= 3;
    const done = c.status === "completed" || num < c.currentWeek;
    const locked = !built || (c.status !== "completed" && num > c.currentWeek);
    const statusTag = locked ? (built ? "Upcoming" : "Preview only") : (done ? "Review" : "Start");
    return `
      <button class="week-row" data-action="${locked ? "" : "open-lesson"}" data-week="${num}" data-locked="${locked}">
        <span class="week-row__num" data-done="${done}">${done ? "✓" : num}</span>
        <span class="week-row__title">${week.title}</span>
        <span class="week-row__tag">${week.type} · ${statusTag}</span>
      </button>`;
  };

  let weekListHtml;
  if (c.legs){
    let idx = 0;
    weekListHtml = c.legs.map((leg, legIndex) => {
      const rows = [];
      while (idx < weeks.length && weeks[idx].legIndex === legIndex){
        rows.push(weekRowHtml(weeks[idx], idx));
        idx++;
      }
      return `
        <div class="section-label" style="margin-top:20px;">Leg ${legIndex + 1} — ${leg.name.toUpperCase()}</div>
        <div class="week-list">${rows.join("")}</div>
      `;
    }).join("");
  } else {
    weekListHtml = `
      <div class="section-label" style="margin-top:20px;">Your syllabus</div>
      <div class="week-list">${weeks.map(weekRowHtml).join("")}</div>
    `;
  }

  const legStatHtml = c.legs ? (() => {
    const currentEntry = weeks[Math.min(c.currentWeek, c.weeks) - 1];
    const currentLegNum = c.status === "completed" ? c.legs.length : (currentEntry ? currentEntry.legIndex + 1 : 1);
    return `<div><b>${currentLegNum}/${c.legs.length}</b><small>Current leg</small></div>`;
  })() : "";

  return `
    <div class="ticket" id="ticket">
      <div class="ticket__stripe">
        <span style="background:${country.colours.primary}"></span>
        <span style="background:${country.colours.secondary}"></span>
        <span style="background:${country.colours.tertiary}"></span>
      </div>
      <div class="ticket__eyebrow">${trip.label} · ${country.capital}</div>
      <div class="ticket__title"><span class="flag-icon ticket__flag">${FLAGS[c.countryKey]}</span>${country.name}</div>
      <div class="ticket__meta">
        ${legStatHtml}
        <div><b>${c.weeks}</b><small>Weeks total</small></div>
        <div><b>${c.status === "completed" ? c.weeks : c.currentWeek}</b><small>${c.status === "completed" ? "Completed" : "Current week"}</small></div>
      </div>
      <div class="ticket__progress">
        <div class="ticket__progress-track"><div class="ticket__progress-fill" style="width:${pct}%"></div></div>
        <div class="ticket__progress-label">${pct}% trip-ready</div>
      </div>
      ${c.status === "completed" ? `<button class="ticket__cta" data-action="open-phrasebook">View offline phrasebook</button>` : ""}
      ${needsFeedback(c) ? `<button class="ticket__cta" data-action="open-feedback">Share trip feedback</button>` : ""}
    </div>

    <div class="culture-card">
      <div class="culture-card__label">Know before you go</div>
      <div class="culture-card__body">${country.cultureTip}</div>
    </div>

    ${weekListHtml}
  `;
}

/* ================================================================
   SCREEN: PHRASEBOOK
   Only reachable from a COMPLETED course's dashboard (see the
   `ticket__cta` button in screenDashboard) — see PRD §13 for why this
   is gated to completion rather than available mid-course. Compiles
   every phrase this course ever taught (main bank + transport bank)
   plus the etiquette/culture notes into one offline-style reference.
   The "Download" button is a deliberate stub: it shows a toast rather
   than producing a file, same pattern as the disabled tab-bar items.

   ASSUMPTION: Framing the phrasebook as a "you finished, here's your
   reward" artefact (completed-only) drives more course completion than
   treating it as a progressively-unlocked utility would — i.e.,
   withholding it is a completion incentive, not just a
   scope-simplification.

   HYPOTHESIS: We believe gating the phrasebook to completed courses
   increases the likelihood users finish all weeks, vs. a partial
   phrasebook available mid-course (which might let people feel "done
   enough" after grabbing the phrases they want). We'll know this is
   wrong if testers report they wanted the phrasebook mid-course and it
   becomes an abandonment trigger rather than a completion driver.

   VALIDATION METRIC: In-course intent signal — track how often (and at
   what week) users try to reach a phrasebook/reference view before
   it's unlocked, if we instrument an in-app "view phrasebook" attempt
   from the locked dashboard state; compare completion rate
   qualitatively via exit surveys for users who drop off before
   finishing.
   ================================================================ */
function screenPhrasebook(payload){
  const c = payload.course;
  const country = COUNTRIES[c.countryKey];
  const trip = TRIP_TYPES[c.tripKey];

  return `
    <div class="ticket" id="ticket">
      <div class="ticket__stripe">
        <span style="background:${country.colours.primary}"></span>
        <span style="background:${country.colours.secondary}"></span>
        <span style="background:${country.colours.tertiary}"></span>
      </div>
      <div class="ticket__eyebrow">Offline phrasebook · ${country.capital}</div>
      <div class="ticket__title"><span class="flag-icon ticket__flag">${FLAGS[c.countryKey]}</span>${country.name}</div>
      <button class="ticket__cta" data-action="download-phrasebook">Download for offline use</button>
    </div>

    <p class="lesson-intro">Every phrase and etiquette tip from your ${trip.label.toLowerCase()} course, in one place — no signal needed once it's downloaded.</p>

    <div class="section-label">Essentials</div>
    <div class="vocab-grid">
      ${country.phrases.map(vocabCardHtml).join("")}
    </div>

    <div class="section-label" style="margin-top:20px;">Getting around</div>
    <div class="vocab-grid">
      ${country.transport.phrases.map(vocabCardHtml).join("")}
    </div>

    <div class="culture-card" style="margin-top:20px;">
      <div class="culture-card__label">Good to know</div>
      <div class="culture-card__body">${country.cultureTip}</div>
      <ul class="etiquette-list" style="margin-top:10px;">
        ${country.transport.etiquette.map(item => `<li>${item}</li>`).join("")}

  `;
}

/* ================================================================
   SCREEN: FEEDBACK
   Only reachable once `needsFeedback` is true (the dashboard ticket CTA
   and the home board row both surface it — see PRD §14) — i.e. the
   trip's return date has already passed and no feedback has been
   submitted yet. Deliberately independent of lesson-completion status:
   a course that stalled at week 2 still had a real trip happen, and
   that's arguably the more useful feedback to collect, not less.

   ASSUMPTION: A 1-5 NPS-style scale plus a single yes/no question about
   culture/etiquette content specifically (see PRD §7 comment on
   `buildTransportQuiz`) is enough signal to test the PRD §9 hypothesis,
   without needing a longer post-trip survey that risks a lower response
   rate.

   VALIDATION METRIC: Feedback-prompt response rate (submitted vs. ever
   shown), and the culture Y/N split specifically, benchmarked against
   overall NPS — if culture "yes" doesn't correlate with a higher score,
   that undercuts the "culture is a real differentiator" bet from PRD §4.
   ================================================================ */
function screenFeedback(payload){
  feedbackDraft = { score:null, cultureHelped:null };
  const c = payload.course;
  const country = COUNTRIES[c.countryKey];

  return `
    <p style="font-size:13px;color:var(--slate);margin:6px 2px 14px;">Your ${country.name} trip has wrapped up — a couple of quick questions while it's fresh.</p>

    <label class="field-label" style="margin-top:6px;">How likely are you to recommend Holaday to a friend planning a similar trip?</label>
    <div class="feedback-scale" id="feedback-scale">
      ${[1,2,3,4,5].map(n => `<button data-action="feedback-score" data-score="${n}" data-selected="false">${n}</button>`).join("")}
    </div>
    <div class="feedback-scale-labels"><span>Not likely</span><span>Very likely</span></div>

    <label class="field-label">Did anything you learned about local customs or etiquette come in useful on the trip?</label>
    <div class="feedback-yn" id="feedback-culture">
      <button data-action="feedback-culture" data-value="yes" data-selected="false">Yes</button>
      <button data-action="feedback-culture" data-value="no" data-selected="false">No</button>
    </div>

    <label class="field-label" for="feedback-notes">Anything else worth telling us? (optional)</label>
    <textarea class="notes" id="feedback-notes" placeholder="e.g. wish there'd been more on tipping, the transport lesson saved me on day one..."></textarea>

    <div class="sticky-cta">
      <button class="btn-primary" id="feedback-cta" data-action="submit-feedback" disabled>Rate your trip above</button>
    </div>
  `;
}

function updateFeedbackCta(){
  const cta = document.getElementById("feedback-cta");
  if (!cta) return;
  if (feedbackDraft.score){
    cta.disabled = false;
    cta.textContent = "Submit feedback";
  }
}

/* ================================================================
   SCREEN: LESSON
   A lesson is now a sequence of one-question-per-page screens (see PRD
   §11a) — `payload.stepIndex` picks which beat of `buildLessonBeats`
   to show, each pushed as its own stack entry. There's no separate
   "read the content, then get quizzed on it" split any more: every
   page IS a scenario-framed question, mixing three styles so the
   lesson doesn't feel like the same drill five times in a row:
     "produce"     -> "How do you say X?" (recall the local phrase)
     "comprehend"  -> a local phrase is quoted -> "what did they say?"
     "symbol"      -> a sign/icon is shown -> "what does it mean?"
     "situational" -> week 3 only, "what would you do?" judgement call
   Weeks 1-2 are phrase lessons: "Airport & Arrival Essentials" always
   uses phrases 0-3 of the country's bank, and week 2's title is
   trip-type-flavoured but reuses phrases 4-7 of the same bank — see
   PRD §7 for why (36 hand-authored phrase sets isn't worth it for a
   prototype). Week 3 is always a distinct CULTURE lesson — Public
   Transport — with its own bespoke per-country beat plan (see each
   country's `transport.beatPlan` above) rather than more vocab, so the
   "etiquette is first-class" claim in PRD §4 is actually demonstrated,
   not just asserted. The last beat of every lesson still gates
   "Mark lesson complete" the same way regardless of lesson type.
   ================================================================ */
function vocabCardHtml(p){
  return `
    <div class="vocab-card">
      <div class="vocab-card__en">${p.en}</div>
      <div class="vocab-card__local">${p.local}</div>
      <div class="vocab-card__translit">${p.translit}</div>
    </div>`;
}

function lessonMeta(week, country, trip){
  if (week === 3) return { title:"Public Transport & Getting Around", type:"Culture lesson" };
  if (week === 1) return { title:"Airport & Arrival Essentials", type:"Phrase lesson" };
  return { title:trip.lesson2, type:"Phrase lesson" };
}

/* ----- beat construction -----
   makeQuestion builds the shuffled options/correctIndex for any MCQ;
   produceBeat/comprehendBeat turn one phrase-bank entry into a
   translate-out or translate-in question; symbolBeat/situationalBeat
   wrap hand-authored content (icons, "what would you do" scenarios)
   into the same beat shape so screenLesson/renderBeat don't need to
   care which kind they're looking at. */
function makeQuestion(promptText, correctText, distractorTexts){
  const options = shuffle([correctText, ...distractorTexts]);
  return { q: promptText, options, correctIndex: options.indexOf(correctText) };
}
function produceBeat(phraseBank, index, context, distractorCount){
  const p = phraseBank[index];
  const pool = phraseBank.filter((_, i) => i !== index);
  const distractors = shuffle(pool).slice(0, distractorCount).map(x => x.local);
  const mq = makeQuestion(`How do you say "${p.en}"?`, p.local, distractors);
  return { kind:"produce", context, ...mq };
}
function comprehendBeat(phraseBank, index, context, question, distractorCount){
  const p = phraseBank[index];
  const pool = phraseBank.filter((_, i) => i !== index);
  const distractors = shuffle(pool).slice(0, distractorCount).map(x => x.en);
  const mq = makeQuestion(question, p.en, distractors);
  return { kind:"comprehend", context, heard:p.local, ...mq };
}
function symbolBeat(context, symbol, question, correct, distractors){
  const mq = makeQuestion(question, correct, distractors);
  return { kind:"symbol", context, symbol, ...mq };
}
function situationalBeat(scenario, context){
  const distractors = scenario.options.filter((_, i) => i !== scenario.correctIndex);
  const mq = makeQuestion(scenario.q, scenario.options[scenario.correctIndex], distractors);
  return { kind:"situational", context, ...mq };
}

// Turns a beat-plan descriptor (see ARRIVAL_BEAT_PLAN / EXPLORE_BEAT_PLAN
// / each country's transport.beatPlan) into an actual beat object with
// computed MCQ options. `phraseBank` + `distractorCount` differ between
// the 8-phrase country bank (7 other entries to pull distractors from)
// and the 3-phrase transport bank (only 2 others), so both are passed
// in rather than hard-coded.
function buildBeat(entry, phraseBank, distractorCount, scenario){
  switch (entry.kind){
    case "produce": return produceBeat(phraseBank, entry.phraseIndex, entry.context, distractorCount);
    case "comprehend": return comprehendBeat(phraseBank, entry.phraseIndex, entry.context, entry.question, distractorCount);
    case "symbol": return symbolBeat(entry.context, entry.symbol, entry.question, entry.correct, entry.distractors);
    case "situational": return situationalBeat(scenario, entry.context);
  }
}

function buildLessonBeats(country, trip, week){
  if (week === 3){
    const t = country.transport;
    return t.beatPlan.map(entry => buildBeat(entry, t.phrases, 2, t.scenario));
  }
  const plan = week === 1 ? ARRIVAL_BEAT_PLAN : EXPLORE_BEAT_PLAN;
  return plan.map(entry => buildBeat(entry, country.phrases, 2));
}

// Turns an authored admin Lesson's Questions into real beats, via the
// same adminQuestionToBeat() the admin Lesson editor's own live preview
// uses (see screenAdminLesson) — the traveler is looking at literally
// the same rendering path an author checked before publishing.
function adminLessonBeats(lessonId){
  const lesson = adminLessons.find(l => l.id === lessonId);
  return lesson ? lesson.data.questions.map(adminQuestionToBeat) : [];
}

// Picks legacy hardcoded beats or authored-Lesson beats for a given
// week of a course, based on how that week was resolved in
// finalizeCourse() (see course.syllabus / resolveBlueprintSyllabus).
function courseLessonBeats(course, week){
  const entry = course.syllabus[week - 1];
  if (entry && entry.source === "authored") return adminLessonBeats(entry.lessonId);
  const country = COUNTRIES[course.countryKey];
  const trip = TRIP_TYPES[course.tripKey];
  return buildLessonBeats(country, trip, week);
}

function renderBeat(beat){
  const visual = beat.kind === "symbol"
    ? `<div class="beat-symbol"><span class="beat-symbol__icon">${SYMBOLS[beat.symbol]}</span></div>`
    : beat.kind === "comprehend"
    ? `<div class="beat-heard">"${beat.heard}"</div>`
    : "";
  return `
    <div class="beat-card">
      <div class="beat-card__context">${beat.context}</div>
      ${visual}
      <div class="beat-card__question">${beat.q}</div>
      ${beat.options.map((opt, oi) => `<button class="quiz__opt" data-action="beat-answer" data-choice-index="${oi}">${opt}</button>`).join("")}
      <div class="quiz__feedback" id="beat-feedback"></div>
    </div>
  `;
}

function screenLesson(payload){
  const c = payload.course;
  const country = COUNTRIES[c.countryKey];
  const trip = TRIP_TYPES[c.tripKey];
  const week = payload.week;
  const stepIndex = payload.stepIndex || 0;
  const entry = c.syllabus[week - 1];
  const meta = entry.source === "authored" ? { title: entry.title, type: entry.type + " lesson" } : lessonMeta(week, country, trip);
  const beats = courseLessonBeats(c, week);
  const total = beats.length;
  const isLast = stepIndex + 1 >= total;

  currentBeat = beats[stepIndex];
  beatResult = null;
  const pct = Math.round((stepIndex / total) * 100);

  return `
    <div class="lesson-hero" id="lesson-hero">
      <div class="lesson-hero__eyebrow">Week ${week} · ${country.name} · ${meta.type}</div>
      <div class="lesson-hero__title">${meta.title}</div>
    </div>

    <div class="beat-progress">
      <div class="beat-progress__track"><div class="beat-progress__fill" style="width:${pct}%"></div></div>
      <div class="beat-progress__label">Question ${stepIndex + 1} of ${total}</div>
    </div>

    ${renderBeat(currentBeat)}

    <div class="lesson-cta">
      <button class="btn-primary" id="beat-continue-btn" data-action="beat-continue" data-week="${week}" data-final="${isLast}" disabled>Answer to continue</button>
    </div>
  `;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function readAdminDestinationForm(){
  adminDraft.data.name = document.getElementById("admin-dest-name").value.trim();

  adminDraft.data.languageId = document.getElementById("admin-dest-language").value || null;
  adminDraft.data.cultureTip = document.getElementById("admin-dest-culturetip").value.trim();
  adminDraft.data.flagPattern = document.getElementById("admin-dest-pattern").value;

    primary: document.getElementById("admin-dest-primary").value,
    secondary: document.getElementById("admin-dest-secondary").value,
    tertiary: document.getElementById("admin-dest-tertiary").value
  };
}

function commitAdminDraft(status){
  readAdminDestinationForm();
  if (!adminDraft.data.name){
    showToast("Destination name is required");
    return false;
  }
  if (!adminDraft.data.languageId){
    showToast("Pick a language for this destination");
    return false;
  }
  if (!adminDraft.id){
    adminDraft.id = nextAdminId("dest");
    adminDraft.countryKey = slugify(adminDraft.data.name);
    adminDraft.version = 1;
    adminDraft.legacy = false;
    adminDestinations.push(adminDraft);
  } else {
    const idx = adminDestinations.findIndex(d => d.id === adminDraft.id);
    if (idx >= 0) adminDestinations[idx] = adminDraft;
  }
  adminDraft.status = status;
  if (status !== "changes_requested") adminDraft.changeNote = null;
  return true;
}

// Mirrors readAdminDestinationForm/commitAdminDraft: read-on-submit
// rather than live-bound, but here it's also called before every action
// that re-renders the grid (kind/tierCount/country toggles) so a real
// re-render never clobbers whatever's currently in the Name field.
function readAdminModuleForm(){
  const d = adminModuleDraft.data;
  d.name = document.getElementById("admin-module-name").value.trim();
  d.kind = document.getElementById("admin-module-kind").value;
  d.tierCount = Math.max(1, Math.min(6, Number(document.getElementById("admin-module-tiercount").value) || 1));

  const languageEl = document.getElementById("admin-module-language");
  d.languageId = (d.kind === "bespoke" && languageEl) ? (languageEl.value || null) : null;
  const wideEl = document.getElementById("admin-module-languagewide");
  d.languageWide = (d.kind === "bespoke" && wideEl) ? wideEl.checked : false;
  const countryEl = document.getElementById("admin-module-country");
  d.countryKey = (d.kind === "bespoke" && !d.languageWide && countryEl) ? (countryEl.value || null) : null;
}

function commitAdminModuleDraft(status){
  readAdminModuleForm();
  const d = adminModuleDraft.data;
  if (!d.name){
    showToast("Module name is required");
    return false;
  }
  if (d.kind === "bespoke"){
    if (!d.languageId){
      showToast("Pick a language for a bespoke module");
      return false;
    }
    if (!d.languageWide && !d.countryKey){
      showToast("Pick a country, or tick 'applies to all countries using this language'");
      return false;
    }
  }
  if (!adminModuleDraft.id){
    adminModuleDraft.id = nextAdminId("mod");
    adminModuleDraft.version = 1;
    adminModules.push(adminModuleDraft);
  } else {
    const idx = adminModules.findIndex(m => m.id === adminModuleDraft.id);
    if (idx >= 0) adminModules[idx] = adminModuleDraft;
  }
  adminModuleDraft.status = status;
  if (status !== "changes_requested") adminModuleDraft.changeNote = null;
  return true;
}

      <table class="admin-grid-table">

        <tbody>

            return `<tr>
              <td class="admin-grid-row-label">${escapeHtml(rowLabel)}</td>

function readAdminLessonForm(){
  const d = adminLessonDraft.data;
  d.title = document.getElementById("admin-lesson-title").value.trim();
  d.type = document.getElementById("admin-lesson-type").value;
  d.moduleId = document.getElementById("admin-lesson-module").value || null;
  d.tier = Math.max(1, Number(document.getElementById("admin-lesson-tier").value) || 1);
  d.scope = document.getElementById("admin-lesson-scope").value;
  const languageEl = document.getElementById("admin-lesson-language");
  d.languageId = (d.scope === "country-specific" && languageEl) ? (languageEl.value || null) : null;
  const wideEl = document.getElementById("admin-lesson-languagewide");
  d.languageWide = (d.scope === "country-specific" && wideEl) ? wideEl.checked : false;
  const countryEl = document.getElementById("admin-lesson-country");
  d.countryKey = (d.scope === "country-specific" && !d.languageWide && countryEl) ? (countryEl.value || null) : null;

  d.questions.forEach((q, i) => {
    const kindEl = document.getElementById(`q-kind-${i}`);
    if (!kindEl) return; // row was removed from the DOM already
    q.kind = kindEl.value;
    q.context = document.getElementById(`q-context-${i}`).value.trim();
    q.question = document.getElementById(`q-question-${i}`).value.trim();
    q.correctAnswer = document.getElementById(`q-answer-${i}`).value.trim();
    q.distractors = document.getElementById(`q-distractors-${i}`).value.split(",").map(s => s.trim()).filter(Boolean);
    // The symbol/heard fields only exist in the DOM when the row's kind
    // already was symbol/comprehend at last render — if this read was
    // triggered by the kind select itself just switching TO one of those
    // kinds, the field hasn't been rendered yet, so keep whatever value
    // was already on the draft (blankAdminQuestion seeds a sane default).
    const symbolEl = document.getElementById(`q-symbol-${i}`);
    if (q.kind === "symbol" && symbolEl) q.symbol = symbolEl.value;
    const heardEl = document.getElementById(`q-heard-${i}`);
    if (q.kind === "comprehend" && heardEl) q.heard = heardEl.value.trim();
  });
}

function commitAdminLessonDraft(status){
  readAdminLessonForm();
  const d = adminLessonDraft.data;
  if (!d.title){ showToast("Lesson title is required"); return false; }
  if (!d.moduleId){ showToast("Pick a module for this lesson"); return false; }
  const mod = adminModules.find(m => m.id === d.moduleId);
  if (mod && d.tier > mod.data.tierCount){ showToast(`${mod.data.name} only goes up to Tier ${mod.data.tierCount}`); return false; }
  if (d.scope === "country-specific"){
    if (!d.languageId){ showToast("Pick a language for this lesson"); return false; }
    if (!d.languageWide && !d.countryKey){ showToast("Pick a country, or tick 'applies to all countries using this language'"); return false; }
  }

  if (status === "in_review"){
    if (d.questions.length < 5){ showToast("Needs at least 5 questions before it can be submitted"); return false; }
    if (new Set(d.questions.map(q => q.kind)).size < 2){ showToast("Mix at least 2 question kinds before submitting (per PRD §11a)"); return false; }
    if (d.questions.some(q => !q.question.trim() || !q.correctAnswer.trim() || q.distractors.length < 1)){
      showToast("Every question needs prompt text, a correct answer, and at least one distractor");
      return false;
    }
  }

  if (!adminLessonDraft.id){
    adminLessonDraft.id = nextAdminId("lsn");
    adminLessonDraft.version = 1;
    adminLessons.push(adminLessonDraft);
  } else {
    const idx = adminLessons.findIndex(l => l.id === adminLessonDraft.id);
    if (idx >= 0) adminLessons[idx] = adminLessonDraft;
  }
  adminLessonDraft.status = status;
  if (status !== "changes_requested") adminLessonDraft.changeNote = null;
  return true;
}

      <div style="font-size:11.5px;color:var(--slate);text-align:center;margin-top:6px;">Question ${adminLessonPreviewIndex + 1} of ${questions.length}</div>
    </div>
  ` : `<div class="admin-preview"><div class="admin-preview__label">Live preview</div><div class="admin-empty">Add a question to preview it.</div></div>`;

  let actionsHtml = "";
  if (canEdit){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-lesson-save-draft">Save Draft</button>
        <button class="btn-primary" data-action="admin-lesson-submit-review">Submit for Review</button>
      </div>`;
  } else if (record && adminRole === "approver" && record.status === "in_review"){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-lesson-request-changes">Request Changes</button>
        <button class="btn-primary" data-action="admin-lesson-approve">Approve</button>
      </div>`;
  } else if (record && adminRole === "approver" && record.status === "approved"){
    actionsHtml = `<div class="sticky-cta admin-actions"><button class="btn-primary" data-action="admin-lesson-publish">Publish</button></div>`;
  } else if (record && adminRole === "author" && record.status === "published"){
    actionsHtml = `<div class="sticky-cta admin-actions"><button class="btn-secondary" data-action="admin-lesson-new-version">Create new draft version</button></div>`;
  } else if (record && record.status === "in_review"){
    actionsHtml = `<p class="admin-hint">Submitted — waiting for an Approver to review this.</p>`;
  } else if (record && record.status === "approved"){
    actionsHtml = `<p class="admin-hint">Approved — waiting to be published.</p>`;
  } else if (record && record.status === "archived"){
    actionsHtml = `<p class="admin-hint">Archived — superseded by a newer published version.</p>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 4px;">
      <span style="font-size:12px;color:var(--slate);font-family:var(--font-mono);">${record ? "v" + record.version : "New lesson"}</span>
      ${adminStatusChip(view.status)}
    </div>
    ${changeNoteHtml}
    ${fields}
    ${previewHtml}
    ${actionsHtml}
  `;
}

function screenAdminBlueprints(){
  const rows = adminBlueprints
    .slice()
    .sort((a, b) => TRIP_TYPES[a.data.tripKey].label.localeCompare(TRIP_TYPES[b.data.tripKey].label))
    .map(bp => `
      <button class="admin-list-row" data-action="admin-open-blueprint" data-id="${bp.id}">
        <span class="admin-list-row__mid">
          <div class="admin-list-row__name">${escapeHtml(TRIP_TYPES[bp.data.tripKey].label)}</div>
          <div class="admin-list-row__sub">${bp.data.legs.length} leg${bp.data.legs.length === 1 ? "" : "s"} · v${bp.version}</div>
        </span>
        ${adminStatusChip(bp.status)}
      </button>
    `).join("");
  return `
    ${adminRole === "author" ? `<button class="btn-primary" style="margin:6px 0 18px;" data-action="admin-new-blueprint" ${adminModules.length ? "" : "disabled"}>+ New blueprint</button>` : ""}
    ${!adminModules.length ? `<p class="admin-hint">Create a Module first — Blueprints gate Modules into Legs.</p>` : ""}
    ${rows || `<div class="admin-empty">No blueprints yet.</div>`}
  `;
}

function readAdminBlueprintForm(){
  const d = adminBlueprintDraft.data;
  const tripEl = document.getElementById("admin-bp-triptype");
  if (tripEl) d.tripKey = tripEl.value;
  d.legs.forEach((leg, li) => {
    const nameEl = document.getElementById(`bp-leg-name-${li}`);
    if (!nameEl) return; // leg row isn't in the DOM (view-only render)
    leg.name = nameEl.value.trim();
    leg.blurb = document.getElementById(`bp-leg-blurb-${li}`).value.trim();
    const gates = [];
    adminModules.forEach(mod => {
      const chk = document.getElementById(`bp-gate-${li}-${mod.id}`);
      if (chk && chk.checked){
        const tierEl = document.getElementById(`bp-gate-tier-${li}-${mod.id}`);
        const tier = Math.max(1, Math.min(mod.data.tierCount, Number(tierEl.value) || 1));
        gates.push({ moduleId: mod.id, tier });
      }
    });
    leg.moduleGates = gates;
  });
}

function commitAdminBlueprintDraft(status){
  readAdminBlueprintForm();
  const d = adminBlueprintDraft.data;
  if (!d.legs.length){ showToast("Add at least one leg"); return false; }
  if (d.legs.some(leg => !leg.name)){ showToast("Every leg needs a name"); return false; }
  if (status === "in_review" && !d.legs.some(leg => leg.moduleGates.length)){
    showToast("Gate at least one module into a leg before submitting");
    return false;
  }
  if (!adminBlueprintDraft.id){
    adminBlueprintDraft.id = nextAdminId("bp");
    adminBlueprintDraft.version = 1;
    adminBlueprints.push(adminBlueprintDraft);
  } else {
    const idx = adminBlueprints.findIndex(b => b.id === adminBlueprintDraft.id);
    if (idx >= 0) adminBlueprints[idx] = adminBlueprintDraft;
  }
  adminBlueprintDraft.status = status;
  if (status !== "changes_requested") adminBlueprintDraft.changeNote = null;
  return true;
}

function screenAdminBlueprint(payload){
  const id = payload && payload.id;
  const record = id ? adminBlueprints.find(b => b.id === id) : null;
  const canEdit = adminRole === "author" && (!record || record.status === "draft" || record.status === "changes_requested");

  if (canEdit && (!adminBlueprintDraft || adminBlueprintDraft.id !== id)){
    adminBlueprintDraft = record ? JSON.parse(JSON.stringify(record)) : adminBlueprintDraft;
  }
  const view = canEdit ? adminBlueprintDraft : record;
  if (!view) return `<div class="admin-empty">Blueprint not found.</div>`;

  const dests = publishedDestinations();
  if (!adminBlueprintPreviewCountry || !dests.some(d => d.countryKey === adminBlueprintPreviewCountry)){
    adminBlueprintPreviewCountry = dests.length ? dests[0].countryKey : null;
  }

  const fields = canEdit ? `
    <label class="field-label" for="admin-bp-triptype">Trip Type</label>
    <select class="admin-select" id="admin-bp-triptype">
      ${Object.entries(TRIP_TYPES).map(([key, t]) => `<option value="${key}" ${view.data.tripKey === key ? "selected" : ""}>${t.label}</option>`).join("")}
    </select>

    <label class="field-label" style="margin-top:24px;">Legs (${view.data.legs.length}/${LEG_LADDER.length})</label>
    ${view.data.legs.map((leg, li) => adminLegCardHtml(leg, li)).join("")}
    ${view.data.legs.length < LEG_LADDER.length
      ? `<button type="button" class="btn-secondary" data-action="admin-blueprint-add-leg">+ Add leg</button>`
      : `<p class="admin-hint">Maximum of ${LEG_LADDER.length} legs.</p>`}
  ` : `
    <div style="font-weight:800;font-size:19px;margin-top:14px;">${escapeHtml(TRIP_TYPES[view.data.tripKey].label)}</div>
    <div style="font-size:13px;color:var(--slate);margin-bottom:10px;">${view.data.legs.length} leg${view.data.legs.length === 1 ? "" : "s"}</div>
    ${view.data.legs.map((leg, li) => `
      <div class="admin-question-card">
        <div class="admin-question-card__head"><span class="admin-question-card__index">${escapeHtml(leg.name) || (LEG_LADDER[li] || `Leg ${li + 1}`)}</span></div>
        <div style="font-size:13px;color:var(--slate);">${escapeHtml(leg.blurb) || "No blurb yet."}</div>
        <div style="font-size:12px;color:var(--slate);margin-top:6px;">${leg.moduleGates.length} module${leg.moduleGates.length === 1 ? "" : "s"} gated</div>
      </div>
    `).join("")}

  const changeNoteHtml = (record && record.status === "changes_requested" && record.changeNote)
    ? `<div class="admin-change-note"><b>Changes requested:</b> ${escapeHtml(record.changeNote)}</div>` : "";

  // Dry-run preview (§5 step 3): resolves each Leg's gated Modules against
  // a real published country, reusing the traveler week-row markup — the
  // same resolution a Leg's actual syllabus generation will do (§8/§9),
  // just run here against the Draft instead of a traveler's course.
  const previewHtml = `
    <div class="admin-preview">
      <div class="admin-preview__label">Dry-run preview — resolves this Blueprint's Legs against a real country, the way a traveler's syllabus will (§8/§9)</div>
      ${dests.length ? `
        <label class="field-label" for="admin-bp-preview-country" style="margin-top:0;">Preview country</label>
        <select class="admin-select" id="admin-bp-preview-country">
          ${dests.map(d => `<option value="${d.countryKey}" ${adminBlueprintPreviewCountry === d.countryKey ? "selected" : ""}>${escapeHtml(d.data.name)}</option>`).join("")}
        </select>
        ${view.data.legs.map((leg, li) => `
          <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin:16px 2px 6px;">${escapeHtml(leg.name) || (LEG_LADDER[li] || `Leg ${li + 1}`)}</div>
          <div class="week-list">
            ${leg.moduleGates.length ? leg.moduleGates.map(gate => {
              const mod = adminModules.find(m => m.id === gate.moduleId);
              const lesson = resolveBlueprintGateLesson(gate, adminBlueprintPreviewCountry);
              return `
                <div class="week-row" style="cursor:default;">
                  <span class="week-row__num" data-done="${lesson ? "true" : "false"}">${lesson ? "&#10003;" : "&ndash;"}</span>
                  <span class="week-row__title">${lesson ? escapeHtml(lesson.data.title) : `${mod ? escapeHtml(mod.data.name) : "Unknown module"} — not yet resolved`}</span>
                  <span class="week-row__tag">${mod ? escapeHtml(mod.data.name) : ""} · Tier ${gate.tier}</span>
                </div>`;
            }).join("") : `<div class="admin-empty">No modules gated into this leg yet.</div>`}
          </div>
        `).join("")}
      ` : `<p class="admin-hint">No published destinations yet — publish one to dry-run this Blueprint.</p>`}
    </div>
  `;

  let actionsHtml = "";
  if (canEdit){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-blueprint-save-draft">Save Draft</button>
        <button class="btn-primary" data-action="admin-blueprint-submit-review">Submit for Review</button>
      </div>`;
  } else if (record && adminRole === "approver" && record.status === "in_review"){
    actionsHtml = `
      <div class="sticky-cta admin-actions">
        <button class="btn-secondary" data-action="admin-blueprint-request-changes">Request Changes</button>
        <button class="btn-primary" data-action="admin-blueprint-approve">Approve</button>
      </div>`;
  } else if (record && adminRole === "approver" && record.status === "approved"){
    actionsHtml = blueprintIsPublishable(record)
      ? `<div class="sticky-cta admin-actions"><button class="btn-primary" data-action="admin-blueprint-publish">Publish</button></div>`
      : `<p class="admin-hint">Can't publish yet — every gated Module needs to be Published first.</p>`;
  } else if (record && adminRole === "author" && record.status === "published"){
    actionsHtml = `<div class="sticky-cta admin-actions"><button class="btn-secondary" data-action="admin-blueprint-new-version">Create new draft version</button></div>`;
  } else if (record && record.status === "in_review"){
    actionsHtml = `<p class="admin-hint">Submitted — waiting for an Approver to review this.</p>`;
  } else if (record && record.status === "approved"){
    actionsHtml = `<p class="admin-hint">Approved — waiting to be published.</p>`;
  } else if (record && record.status === "archived"){
    actionsHtml = `<p class="admin-hint">Archived — superseded by a newer published version.</p>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 4px;">
      <span style="font-size:12px;color:var(--slate);font-family:var(--font-mono);">${record ? "v" + record.version : "New blueprint"}</span>
      ${adminStatusChip(view.status)}
    </div>
    ${changeNoteHtml}
    ${fields}
    ${previewHtml}
    ${actionsHtml}
  `;
}

/* ================================================================
   RENDER DISPATCH

   Admin screens (admin-home, admin-destinations, admin-review-queue,
   admin-destination, admin-languages, admin-language, admin-modules,
   admin-module, admin-lessons, admin-lesson, admin-blueprints,
   admin-blueprint) are registered below alongside the traveler
   screens — a demo-phase shortcut (ADMIN-CONTENT-PLAN.md §10), not
   the intended end state.
   ================================================================ */
const SCREENS = {
  home: screenHome,
  country: screenCountry,
  trip: screenTrip,
  generating: screenGenerating,
  dashboard: screenDashboard,
  lesson: screenLesson,
  phrasebook: screenPhrasebook,
  feedback: screenFeedback,
  "admin-home": screenAdminHome,
  "admin-languages": screenAdminLanguages,
  "admin-language": screenAdminLanguage,
  "admin-destinations": screenAdminDestinations,
  "admin-review-queue": screenAdminReviewQueue,
  "admin-destination": screenAdminDestination,
  "admin-modules": screenAdminModules,
  "admin-module": screenAdminModule,
  "admin-lessons": screenAdminLessons,
  "admin-lesson": screenAdminLesson,
  "admin-blueprints": screenAdminBlueprints,
  "admin-blueprint": screenAdminBlueprint
};

function render(){
  const top = stack[stack.length - 1];
  renderAppBar(top);
  const app = document.getElementById("app");
  app.innerHTML = SCREENS[top.name](top.payload);
  app.scrollTop = 0;

  // Flag vars are set on #app (the shared ancestor of every element on the
  // screen) rather than on a single card, so every descendant that reads
  // var(--flag-*) — ticket, week rows, culture card, vocab cards, quiz —
  // picks up the same theme via normal CSS inheritance.
  if (top.name === "dashboard" || top.name === "lesson" || top.name === "phrasebook") applyFlagVars(app, COUNTRIES[top.payload.course.countryKey].colours);
  if (top.name === "admin-blueprint" && adminBlueprintPreviewCountry){
    const previewDest = adminDestinations.find(d => d.countryKey === adminBlueprintPreviewCountry);
    if (previewDest) applyFlagVars(app, previewDest.data.colours);
  }
  if (top.name === "generating") runGenerating(top.payload);

  // Admin screens render full-width, outside the phone frame (see
  // .app-shell.is-admin — ADMIN-CONTENT-PLAN.md §10).
  document.querySelector(".app-shell").classList.toggle("is-admin", top.name.startsWith("admin"));

  // keep tab bar's active state honest — Trips/Admin are the only
  // implemented tabs
  const activeTab = top.name.startsWith("admin") ? "go-admin" : "go-home";
  document.querySelectorAll(".tabbar__item").forEach(el => el.dataset.active = (el.dataset.action === activeTab) ? "true" : "false");
}

/* ================================================================
   EVENT DELEGATION
   A single click listener on #app (plus one on the static chrome)
   keyed off data-action, so re-rendering a screen never orphans
   listeners the way many inline onclick rebuilds can.
   ================================================================ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  switch (action){
    case "back": pop(); break;
    case "go-home": resetToHome(); break;
    case "stub-tab": showToast("Not in this prototype — see PRD §8"); break;
    case "admin-stub": showToast(el.dataset.msg || "Not built yet in this prototype"); break;

    case "go-admin":
      adminDraft = null;
      stack = [{ name: "admin-home" }];
      render();
      break;

    case "admin-set-role":
      adminRole = el.dataset.role;
      render();
      break;

    case "admin-open-destinations": push("admin-destinations"); break;
    case "admin-open-review-queue": push("admin-review-queue"); break;

    case "admin-new-destination":
      adminDraft = {
        id: null, countryKey: null, status: "draft", version: 1, legacy: false, changeNote: null,
        data: {
          name: "", capital: "", languageId: null,
          colours: { primary: "#BC002D", secondary: "#FFFFFF", tertiary: "#14181F" },
          flagPattern: "vertical-tricolor", cultureTip: ""
        }
      };
      push("admin-destination", { id: null });
      break;

    case "admin-open-destination":
      adminDraft = null; // re-primed by screenAdminDestination if this record is editable
      push("admin-destination", { id: el.dataset.id });
      break;

    case "admin-save-draft": {
      if (commitAdminDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminDraft.id };
        render();
      }
      break;
    }

    case "admin-submit-review": {
      if (commitAdminDraft("in_review")){
        showToast("Submitted for review");
        stack[stack.length - 1].payload = { id: adminDraft.id };
        render();
      }
      break;
    }

    case "admin-approve": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      rec.status = "approved";
      rec.changeNote = null;
      showToast("Approved");
      render();
      break;
    }

    case "admin-request-changes": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      const note = prompt("What needs to change before this can be approved?");
      if (note === null) break; // cancelled
      rec.status = "changes_requested";
      rec.changeNote = note.trim() || "Changes requested.";
      showToast("Changes requested");
      render();
      break;
    }

    case "admin-publish": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      // Publishing swaps the live version immediately (no backend, matches
      // this prototype's spirit — ADMIN-CONTENT-PLAN.md §6) by archiving
      // whatever else for this destination was previously published.
      adminDestinations
        .filter(d => d.countryKey === rec.countryKey && d.status === "published" && d.id !== rec.id)
        .forEach(d => { d.status = "archived"; });
      rec.status = "published";
      showToast(`${rec.data.name} is now live`);
      render();
      break;
    }

    case "admin-new-version": {
      const rec = adminDestinations.find(d => d.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("dest");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.legacy = false;
      copy.changeNote = null;
      copy.data.flagPattern = copy.data.flagPattern || "vertical-tricolor";
      adminDestinations.push(copy);
      showToast("New draft version created");
      adminDraft = null;
      push("admin-destination", { id: copy.id });
      break;
    }

    // ---- Language ----
    case "admin-open-languages": push("admin-languages"); break;

    case "admin-new-language":
      adminLanguageDraft = { id: null, name: "" };
      push("admin-language", { id: null });
      break;

    case "admin-open-language":
      adminLanguageDraft = null; // re-primed by screenAdminLanguage if editable
      push("admin-language", { id: el.dataset.id });
      break;

    case "admin-language-save": {
      const name = document.getElementById("admin-language-name").value.trim();
      if (!name){ showToast("Language name is required"); break; }
      adminLanguageDraft.name = name;
      if (!adminLanguageDraft.id){
        adminLanguageDraft.id = nextAdminId("lang");
        adminLanguages.push(adminLanguageDraft);
      } else {
        const idx = adminLanguages.findIndex(l => l.id === adminLanguageDraft.id);
        if (idx >= 0) adminLanguages[idx] = adminLanguageDraft;
      }
      showToast("Language saved");
      stack[stack.length - 1].payload = { id: adminLanguageDraft.id };
      render();
      break;
    }

    // ---- Module (§4) ----
    case "admin-open-modules": push("admin-modules"); break;

    case "admin-new-module":
      adminModuleDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { name: "", kind: "generic", tierCount: 3, languageId: null, languageWide: false, countryKey: null }
      };
      push("admin-module", { id: null });
      break;

    case "admin-open-module":
      adminModuleDraft = null;
      push("admin-module", { id: el.dataset.id });
      break;

    // Pressing "Create Module" from a Country screen inherits that
    // Country's Language, defaulting to country-only (unticked) —
    // pressing it from a Language screen instead defaults to
    // language-wide (ticked). Two entry points, two defaults.
    case "admin-new-module-for-country": {
      const countryKey = el.dataset.country;
      const country = countryByKey(countryKey);
      adminModuleDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { name: "", kind: "bespoke", tierCount: 3, languageId: country ? country.data.languageId : null, languageWide: false, countryKey }
      };
      push("admin-module", { id: null });
      break;
    }

    case "admin-new-module-for-language": {
      adminModuleDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { name: "", kind: "bespoke", tierCount: 3, languageId: el.dataset.language, languageWide: true, countryKey: null }
      };
      push("admin-module", { id: null });
      break;
    }

    case "admin-module-save-draft": {
      if (commitAdminModuleDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminModuleDraft.id };
        render();
      }
      break;
    }

    case "admin-module-submit-review": {
      if (commitAdminModuleDraft("in_review")){
        showToast("Submitted for review");
        stack[stack.length - 1].payload = { id: adminModuleDraft.id };
        render();
      }
      break;
    }

    case "admin-module-approve": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      rec.status = "approved";
      rec.changeNote = null;
      showToast("Approved");
      render();
      break;
    }

    case "admin-module-request-changes": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      const note = prompt("What needs to change before this can be approved?");
      if (note === null) break;
      rec.status = "changes_requested";
      rec.changeNote = note.trim() || "Changes requested.";
      showToast("Changes requested");
      render();
      break;
    }

    case "admin-module-publish": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      if (!moduleIsComplete(rec)){ showToast("Tier ladder isn't fully published yet"); break; }
      rec.status = "published";
      showToast(`${rec.data.name} is now live`);
      render();
      break;
    }

    case "admin-module-new-version": {
      const rec = adminModules.find(m => m.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("mod");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.changeNote = null;
      adminModules.push(copy);
      showToast("New draft version created");
      adminModuleDraft = null;
      push("admin-module", { id: copy.id });
      break;
    }

    // ---- Lesson (§3) ----
    case "admin-open-lessons": push("admin-lessons"); break;

    case "admin-new-lesson":
      adminLessonDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { title: "", type: "Phrase", moduleId: null, tier: 1, scope: "generic", languageId: null, languageWide: false, countryKey: null, questions: [] }
      };
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: null });
      break;

    case "admin-new-lesson-for-module": {
      const countryKey = el.dataset.country || null;
      const country = countryKey ? countryByKey(countryKey) : null;
      adminLessonDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: {
          title: "", type: "Phrase", moduleId: el.dataset.moduleId, tier: Number(el.dataset.tier),
          scope: countryKey ? "country-specific" : "generic",
          languageId: country ? country.data.languageId : null, languageWide: false,
          countryKey, questions: []
        }
      };
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: null });
      break;
    }

    // Same inherited-language logic as admin-new-module-for-country/
    // -for-language above, applied to Lessons.
    case "admin-new-lesson-for-country": {
      const countryKey = el.dataset.country;
      const country = countryByKey(countryKey);
      adminLessonDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { title: "", type: "Phrase", moduleId: null, tier: 1, scope: "country-specific", languageId: country ? country.data.languageId : null, languageWide: false, countryKey, questions: [] }
      };
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: null });
      break;
    }

    case "admin-new-lesson-for-language": {
      adminLessonDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { title: "", type: "Phrase", moduleId: null, tier: 1, scope: "country-specific", languageId: el.dataset.language, languageWide: true, countryKey: null, questions: [] }
      };
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: null });
      break;
    }

    case "admin-open-lesson":
      adminLessonDraft = null;
      push("admin-lesson", { id: el.dataset.id });
      break;

    case "admin-lesson-add-question": {
      readAdminLessonForm();
      adminLessonDraft.data.questions.push(blankAdminQuestion());
      adminLessonPreviewIndex = adminLessonDraft.data.questions.length - 1;
      render();
      break;
    }

    case "admin-lesson-remove-question": {
      readAdminLessonForm();
      adminLessonDraft.data.questions.splice(Number(el.dataset.index), 1);
      adminLessonPreviewIndex = Math.max(0, Math.min(adminLessonPreviewIndex, adminLessonDraft.data.questions.length - 1));
      render();
      break;
    }

    case "admin-lesson-preview-step": {
      readAdminLessonForm();
      adminLessonPreviewIndex = Math.max(0, Math.min(
        adminLessonPreviewIndex + Number(el.dataset.dir),
        adminLessonDraft.data.questions.length - 1
      ));
      render();
      break;
    }

    case "admin-lesson-save-draft": {
      if (commitAdminLessonDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminLessonDraft.id };
        render();
      }
      break;
    }

    case "admin-lesson-submit-review": {
      if (commitAdminLessonDraft("in_review")){
        showToast("Submitted for review");
        stack[stack.length - 1].payload = { id: adminLessonDraft.id };
        render();
      }
      break;
    }

    case "admin-lesson-approve": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      rec.status = "approved";
      rec.changeNote = null;
      showToast("Approved");
      render();
      break;
    }

    case "admin-lesson-request-changes": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      const note = prompt("What needs to change before this can be approved?");
      if (note === null) break;
      rec.status = "changes_requested";
      rec.changeNote = note.trim() || "Changes requested.";
      showToast("Changes requested");
      render();
      break;
    }

    case "admin-lesson-publish": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      rec.status = "published";
      showToast(`${rec.data.title} is now live`);
      render();
      break;
    }

    case "admin-lesson-new-version": {
      const rec = adminLessons.find(l => l.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("lsn");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.changeNote = null;
      adminLessons.push(copy);
      showToast("New draft version created");
      adminLessonDraft = null;
      adminLessonPreviewIndex = 0;
      push("admin-lesson", { id: copy.id });
      break;
    }

    // ---- Trip Type Blueprint (§5) ----
    case "admin-open-blueprints": push("admin-blueprints"); break;

    case "admin-new-blueprint":
      adminBlueprintDraft = {
        id: null, status: "draft", version: 1, changeNote: null,
        data: { tripKey: Object.keys(TRIP_TYPES)[0], legs: [blankLeg(LEG_LADDER[0])] }
      };
      push("admin-blueprint", { id: null });
      break;

    case "admin-open-blueprint":
      adminBlueprintDraft = null;
      push("admin-blueprint", { id: el.dataset.id });
      break;

    case "admin-blueprint-add-leg": {
      readAdminBlueprintForm();
      if (adminBlueprintDraft.data.legs.length < LEG_LADDER.length){
        adminBlueprintDraft.data.legs.push(blankLeg(LEG_LADDER[adminBlueprintDraft.data.legs.length]));
      }
      render();
      break;
    }

    case "admin-blueprint-remove-leg": {
      readAdminBlueprintForm();
      adminBlueprintDraft.data.legs.splice(Number(el.dataset.index), 1);
      render();
      break;
    }

    case "admin-blueprint-save-draft": {
      if (commitAdminBlueprintDraft("draft")){
        showToast("Draft saved");
        stack[stack.length - 1].payload = { id: adminBlueprintDraft.id };
        render();
      }
      break;
    }

    case "admin-blueprint-submit-review": {
      if (commitAdminBlueprintDraft("in_review")){
        showToast("Submitted for review");
        stack[stack.length - 1].payload = { id: adminBlueprintDraft.id };
        render();
      }
      break;
    }

    case "admin-blueprint-approve": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      rec.status = "approved";
      rec.changeNote = null;
      showToast("Approved");
      render();
      break;
    }

    case "admin-blueprint-request-changes": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      const note = prompt("What needs to change before this can be approved?");
      if (note === null) break;
      rec.status = "changes_requested";
      rec.changeNote = note.trim() || "Changes requested.";
      showToast("Changes requested");
      render();
      break;
    }

    case "admin-blueprint-publish": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      if (!blueprintIsPublishable(rec)){ showToast("Every gated module needs to be published first"); break; }
      rec.status = "published";
      showToast(`${TRIP_TYPES[rec.data.tripKey].label} blueprint is now live`);
      render();
      break;
    }

    case "admin-blueprint-new-version": {
      const rec = adminBlueprints.find(b => b.id === stack[stack.length - 1].payload.id);
      const copy = JSON.parse(JSON.stringify(rec));
      copy.id = nextAdminId("bp");
      copy.version = rec.version + 1;
      copy.status = "draft";
      copy.changeNote = null;
      adminBlueprints.push(copy);
      showToast("New draft version created");
      adminBlueprintDraft = null;
      push("admin-blueprint", { id: copy.id });
      break;
    }

    case "start-course":
      draft = { countryKey:null, tripKey:null };
      push("country");
      break;

    case "select-country":
      draft.countryKey = el.dataset.country;
      push("trip");
      break;

    case "select-trip": {
      draft.tripKey = el.dataset.trip;
      document.querySelectorAll(".chip").forEach(chip => chip.dataset.selected = (chip.dataset.trip === draft.tripKey) ? "true" : "false");
      updateTripCta();
      break;
    }

    case "confirm-trip": {
      const notes = document.getElementById("trip-notes").value.trim();
      const startDate = document.getElementById("trip-start").value;
      const endDate = document.getElementById("trip-end").value;
      push("generating", { countryKey: draft.countryKey, tripKey: draft.tripKey, notes, startDate, endDate });
      break;
    }

    case "open-course": {
      const course = courses.find(c => c.id === el.dataset.course);
      push("dashboard", { course });
      break;
    }

    case "open-phrasebook": {
      const top = stack[stack.length - 1];
      push("phrasebook", { course: top.payload.course });
      break;
    }

    case "download-phrasebook":
      showToast("Download isn't wired up in this prototype");
      break;

    case "open-feedback": {
      const top = stack[stack.length - 1];
      push("feedback", { course: top.payload.course });
      break;
    }

    case "feedback-score": {
      feedbackDraft.score = Number(el.dataset.score);
      document.querySelectorAll("#feedback-scale button").forEach(b => b.dataset.selected = (Number(b.dataset.score) === feedbackDraft.score) ? "true" : "false");
      updateFeedbackCta();
      break;
    }

    case "feedback-culture": {
      feedbackDraft.cultureHelped = el.dataset.value;
      document.querySelectorAll("#feedback-culture button").forEach(b => b.dataset.selected = (b.dataset.value === feedbackDraft.cultureHelped) ? "true" : "false");
      break;
    }

    case "submit-feedback": {
      const top = stack[stack.length - 1];
      const course = top.payload.course;
      course.feedbackSubmitted = true;
      course.feedback = {
        score: feedbackDraft.score,
        cultureHelped: feedbackDraft.cultureHelped,
        notes: document.getElementById("feedback-notes").value.trim()
      };
      showToast("Thanks for sharing your trip feedback");
      pop();
      break;
    }

    case "open-lesson": {
      const top = stack[stack.length - 1];
      push("lesson", { course: top.payload.course, week: Number(el.dataset.week), stepIndex:0 });
      break;
    }

    case "beat-answer": {
      if (beatResult) return; // one attempt per question, like a real check
      const choiceIndex = Number(el.dataset.choiceIndex);
      const isCorrect = choiceIndex === currentBeat.correctIndex;
      beatResult = { choiceIndex, isCorrect };

      el.closest(".beat-card").querySelectorAll(".quiz__opt").forEach((opt, oi) => {
        if (oi === currentBeat.correctIndex) opt.dataset.state = "correct";
        else if (oi === choiceIndex) opt.dataset.state = "wrong";
      });
      const feedback = document.getElementById("beat-feedback");
      if (isCorrect){
        feedback.textContent = "Correct — nicely done.";
        feedback.dataset.tone = "good";
      } else {
        feedback.textContent = `Not quite — it's "${currentBeat.options[currentBeat.correctIndex]}".`;
        feedback.dataset.tone = "bad";
      }
      // Only the real traveler lesson screen has a "continue" button — the
      // admin Lesson editor's preview (see screenAdminLesson) reuses this
      // same handler via its own Prev/Next stepper instead, and has no
      // beat-continue-btn to update.
      const btn = document.getElementById("beat-continue-btn");
      if (btn){
        btn.disabled = false;
        btn.textContent = btn.dataset.final === "true" ? "Mark lesson complete" : "Next question";
      }
      break;
    }

    case "beat-continue": {
      if (!beatResult) return; // gated: see beat-answer
      const top = stack[stack.length - 1];
      const { course, week, stepIndex } = top.payload;
      const total = courseLessonBeats(course, week).length;

      if (stepIndex + 1 < total){
        push("lesson", { course, week, stepIndex: stepIndex + 1 });
        break;
      }
      const courseJustCompleted = course.currentWeek === week && course.currentWeek === course.weeks;
      if (course.currentWeek === week && course.currentWeek < course.weeks){
        course.currentWeek += 1;
      } else if (courseJustCompleted){
        course.status = "completed";
      }
      // Leg-grouped (Blueprint-resolved) courses get a Leg-complete toast
      // with the Leg's own blurb instead of the generic message, when the
      // lesson that just finished was the last one in its Leg — see the
      // TODO(admin) above screenDashboard.
      let toastMsg = "Lesson complete";
      if (course.legs){
        const finishedEntry = course.syllabus[week - 1];
        const nextEntry = course.syllabus[week];
        if (courseJustCompleted){
          toastMsg = "Trip-ready — every Leg complete!";
        } else if (finishedEntry && (!nextEntry || nextEntry.legIndex !== finishedEntry.legIndex)){
          const leg = course.legs[finishedEntry.legIndex];
          toastMsg = `${leg.name} complete — ${leg.blurb}`;
        }
      }
      showToast(toastMsg);
      // A lesson is now a stack of one-question-per-page beats — drop all
      // of them to land back on the dashboard, not just the last one.
      while (stack.length && stack[stack.length - 1].name === "lesson") stack.pop();
      render();
      break;
    }
  }
});

// Date inputs aren't [data-action] elements and fire "change", not
// "click", so they need their own listener outside the delegation above.
document.addEventListener("change", (e) => {
  if (e.target.id === "trip-start" || e.target.id === "trip-end") updateTripCta();

  // Module/Lesson selects that change which fields the form should show
  // (kind -> bespoke country picker, scope -> country picker, a
  // question's kind -> its symbol/heard field) sync the current form
  // into the working draft and do a full re-render, same reasoning as
  // date-field above: these aren't free-text fields, so a re-render
  // can't cost focus/cursor position the way it would on admin-dest-name.
  //
  // The render is deferred a tick rather than run inline: a real browser
  // fires this "change" event (via the implicit blur when focus leaves
  // the field) BEFORE it dispatches the click on whatever the user
  // clicked next — so a synchronous render() here would tear down and
  // replace that click's target mid-dispatch, and since a detached node
  // has nowhere left to bubble to, the click silently never reaches the
  // delegated listener on `document`. Deferring lets that click land
  // first; deferredAdminRerender re-checks the field still exists in
  // case the click navigated to a different screen in the meantime.
  const deferredAdminRerender = (fieldId, readFn) => setTimeout(() => {
    if (!document.getElementById(fieldId)) return;
    readFn();
    render();
  }, 0);
  if (e.target.id === "admin-module-kind" || e.target.id === "admin-module-tiercount" ||
      e.target.id === "admin-module-language" || e.target.id === "admin-module-languagewide"){
    deferredAdminRerender(e.target.id, readAdminModuleForm);
  }
  if (e.target.id === "admin-lesson-module" || e.target.id === "admin-lesson-scope" ||
      e.target.id === "admin-lesson-language" || e.target.id === "admin-lesson-languagewide"){
    deferredAdminRerender(e.target.id, readAdminLessonForm);
  }
  if (/^q-kind-\d+$/.test(e.target.id)){
    deferredAdminRerender(e.target.id, readAdminLessonForm);
  }
  if (e.target.id === "admin-bp-preview-country"){
    const newCountry = e.target.value;
    deferredAdminRerender(e.target.id, () => {
      adminBlueprintPreviewCountry = newCountry;
      if (adminBlueprintDraft) readAdminBlueprintForm();
    });
  }
});

// Admin destination form fields live-patch the preview pane on every
// keystroke/colour pick (see refreshAdminPreview) rather than going
// through a full render(), so text fields keep focus and the native
// colour picker doesn't get yanked shut mid-pick.
document.addEventListener("input", (e) => {
  if (e.target.id && e.target.id.startsWith("admin-dest-")) refreshAdminPreview();
});

render();
</script>

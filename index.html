<!--
================================================================================
 HOLADAY — TRIP-READY LANGUAGE & CULTURE COURSES
 Product Requirements Document, embedded as HTML comments, wrapping a working
 click-through prototype of the core flow. View this file in a browser to
 experience the demo; read the source (comments) for the PRD.
================================================================================

1. PROBLEM
--------------------------------------------------------------------------------
Mainstream language apps (Duolingo, Babbel, Rosetta Stone) teach general
proficiency across months or years. Most people booking a holiday don't want
general proficiency — they have a specific trip, a specific window of time
(often 6-8 weeks out), and a narrow set of situations they'll actually face:
airport and arrival, ordering food, asking directions, basic courtesy, local
customs that prevent embarrassing mistakes. General courses don't prioritise
for that, so people either quit a generic course before the trip or never
start one at all.

2. SOLUTION
--------------------------------------------------------------------------------
Holaday generates a short, finite course (6-8 weeks) scoped to ONE upcoming
trip: the destination country and the kind of trip (city break, food & wine,
family trip, etc). The course ends when the trip is ready to happen — it is
not an ongoing subscription-style curriculum. Content is prioritised by
situational usefulness over grammatical completeness.

3. TARGET USER
--------------------------------------------------------------------------------
Someone who has already booked or is about to book international travel,
wants to be a more respectful and capable visitor, and has weeks (not years)
to prepare. Low tolerance for busywork; high tolerance for short, dense,
trip-relevant lessons.

4. KEY DIFFERENTIATOR
--------------------------------------------------------------------------------
- Scoped by TRIP, not by LANGUAGE. Course = country + trip type + duration.
- Finite and disposable by design: a course "completes" before departure and
  is archived, rather than continuing indefinitely.
- Culture, not just vocabulary: etiquette/customs content is a first-class
  lesson type alongside phrases, because "don't accidentally offend anyone"
  is as valuable to this user as "can order a coffee."
- Visual identity of each course is themed from the destination's national
  flag colours, so a user's course list is instantly scannable and each
  course feels bespoke to that trip.

5. CORE USER JOURNEY (what this prototype demonstrates)
--------------------------------------------------------------------------------
  Home (My Trips)                     — airport-departure-board metaphor;
                                         shows active + past courses.
    -> [no active course] "Book a course" CTA in the empty active slot
    -> Step 1: Choose a country        (grid of destinations)
    -> Step 2: Describe the trip       (trip-type chips + free-text notes)
    -> Generating course               (brief synthesis moment)
    -> Course dashboard                (flag-themed, week-by-week outline,
                                         first three weeks unlocked)
    -> Lesson: Airport & Arrival Essentials  (info page, then separate quiz page)
    -> Lesson: trip-type-flavoured lesson 2  (info page, then separate quiz page)
    -> Lesson: Public Transport & Getting Around (CULTURE lesson — etiquette
                                         + transit phrases — info page, then
                                         separate quiz page)
    -> Back to Home                    — new course now shows as "current",
                                         previous course still listed below.

Every lesson is two pages, not one long scroll (see PRD §11): an info page
told as a single walk-through scenario, then a separate quiz page with
nothing else on it. The split is deliberate — a quick-check that shares
a scrollable page with the answers isn't really testing recall.

Note on emoji use: the UI is otherwise emoji-free by design (see PRD §12)
except for each country's flag, which doubles as its primary visual
identifier on cards and course rows.

6. WHY THE AIRPORT-BOARD METAPHOR
--------------------------------------------------------------------------------
The home screen borrows split-flap departure-board language because it maps
cleanly onto the product's own mental model, not just decoration:
  - A "flight" = a course. It has a destination, a status, and a countdown.
  - BOARDING   = course just generated, not yet started.
  - IN PROGRESS = course underway, shows current week like a "gate."
  - LANDED      = course completed (trip has presumably happened).
This gives users a familiar, glanceable status language instead of a generic
progress bar, and reinforces "this course exists to get you on a plane
prepared," not "this is a permanent subscription."

7. CONTENT MODEL (as implemented in this prototype's JS — see DATA below)
--------------------------------------------------------------------------------
Course = { country, tripType, durationWeeks, currentWeek, status, notes }
Country = { name, capital, colours{primary, secondary, tertiary},
            phrasebank[8 phrases], cultureTip,
            transport{ intro, phrases[3], etiquette[3], scenario, beatPlan } }
(Flags are looked up separately, by country key, from a constant map of
inline SVGs — see PRD §12 — rather than stored as a field on Country.)
TripType = { label, durationWeeks, lesson2Title }
In production, `durationWeeks` and the week-by-week syllabus would likely be
generated by a content model + curated phrase/etiquette database keyed by
country, with trip-type acting as a weighting/prioritisation signal rather
than a hard-coded lesson swap. This prototype hard-codes 6 countries and 6
trip types, and reuses each country's 8-phrase bank across lessons 1 & 2
(rather than authoring 36 unique phrase sets) to keep the demo honest about
scope while still proving the concept end-to-end with real translations.
Week 3 (Public Transport) is the one lesson type that is NOT phrase-bank
reuse — it has its own per-country intro paragraph, 3 transit-specific
phrases, 3 etiquette bullets, and a scenario question, because it exists
specifically to prove out the "culture, not just vocabulary" differentiator
from PRD §4 with real content rather than a placeholder.

Every built lesson (weeks 1-3) IS a 5-question multiple-choice sequence, one
question per page (`buildLessonBeats` in the JS — see §11a), mixing question
styles rather than one repeated drill. "Mark lesson complete" only appears
on the final question and stays disabled until it's answered — a deliberate,
if small, gate so the prototype feels like it's testing retention rather
than just displaying content to scroll past.

8. MVP SCOPE vs OUT OF SCOPE (for a v1 build)
--------------------------------------------------------------------------------
 In scope for v1:
  - Country + trip-type intake, generated course with weekly structure
  - Progressive unlock (future weeks locked until prior week complete)
  - Phrase lessons AND at least one distinct culture/etiquette lesson type
  - Lessons delivered as a sequence of graded questions gating completion,
    not passive content followed by a separate quiz
  - Flag-derived colour theming per course
  - Downloadable offline phrasebook, unlocked once a course is completed
 Explicitly out of scope for v1 (visible in this prototype as disabled stubs):
  - "Explore" and "Profile" bottom-tab destinations
  - Audio pronunciation playback
  - Real spaced-repetition / adaptive quizzing
  - Multi-trip mixing (e.g. multi-city itineraries spanning >1 country)
  - Offline access

9. SUCCESS METRICS (proposed, not instrumented in this prototype)
--------------------------------------------------------------------------------
CORE ASSUMPTION THIS SECTION TESTS: Scoping a course to one finite, dated
trip — rather than an open-ended subscription — is what drives people to
actually FINISH, not just start. General apps fail on completion because
they're open-ended; the bet here is that finiteness + trip-relevance fixes
that.

HYPOTHESIS: We believe trip-scoped, dated courses will produce meaningfully
higher completion rates than general-purpose language apps' typically low
completion. We'll know this is wrong if trip-scoped completion isn't
meaningfully better than general-app baseline once we have real data —
i.e. finiteness and relevance alone aren't enough to overcome the same
drop-off patterns everyone else sees.

  - % of started courses reaching "trip-ready" (all weeks complete) before
    the user's stated travel date (the direct test of the hypothesis above)
  - Completion rate segmented by weeks-to-departure at signup (does more
    urgency at signup predict higher completion?)
  - Completion rate benchmarked against published/estimated completion
    rates for general-purpose language apps, as an external baseline —
    without this, "our number" has nothing to be better than
  - Lesson completion rate in the final 2 weeks before departure (proxy for
    "did this actually get used right before the trip, when it matters")
  - Self-reported confidence delta (pre/post course, 1-5 scale)
  - Post-trip customer satisfaction / NPS, collected once the user's actual
    travel date has passed (see `needsFeedback` / `screenFeedback` in the JS
    below — trip dates are now captured on the trip-details step and stored
    on the course object as `travelStart` / `travelEnd`)

10. OPEN QUESTIONS
--------------------------------------------------------------------------------
  - We now capture actual departure/return dates (see PRD §9 and §14), but
    only to know when to trigger the post-trip feedback prompt — do we also
    use them to back-calculate lesson pacing instead of the flat 6-8 week
    default per trip type?
  - What happens to a course if the trip is postponed/cancelled? (Its
    `travelStart`/`travelEnd` would need to be editable after course
    creation, which isn't supported yet.)
  - Should trip type be multi-select (a trip is rarely just one archetype)?

11. LESSON = A SEQUENCE OF ONE-QUESTION PAGES
--------------------------------------------------------------------------------
Revision history: the very first builds put vocab/etiquette content and a
3-question quiz on one long scrollable page (bad — the quiz measured how far
someone would scroll, not what they remembered). The next revision split that
into an "info" page (a walk-through of phrases/etiquette) followed by a
separate "quiz" page. User testing on THAT version said it still didn't feel
like a lesson — it read as a reference card you skimmed, then a quiz on
content you'd just seen seconds ago, which barely tests retention.

So a lesson is no longer "content, then quiz." It's a sequence of graded
question pages — `payload.stepIndex` picks which one to show, each pushed as
its own stack entry (see `screenLesson`, `buildLessonBeats`, `beat-continue`
action). Every page is scenario-framed and asks exactly one question; there
is no separate content page to read first. The back button still lets someone
return to a prior question, and going back re-presents it fresh (unanswered) —
same one-attempt-per-question spirit as before, just per-page instead of
per-quiz.

11a. MIXED QUESTION STYLES, NOT ONE REPEATED DRILL
--------------------------------------------------------------------------------
Further revision based on feedback: "How do you say X?" five times in a row
is still just a flashcard deck wearing a scenario costume. Each lesson now
mixes three question styles across its 5 questions (`buildLessonBeats` /
`buildBeat` in the JS), all scenario-framed so it still reads as one
situation playing out, not five disconnected drills:
  - "produce"     — "How do you say X?" — English prompt, answer in the
    local language. Tests recall/production.
  - "comprehend"  — a local phrase is quoted as something someone just said
    to you ("The officer says: '...' — what are they telling you?") — local
    phrase shown, answer in English. Tests listening/comprehension, the
    reverse direction of "produce."
  - "symbol"      — a sign or icon is shown ("You notice this on a seat —
    what does it mean?") with a small inline SVG (`SYMBOLS` in the JS, same
    font-independent rationale as `FLAGS` — see §12) standing in for a real
    transit/customs sign. Tests recognition of non-verbal cues, not just
    vocabulary.
  - "situational" — week 3 (Public Transport) only, "what would you do?"
    judgement calls. Reuses each country's existing `transport.scenario`
    content unchanged, just delivered as one beat among the five instead of
    a bonus 3rd quiz question tacked onto the end.

Weeks 1 and 2 pull from generic, shared beat plans (`ARRIVAL_BEAT_PLAN`,
`EXPLORE_BEAT_PLAN`) applied to each country's 8-phrase bank — see PRD §7,
still no 36 hand-authored phrase sets — since arriving and greeting someone
plays out the same way regardless of destination; only the scene-setting
context flexes per country (week 1) or trip type (week 2, via `exploreIntro`).
Week 3 (Public Transport) is bespoke per country (`transport.beatPlan` on
each Country, see DATA below), because its phrases/etiquette were already
bespoke per country and the symbol/situational beats are tied to a specific
country's real transit rules (e.g. Japan's quiet carriages, Italy's ticket
validation, Morocco's taxi meters) — a generic prompt wouldn't fit all six.

12. ICONOGRAPHY / EMOJI POLICY
--------------------------------------------------------------------------------
No decorative emoji anywhere in the UI (trip-type chips, tab bar, buttons).
Country flags are the one visual identifier that matters enough to keep, but
they are NOT Unicode flag emoji — those are font-dependent, and several
common platforms (older Windows, many Linux desktops without a colour-emoji
font) silently fall back to rendering a flag sequence as plain two-letter
text (e.g. "JP"), which quietly defeats "flag = instant visual identity."
Flags are instead small inline SVGs (the `FLAGS` constant in the JS, one
per country, built from the same colours already stored per Country), so
every viewer sees an actual coloured flag chip regardless of OS or installed
fonts.

13. OFFLINE PHRASEBOOK
--------------------------------------------------------------------------------
Deliberately gated to COMPLETED courses only (see the `ticket__cta` button
that appears in `screenDashboard` when `course.status === "completed"`),
not available mid-course. Rationale: the phrasebook is framed as the
take-away artefact from a finished course — "you did the prep, here's the
condensed reference for the trip itself" — rather than a shortcut that
lets someone skip the lessons and just grab the phrase list on day one.
A real v1 might reconsider this (e.g. unlock per-lesson as content is
completed, so a partially-finished course still has a partial phrasebook),
but "completed only" is the simplest version that proves the feature.

Content is compiled, not separately authored: it's the same country
phrasebank + transport phrasebank + cultureTip + transport etiquette
already used across the lessons (`screenPhrasebook`), reassembled into one
reference page — there is no new content model here, just a new view over
existing data.

The "Download for offline use" button is an intentional stub (see
`download-phrasebook` in the event delegation) — it shows a toast instead
of producing a file, exactly like the disabled Explore/Profile tabs. In a
real build this would generate a PDF or add-to-device-storage flow; this
prototype only needs to prove that the entry point and framing exist.

14. POST-TRIP FEEDBACK
--------------------------------------------------------------------------------
Trip details (Step 2) now asks for departure and return dates alongside trip
type and notes, stored on the course as `travelStart` / `travelEnd`. This
exists to answer the PRD §9 metric that couldn't be collected before: NPS
and a culture-content-specific question, gathered once the trip has actually
happened rather than at course completion (a course can be "trip-ready"
before departure and still not have a real post-trip result yet).

`needsFeedback(course)` is true once `travelEnd` is in the past and
`feedbackSubmitted` is still false, regardless of whether the course's
lessons were ever finished — a badly-prepared trip is exactly the case we
most want feedback on, not just the well-completed ones. This is
check-on-render rather than a scheduled push (see PRD §10 note on
`finalizeCourse`): the dashboard ticket shows a "Share trip feedback" CTA,
and the home board row appends "Feedback requested" to the row subtitle, so
the prompt is visible wherever the course already surfaces rather than
interrupting with a separate notification.

This prototype now starts with no seed/demo course (see STATE below) — to
see the feedback CTA, generate a course and pick a return date in the past;
the date inputs don't restrict picking a past date for exactly this reason
(a real build would likely disallow a return date before departure, which
this prototype does validate, but wouldn't otherwise constrain the range).

15. ADMIN / CONTENT AUTHORING — PLANNED, NOT YET BUILT
--------------------------------------------------------------------------------
Everything below this line still describes the TRAVELER-facing prototype
only. This file has no admin/content-authoring surface yet — every country,
phrase, beat plan, and trip type is a hardcoded JS literal maintained by
hand, not authored/reviewed/published content.

See ADMIN-CONTENT-PLAN.md (repo root) for the full design: a content
hierarchy of Phrase -> Question -> Lesson -> Module -> Trip Type Blueprint,
each with its own Draft -> Staged -> Published lifecycle;
a reusable content library so a Question like
"how do you say hello" is authored once and attached to many Lessons
instead of re-embedded per lesson; and a Blueprint concept where a course
is a series of named "Legs" (e.g. Leg 1: Slightly Scared Tourist, Leg 2:
Confident Traveller) that repeat the same core themes at increasing
difficulty/length rather than a flat one-topic-per-week list. Search this
file for "TODO(admin)" for where each piece of that plan lands in the
current code.

--------------------------------------------------------------------------------
 The rest of the comments in this file are scoped to the section they sit
 above/inside, covering UX rationale and implementation notes at that level.
================================================================================

     DESIGN TOKENS

     rainbow — the neutral chrome is the constant, the flag accent
     is the variable.
     ============================================================ */
  :root{
    --ink: #14181f;
    --ink-soft: #232a37;
    --ink-line: #333c4d;
    --paper: #f5f3ee;
    --paper-dim: #e8e4d9;
    --paper-line: #d8d2c2;
    --amber: #ffb300;
    --amber-deep: #8a5c00;
    --slate: #6b7280;

    --radius-s: 6px;
    --radius-m: 12px;
    --font-display: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    font-family: var(--font-display);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,p,ul{ margin:0; }
  button{ font-family:inherit; }
  ::selection{ background: var(--amber); color: var(--ink); }

  /* Visible keyboard focus everywhere — quality floor, not decoration */

    outline: 2px solid var(--amber);
    outline-offset: 2px;

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ============================================================
     MOBILE-FIRST APP SHELL
     Base rules below target a phone viewport with no media query.

  .statusbar__batt::before{ content:""; position:absolute; inset:1.5px; width:70%; background:var(--ink); border-radius:1px; }

  .appbar{
    flex-shrink: 0;
    display:flex; align-items:center; gap:10px;
    padding: 6px 16px 14px;
    min-height: 44px;
  }

<!--
  App shell: a fixed status bar (cosmetic — establishes "this is a phone
  screen" framing for reviewers), an app bar that is re-rendered per
  screen (title/back-button/badge change with context), the single
  #app mount point that all screens render into, and a bottom tab bar
  where only "Trips" is implemented — Explore/Profile are visible but
  disabled to signal planned-but-out-of-scope surface area.
-->
<div class="app-shell">
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons">
      <span class="statusbar__bars"><span></span><span></span><span></span><span></span></span>
      <span class="statusbar__batt"></span>
    </span>
  </div>

  <main id="app"></main>

  <!--
    Admin entry point (see ADMIN-CONTENT-PLAN.md §10): the 4th "Admin" tab
    below drops into the admin stack (admin-home / admin-destinations /
    admin-staged / admin-destination), rendered full-width — see
    .app-shell.is-admin and the admin-* SCREENS entries.
    STILL NOT the intended end state: this is demo-phase scaffolding for
    validating the flows. The real admin surface should be its own
    separate app, optimised for desktop/laptop, not a mode bolted onto
    this mobile traveler app or shipped in the same bundle.
  -->

    <button class="tabbar__item" data-active="true" data-action="go-home"><span>Trips</span></button>
    <button class="tabbar__item" disabled data-action="stub-tab"><span>Explore</span></button>
    <button class="tabbar__item" disabled data-action="stub-tab"><span>Profile</span></button>
    <button class="tabbar__item" data-action="go-admin"><span>Admin</span></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================================================================
   FLAG ICONS
   Deliberately NOT Unicode flag emoji: those are font-dependent —
   several common platforms (older Windows, many Linux desktops
   without a colour-emoji font) fall back to rendering a flag
   sequence as plain two-letter text, which defeats the entire point
   of "flag = instant visual identity" from PRD §6/§11. These are
   small inline SVGs instead, so every user sees the same coloured
   flag regardless of OS/font support.
   ================================================================ */
const FLAGS = {
  japan: `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#BC002D"/></svg>`
};

/* ================================================================
   DATA
   Real translations/phrases below (not lorem ipsum) so the lesson
   screens are credible on their own, not just structurally present.
   In production this bank would come from a curated content DB,

const FLAG_PATTERNS = {

// Per PRD §12, flags are hand-built shapes from the destination's three
// colours, not an upload/photo picker — this is that "small in-app tool"
// called for in ADMIN-CONTENT-PLAN.md §2a step 2, applied to whichever
// colours the author has picked so far.
function buildFlagSvg(pattern, colours){
  const p = colours.primary, s = colours.secondary, t = colours.tertiary;
  switch (pattern){
    case "horizontal-tricolor":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${s}"/><rect width="30" height="6.67" fill="${p}"/><rect y="13.33" width="30" height="6.67" fill="${t}"/></svg>`;
    case "circle-on-field":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${s}"/><circle cx="15" cy="10" r="6" fill="${p}"/><circle cx="15" cy="10" r="6" fill="none" stroke="${t}" stroke-width="1.2"/></svg>`;
    case "cross-on-field":
      return `<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="${t}"/><rect x="12" width="6" height="20" fill="${s}"/><rect y="7" width="30" height="6" fill="${s}"/><rect x="13.2" width="3.6" height="20" fill="${p}"/><rect y="8.2" width="30" height="3.6" fill="${p}"/></svg>`;
    case "vertical-tricolor":
    default:
      return `<svg viewBox="0 0 30 20"><rect width="10" height="20" fill="${p}"/><rect x="10" width="10" height="20" fill="${s}"/><rect x="20" width="10" height="20" fill="${t}"/></svg>`;
  }
}

function adminFlagMarkup(record){
  if (record.legacy) return FLAGS[record.countryKey];
  return buildFlagSvg(record.data.flagPattern || "vertical-tricolor", record.data.colours);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "destination";
}

let adminIdSeq = 1;
function nextAdminId(prefix){ return prefix + "-" + (adminIdSeq++); }

/* ----------------------------------------------------------------
   Language — a lightweight taxonomy dimension, not staged/published
   content (no draft/staged lifecycle like Country/Module/Lesson get).
   Every Country names one Language it uses; Modules/Lessons authored
   as "applies to all countries using this language" resolve against
   whichever Countries currently carry that languageId, so adding a
   7th country in an already-covered language picks up that content
   automatically instead of needing it re-authored per country.
   ---------------------------------------------------------------- */
let adminLanguages = [];
function ensureLanguage(name){
  let lang = adminLanguages.find(l => l.name.toLowerCase() === name.toLowerCase());
  if (!lang){
    lang = { id: nextAdminId("lang"), name };
    adminLanguages.push(lang);
  }
  return lang;
}
const COUNTRY_LANGUAGES = {
  japan: "Japanese"
};
Object.values(COUNTRY_LANGUAGES).forEach(ensureLanguage);

  data: {
    name: c.name,
    capital: c.capital,
    colours: { ...c.colours },
    flagPattern: null,

// Destinations Module/Lesson content is authored against — only published
// ones are offered, so authoring a 7th destination (see the Destination
// flow above) genuinely unlocks it as a target here, the same way it
// would gate a real Blueprint's country coverage (§4/§6).
function publishedDestinations(){

}

// Unified country lookup for every traveler-facing screen: prefers the
// published Admin Destination record (§2a) so a country authored and
// published through the admin surface "pulls through" into the
// traveler app immediately, without needing a matching COUNTRIES
// entry. `transport` (the raw weeks-1-3 beat-plan phrase bank + the
// offline Phrasebook's "Getting around"/etiquette content) only exists
// on the one remaining hardcoded COUNTRIES entry — an Admin-authored
// country instead relies entirely on published Modules/Lessons via a
// Blueprint (see finalizeCourse/resolveBlueprintSyllabus), so callers
// must treat a null transport as "not available" rather than assume
// every country has one. `phrases` (the offline Phrasebook's
// "Essentials" section) falls back to any published admin-authored
// Phrases (§7) scoped to this country when there's no legacy bank —
// see travelerPhraseBank below.
function travelerCountry(countryKey){
  const dest = adminDestinations.find(d => d.countryKey === countryKey && d.status === "published");
  const legacy = COUNTRIES[countryKey];
  if (!dest && !legacy) return null;
  return {
    name: dest ? dest.data.name : legacy.name,
    capital: dest ? dest.data.capital : legacy.capital,
    colours: dest ? dest.data.colours : legacy.colours,
    cultureTip: dest ? dest.data.cultureTip : legacy.cultureTip,
    flag: dest ? adminFlagMarkup(dest) : FLAGS[countryKey],
    phrases: legacy ? legacy.phrases : travelerPhraseBank(countryKey),
    transport: legacy ? legacy.transport : null
  };
}

// Published admin-authored Phrases (§7) scoped to this country, in the
// {en, local, translit} shape vocabCardHtml/the offline Phrasebook
// already expect — null (not []) when there are none, so callers that
// check truthiness to decide "any phrasebook content at all" still work.
function travelerPhraseBank(countryKey){
  const matches = adminPhrases.filter(p => p.status === "published" && phraseAppliesToCountry(p, countryKey));
  if (!matches.length) return null;
  return matches.map(p => ({ en: p.data.en, local: p.data.local, translit: p.data.translit }));
}

/* ================================================================
   ADMIN CONTENT BANK — Module (§4) + Lesson (§3)

   A Lesson always names the Module + Tier it belongs to; a Module's
   "tier ladder completeness" grid (§4 step 3) is derived by scanning
   Lessons for that (moduleId, tier[, countryKey]) rather than stored
   redundantly, so the two can never drift out of sync. Publishing a
   Module is blocked until every cell it claims is itself Published
   (moduleIsComplete below) — the gating cascade from §6.

   Question authoring is a partial simplification of §3 step 2: the plan
   calls for a searchable, reusable Phrase/Question library ("attach by
   reference, only create new if nothing fits" — see §7). A produce/
   comprehend Question can now attach to a Phrase by reference (§7,
   Phrase content type below) instead of hand-typing prompt/answer/
   distractors — but symbol/situational Questions, and any produce/
   comprehend Question an author chooses not to phrase-link, still author
   their content inline on the Lesson, not against a shared library.
   ================================================================ */
let adminModules = [];
let adminModuleDraft = null;
let adminLessons = [];
let adminLessonDraft = null;
let adminLessonPreviewIndex = 0; // which authored question the Lesson editor's live preview is showing
let adminPhrases = [];
let adminPhraseDraft = null;

const ADMIN_STATUS_RANK = { missing:0, archived:0, draft:1, staged:2, published:3 };

function countryByKey(countryKey){
  return adminDestinations.find(d => d.countryKey === countryKey) || null;
}
// Countries currently published under a Language — deliberately computed
// live rather than stored on the Language/Module/Lesson, so a Country
// added later in an already-authored Language picks up "applies to all
// countries using this language" content without that content needing
// to be re-saved.
function countriesForLanguage(languageId){
  return publishedDestinations().filter(d => d.data.languageId === languageId);
}
// Every Country an author can target with new content against this
// Language, regardless of the Country's own status — a Module or
// Lesson shouldn't have to wait on a Country being Published before
// work on it can start. Only Published countries count toward a Module's
// completeness/publishability though (see countriesForLanguage/
// moduleGridRows above) — that's a stricter, separate question about
// what's actually live for travelers.
function activeCountriesForLanguage(languageId){
  return adminDestinations.filter(d => d.status !== "archived" && d.data.languageId === languageId);
}
function languageName(languageId){
  const lang = adminLanguages.find(l => l.id === languageId);
  return lang ? lang.name : "Unknown language";
}
function moduleScopeLabel(mod){
  if (mod.data.kind === "generic") return "Generic — every country";
  if (mod.data.languageWide) return `All countries using ${languageName(mod.data.languageId)}`;
  const country = countryByKey(mod.data.countryKey);
  return country ? country.data.name : "No country set";
}
function lessonScopeLabel(lesson){
  if (lesson.data.scope === "generic") return "Generic — every country";
  if (lesson.data.languageWide) return `All countries using ${languageName(lesson.data.languageId)}`;
  const country = countryByKey(lesson.data.countryKey);
  return country ? country.data.name : "No country set";
}
// A bespoke Module/Lesson "applies to" a country either because it's
// pinned to that exact country, or because it's language-wide and the
// country's languageId matches — this is the hook that makes browsing
// modules/lessons for a Country also surface content authored against
// that Country's Language.
function moduleAppliesToCountry(mod, countryKey){
  if (mod.data.kind === "generic") return true;
  if (mod.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!mod.data.languageId && country.data.languageId === mod.data.languageId;
  }
  return mod.data.countryKey === countryKey;
}
function lessonAppliesToCountry(lesson, countryKey){
  if (lesson.data.scope === "generic") return true;
  if (lesson.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!lesson.data.languageId && country.data.languageId === lesson.data.languageId;
  }
  return lesson.data.countryKey === countryKey;
}
// Stricter match used for the tier-ladder grid/blueprint resolution: only
// a Lesson actually scoped to a country (bespoke, not "generic") can fill
// a bespoke Module's per-country cell — see moduleLessonCandidates below.
function lessonMatchesGridCountry(lesson, countryKey){
  if (lesson.data.scope !== "country-specific") return false;
  if (lesson.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!lesson.data.languageId && country.data.languageId === lesson.data.languageId;
  }
  return lesson.data.countryKey === countryKey;
}
// A Phrase has no "generic" scope (unlike Module/Lesson) — it's always
// text in one specific local language, so it's always either pinned to
// one Country or language-wide across every Country using that Language.
function phraseAppliesToCountry(phrase, countryKey){
  if (phrase.data.languageWide){
    const country = countryByKey(countryKey);
    return !!country && !!phrase.data.languageId && country.data.languageId === phrase.data.languageId;
  }
  return phrase.data.countryKey === countryKey;
}
function phraseScopeLabel(phrase){
  if (phrase.data.languageWide) return `All countries using ${languageName(phrase.data.languageId)}`;
  const country = countryByKey(phrase.data.countryKey);
  return country ? country.data.name : "No country set";
}

function moduleLessonCandidates(mod, tier, countryKey){
  return adminLessons.filter(l =>
    l.data.moduleId === mod.id &&
    l.data.tier === tier &&
    (mod.data.kind === "generic" ? l.data.scope === "generic" : lessonMatchesGridCountry(l, countryKey))
  );
}
function moduleCellStatus(mod, tier, countryKey){
  const candidates = moduleLessonCandidates(mod, tier, countryKey);
  if (!candidates.length) return "missing";
  return candidates.reduce((best, l) => ADMIN_STATUS_RANK[l.status] > ADMIN_STATUS_RANK[best] ? l.status : best, "missing");
}
// A language-wide bespoke Module's grid rows are every published country
// currently using its Language (see countriesForLanguage) rather than a
// fixed list, so the completeness grid stays accurate as new countries
// join that language.
function moduleGridRows(mod){
  if (mod.data.kind === "generic") return [null];
  if (mod.data.languageWide) return countriesForLanguage(mod.data.languageId).map(d => d.countryKey);
  return mod.data.countryKey ? [mod.data.countryKey] : [];
}
function moduleIsComplete(mod){
  const rows = moduleGridRows(mod);
  if (!rows.length) return false;
  for (const countryKey of rows){
    for (let tier = 1; tier <= mod.data.tierCount; tier++){
      if (moduleCellStatus(mod, tier, countryKey) !== "published") return false;
    }
  }
  return true;
}

// Turns an admin-authored Question row into the exact beat shape
// renderBeat()/makeQuestion() already produce for the traveler-facing
// lesson screen (see buildBeat below), so the Lesson editor's live
// preview is the literal traveler beat renderer, not a lookalike copy —
// ADMIN-CONTENT-PLAN.md §3 step 3. A phrase-sourced produce/comprehend
// Question (§7) is built the same way produceBeat/comprehendBeat build
// one from the legacy hardcoded phrase bank (see below) — distractors
// sampled from sibling published Phrases in the Lesson's own scope,
// not hand-typed. Returns null if a phrase-sourced Question's Phrase
// reference no longer resolves to a published record (deleted, or
// archived by a newer version after this Lesson itself published) —
// callers filter nulls out, mirroring resolveBlueprintSyllabus's
// "skip what doesn't resolve" handling of broken references.
function adminQuestionToBeat(q, lessonData){
  if ((q.kind === "produce" || q.kind === "comprehend") && q.source === "phrase"){
    const phrase = q.phraseId ? adminPhrases.find(p => p.id === q.phraseId) : null;
    if (!phrase || phrase.status !== "published") return null;
    const pool = phrasesForLesson(lessonData).filter(p => p.status === "published" && p.id !== phrase.id);
    const distractorPhrases = shuffle(pool).slice(0, 3);
    if (q.kind === "comprehend"){
      const mq = makeQuestion(q.question, phrase.data.en, distractorPhrases.map(p => p.data.en));
      return { kind:"comprehend", context:q.context, heard:phrase.data.local, ...mq };
    }
    const mq = makeQuestion(`How do you say "${phrase.data.en}"?`, phrase.data.local, distractorPhrases.map(p => p.data.local));
    return { kind:"produce", context:q.context, ...mq };
  }
  const mq = makeQuestion(q.question, q.correctAnswer, (q.distractors || []).filter(Boolean));
  if (q.kind === "symbol") return { kind:"symbol", context:q.context, symbol:q.symbol, ...mq };
  if (q.kind === "comprehend") return { kind:"comprehend", context:q.context, heard:q.heard, ...mq };
  return { kind:q.kind, context:q.context, ...mq };
}

/* ================================================================
   ADMIN CONTENT BANK — Trip Type Blueprint (§5)

   Simplification: authored against the 6 existing hardcoded TRIP_TYPES
   keys rather than also supporting "define a new Trip Type" (§5 step 1)
   — adding a wholly new trip type is really its own small Destination-
   shaped flow (name a thing, theme it) and isn't needed to demonstrate
   the Blueprint/Leg/gating machinery itself.

   Leg gating is deliberately cheap to compute: a Module's own Publish
   action already requires moduleIsComplete() (§4) — every Tier it
   claims, for every country it claims, has a Published Lesson — so a
   Blueprint only needs to check that every Module it gates in is
   itself Published; it doesn't need to re-walk tiers/countries itself.
   ================================================================ */
const LEG_LADDER = ["Slightly Scared Tourist", "Confident Traveller", "Seasoned Explorer", "Honorary Local"];

let adminBlueprints = [];
let adminBlueprintDraft = null;
let adminBlueprintPreviewCountry = null;

function blankLeg(name){
  return { name: name || "", blurb: "", moduleGates: [] };
}

// Returns every published Lesson gated into this (moduleId, tier) cell
// for this country — a Tier can carry more than one Lesson (§4), and a
// traveler's syllabus includes all of them, not just one (§6).
function resolveBlueprintGateLessons(gate, countryKey){
  const mod = adminModules.find(m => m.id === gate.moduleId);
  if (!mod) return [];
  return adminLessons.filter(l =>
    l.status === "published" &&
    l.data.moduleId === mod.id &&
    l.data.tier === gate.tier &&
    (mod.data.kind === "generic" ? l.data.scope === "generic" : lessonMatchesGridCountry(l, countryKey))
  );
}

function blueprintIsPublishable(bp){
  const allGates = bp.data.legs.flatMap(leg => leg.moduleGates);
  if (!allGates.length) return false;
  return allGates.every(gate => {
    const mod = adminModules.find(m => m.id === gate.moduleId);
    return mod && mod.status === "published";
  });
}

// Resolves a traveler's (countryKey, tripKey) against a published
// Blueprint for that Trip Type (§8/§9), one "week" per gated Module in
// Leg order. Skips empty Legs and any gate that fails to resolve for
// this specific country (only possible for a bespoke Module gated to a
// different country than the traveler picked — a published Blueprint
// otherwise guarantees every gate resolves, since Module publish itself
// requires every tier/country cell to already be a published Lesson).
// Returns null if there's no published Blueprint for this Trip Type, or
// nothing resolves for this country — the caller falls back to the
// legacy hardcoded syllabus() so unauthored Trip Types keep working.
function resolveBlueprintSyllabus(countryKey, tripKey){
  const bp = adminBlueprints.find(b => b.status === "published" && b.data.tripKey === tripKey);
  if (!bp) return null;
  const legs = [];
  const weeks = [];
  bp.data.legs.forEach(leg => {
    if (!leg.moduleGates.length) return;
    const legIndex = legs.length;
    let legUsed = false;
    leg.moduleGates.forEach(gate => {
      const lessons = resolveBlueprintGateLessons(gate, countryKey);
      if (!lessons.length) return;
      if (!legUsed){ legs.push({ name: leg.name, blurb: leg.blurb }); legUsed = true; }
      lessons.forEach(lesson => {
        weeks.push({ title: lesson.data.title, type: lesson.data.type, source: "authored", legIndex, lessonId: lesson.id });
      });
    });
  });
  if (!weeks.length) return null;
  return { legs, weeks };
}

function push(name, payload){ stack.push({ name, payload }); render(); }
function pop(){ if (stack.length > 1){ stack.pop(); render(); } }
function resetToHome(){ stack = [{ name:"home" }]; render(); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("is-visible");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove("is-visible"), 1600);
}

/* ================================================================
   SCREEN: HOME

   ASSUMPTION: The departure-board status language (BOARDING / IN
   PROGRESS / LANDED) is more legible and motivating at a glance than a
   conventional progress bar or percentage, and reinforces "this is
   finite, not a subscription" without needing explanatory copy.

   HYPOTHESIS: We believe users correctly infer course state from the
   status labels alone — without confusing "Boarding" for "not started
   yet, nothing to do," or "Landed" for "archived/inaccessible." We'll
   know this is wrong if usability sessions show users misreading a
   status label, or hesitating over what action to take from a given
   status.

   VALIDATION METRIC: Quick comprehension check in early usability
   sessions — show the home screen and ask users to say, in their own
   words, what each status means and what happens if they tap it; track
   % correct per label. In-app, tap-through rate on "Landed" rows (do
   people still open completed courses, e.g. to revisit the phrasebook)
   as a secondary signal.
   ================================================================ */
function screenHome(){
  const current = courses.filter(c => c.status === "active");
  const previous = courses.filter(c => c.status === "completed");

  const currentHtml = current.length
    ? current.map(rowHtml).join("")
    : `
      <div class="board-empty">
        <div class="board-empty__flap">NO ACTIVE TRIP</div>
        <button class="btn-primary" data-action="start-course">Book a course</button>
      </div>`;

  const previousHtml = previous.length
    ? previous.map(rowHtml).join("")
    : `<p style="font-size:12.5px;color:var(--slate);padding:4px 2px;">Completed courses will land here.</p>`;

  return `
    <div class="section-label">Current</div>
    ${currentHtml}
    <div class="section-label">Previous</div>
    ${previousHtml}
  `;

  // TODO(admin): As a traveler, I want this row's subtitle to read "Leg 2
  // of 3 · Lesson 2 of 4" instead of "Week 4 of 7", once courses carry
  // currentLeg/totalLegs/legName (see STATE and finalizeCourse TODOs
  // above) — the Home board is the other place progression should be
  // legible at a glance, not just inside the dashboard. See
  // ADMIN-CONTENT-PLAN.md §9.
  function rowHtml(c){
    const country = travelerCountry(c.countryKey);
    const statusClass = c.status === "completed" ? "status--landed" : (c.currentWeek <= 1 ? "status--boarding" : "status--progress");
    const statusText = c.status === "completed" ? "Landed" : (c.currentWeek <= 1 ? "Boarding" : "In progress");
    return `
      <button class="board-row" data-action="open-course" data-course="${c.id}">
        <span class="board-row__flag flag-icon">${country.flag}</span>
        <span class="board-row__mid">
          <div class="board-row__dest">${country.name.toUpperCase()} · ${TRIP_TYPES[c.tripKey].label}</div>
          <div class="board-row__sub">${c.status === "completed" ? "Completed · " + c.weeks + " wks" : "Week " + c.currentWeek + " of " + c.weeks}${needsFeedback(c) ? " · Feedback requested" : ""}</div>
        </span>
        <span class="board-row__status ${statusClass}">${statusText}</span>
      </button>`;
  }
}

   HYPOTHESIS: We believe these 6 destinations cover enough of our early

/* ================================================================

   Chip selection updates the CTA's shown duration in place (no

   ASSUMPTION: The 6 trip-type chips capture enough of how a real trip

   HYPOTHESIS: We believe users can accurately self-categorize their trip
   into one of these 6 archetypes, rather than feeling like their trip is
   a poor fit for all of them. We'll know this is wrong if testers
   frequently say "none of these really describe my trip," or write notes
   that contradict/override their chip choice.

   VALIDATION METRIC: Track chip-selection hesitation — time spent on
   this screen before selecting, and whether users change their chip
   selection after starting to type notes (a proxy for "the chip didn't
   feel right, so they're compensating in free text").
   ================================================================ */
function screenTrip(){
  const country = travelerCountry(draft.countryKey);
  return `
    <p style="font-size:13px;color:var(--slate);margin:6px 2px 14px;">Step 2 of 2 — what's the ${country.name} trip actually like? This shapes which lessons come first.</p>

        <button class="chip" data-action="select-trip" data-trip="${key}" data-selected="false">

      </div>

        <input type="date" id="trip-end">
      </div>
    </div>

    <label class="field-label" for="trip-notes">Anything else worth knowing? (optional)</label>
    <textarea class="notes" id="trip-notes" placeholder="e.g. staying with family, mostly rural, doing a food tour on day 2..."></textarea>
    <div class="sticky-cta">
      <button class="btn-primary" id="trip-cta" data-action="confirm-trip" disabled>Choose a trip type above</button>
    </div>
  `;

// Trip-type chip selection and the two date inputs both gate the same CTA,
// so this is the single place that decides its enabled/disabled state and
// label — called from the "select-trip" click handler and from the date
// inputs' native "change" listener (dates aren't [data-action] elements,
// so they can't go through the click delegation below).
function updateTripCta(){
  const cta = document.getElementById("trip-cta");
  if (!cta) return;
  const hint = document.getElementById("date-hint");
  const start = document.getElementById("trip-start").value;
  const end = document.getElementById("trip-end").value;
  const datesEntered = !!(start && end);
  const datesValid = datesEntered && new Date(end) >= new Date(start);
  if (hint){
    hint.textContent = (datesEntered && !datesValid) ? "Return date can't be before the departure date." : "";
    hint.dataset.tone = (datesEntered && !datesValid) ? "bad" : "";
  }
  if (!draft.tripKey){
    cta.disabled = true;
    cta.textContent = "Choose a trip type above";
  } else if (!datesValid){
    cta.disabled = true;
    cta.textContent = "Add your travel dates above";
  } else {
    cta.disabled = false;
    cta.textContent = `Start my ${TRIP_TYPES[draft.tripKey].weeks}-week course`;
  }
}

/* ================================================================
   SCREEN: GENERATING
   The one place this prototype spends its "signature motion"
   budget: a split-flap-style status line cycling through synthesis
   steps, echoing the departure-board identity from the home screen,
   before auto-advancing into the freshly generated course.

   ASSUMPTION: Showing named synthesis steps ("SCANNING PHRASEBOOK,"
   "WEIGHTING BY TRIP TYPE," etc.) builds trust that the course is
   genuinely personalized to the user's trip — rather than reading as
   generic loading-screen theater that users see through and discount.

   HYPOTHESIS: We believe naming specific weighting/sequencing steps
   (vs. a generic spinner) increases users' perceived personalization of
   the resulting course. We'll know this is wrong if users can't recall
   or don't believe the steps reflected real personalization when asked
   afterward.

   VALIDATION METRIC: Post-generation micro-survey (single question,
   e.g. "How tailored does this course feel to your trip?" 1-5)
   compared between a group that sees the current step-by-step flap
   animation vs. a plain spinner control.
   ================================================================ */
function screenGenerating(){
  return `
    <div class="generating">
      <div class="flap" id="flap-text">SCANNING PHRASEBOOK</div>
      <div class="spinner-dots"><span></span><span></span><span></span></div>
      <div class="generating__sub">Building your course from real, weighted phrase priority — arrival first, small talk later.</div>
    </div>
  `;
}
function runGenerating(payload){
  const steps = ["SCANNING PHRASEBOOK", "WEIGHTING BY TRIP TYPE", "SEQUENCING 6–8 WEEKS", "PRINTING BOARDING PASS"];
  let i = 0;
  const el = document.getElementById("flap-text");
  const iv = setInterval(()=>{
    i++;
    if (!el) { clearInterval(iv); return; }
    if (i < steps.length){ el.textContent = steps[i]; }
  }, 420);
  setTimeout(()=>{
    clearInterval(iv);
    finalizeCourse(payload);
  }, 420 * steps.length + 250);
}

// Departure/return dates are captured on the trip details step
// (screenTrip) and stored here so `needsFeedback` (below `screenDashboard`)
// can check-on-render whether the trip has actually happened yet — see
// PRD §14. `weeks`/pacing still comes from the trip-type default, not from
// the date range (see PRD §10 open question — that's still unresolved).
//
// Resolves the traveler's Trip Type against a *published* Blueprint
// (ADMIN-CONTENT-PLAN.md §8/§9) rather than the flat TRIP_TYPES.weeks
// constant, when one exists for this Trip Type. `course.syllabus` is
// snapshotted here (each entry's `lessonId`, not a live Blueprint/Module
// lookup) so a Blueprint published later doesn't retroactively change the
// syllabus of a trip already in progress — the same effect the plan's
// "pin a templateVersion" note calls for, achieved by pinning the
// resolved Lesson ids instead of re-resolving from the Blueprint at
// render time. Trip Types with no published Blueprint yet fall back to
// the legacy hardcoded syllabus() so the rest of the prototype's trip
// types keep working unauthored.
function finalizeCourse(payload){
  const resolved = resolveBlueprintSyllabus(payload.countryKey, payload.tripKey);
  const syllabusWeeks = resolved
    ? resolved.weeks
    : syllabus(payload.tripKey).map(w => ({ title: w.title, type: w.type, source: "legacy", legIndex: null, lessonId: null }));
  const course = {
    id: "c" + Date.now(),
    countryKey: payload.countryKey,
    tripKey: payload.tripKey,
    weeks: syllabusWeeks.length,
    syllabus: syllabusWeeks,
    legs: resolved ? resolved.legs : null,
    currentWeek: 1,
    status: "active",
    notes: payload.notes || "",
    travelStart: payload.startDate,
    travelEnd: payload.endDate,
    feedbackSubmitted: false,
    feedback: null
  };
  courses.unshift(course);
  // Replace the generating screen in-place (don't leave it in back-stack)
  stack.pop();
  push("dashboard", { course });
}

// Check-on-render rather than a scheduled push notification (this
// prototype has no background/server component to run a scheduled job
// from) — called wherever a course is displayed, so the moment a user
// opens the app after their return date, the prompt is already there.
function tripEnded(course){
  return !!course.travelEnd && new Date(course.travelEnd) < new Date();
}
function needsFeedback(course){
  return tripEnded(course) && !course.feedbackSubmitted;
}

/* ================================================================
   SCREEN: DASHBOARD

   ASSUMPTION: Progressive unlock (future weeks locked until the prior
   week is marked complete) is read by users as helpful pacing/focus,
   not as an artificial gate that frustrates people who want to skim
   ahead or binge content before their trip.

   HYPOTHESIS: We believe locking future weeks increases actual lesson
   completion (vs. exposing the whole syllabus at once and letting
   people jump around), because it keeps users focused on one thing at
   a time rather than skimming and losing momentum. We'll know this is
   wrong if a meaningful share of testers tap locked weeks repeatedly
   (frustration signal), or say in feedback that they wanted to preview
   later content.

   VALIDATION METRIC: Tap-on-locked-week event rate (how often users
   try to open something that's locked) as a frustration proxy, plus a
   completion-rate comparison if/when we A/B against an
   unlocked-all-weeks variant.

   Course progression is Leg-grouped whenever `course.legs` is present
   (ADMIN-CONTENT-PLAN.md §8/§9) — i.e. the course was resolved from a
   published Blueprint rather than the legacy hardcoded syllabus():
     - Ticket stats: "Leg n of N" is added alongside total weeks (kept as
       a secondary stat for trip-date pacing, not replaced).
     - Week-list is Leg-grouped, reusing the existing `.section-label`
       pattern as Leg headers ("LEG 1 — SLIGHTLY SCARED TOURIST").
       Locking is still sequential by week number (not per-Leg) — a
       real build would lock a whole Leg until the prior one finishes;
       this demo keeps the simpler per-week unlock rule and layers Leg
       headers on top of it.
     - A dedicated Leg-complete toast (see the beat-continue handler
       below) fires the Leg's `blurb` copy instead of the generic
       "Lesson complete" message when the finished lesson was the last
       one in its Leg.
   ================================================================ */
function applyFlagVars(container, colours){
  container.style.setProperty("--flag-primary", colours.primary);
  container.style.setProperty("--flag-secondary", colours.secondary);
  container.style.setProperty("--flag-tertiary", colours.tertiary);
}

function screenDashboard(payload){
  const c = payload.course;
  const country = travelerCountry(c.countryKey);
  const trip = TRIP_TYPES[c.tripKey];
  const weeks = c.syllabus;
  const doneCount = c.status === "completed" ? c.weeks : Math.max(0, c.currentWeek - 1);
  const pct = Math.round((doneCount / c.weeks) * 100);
  // Legacy (non-authored) weeks 1-3 only have real lesson content for a
  // country that carries the hardcoded phrase/transport bank — an
  // Admin-authored country without one falls back to legacy weeks only
  // if it also has no published Blueprint, in which case there's no
  // beat content to open at all (see courseLessonBeats/buildLessonBeats).
  const hasLegacyContent = !!country.phrases;

  const weekRowHtml = (week, idx) => {
    const num = idx + 1;
    // Every authored (Blueprint-resolved) week has real content, since
    // Module publish already requires a real Lesson behind every
    // tier/country cell it claims.
    const built = week.source === "authored" || (num <= 3 && hasLegacyContent);
    const done = c.status === "completed" || num < c.currentWeek;
    const locked = !built || (c.status !== "completed" && num > c.currentWeek);
    const statusTag = locked ? (built ? "Upcoming" : "Preview only") : (done ? "Review" : "Start");
    return `
      <button class="week-row" data-action="${locked ? "" : "open-lesson"}" data-week="${num}" data-locked="${locked}">
        <span class="week-row__num" data-done="${done}">${done ? "✓" : num}</span>
        <span class="week-row__title">${week.title}</span>
        <span class="week-row__tag">${week.type} · ${statusTag}</span>
      </button>`;
  };

  let weekListHtml;
  if (c.legs){
    let idx = 0;
    weekListHtml = c.legs.map((leg, legIndex) => {
      const rows = [];
      while (idx < weeks.length && weeks[idx].legIndex === legIndex){
        rows.push(weekRowHtml(weeks[idx], idx));
        idx++;
      }
      return `
        <div class="section-label" style="margin-top:20px;">Leg ${legIndex + 1} — ${leg.name.toUpperCase()}</div>
        <div class="week-list">${rows.join("")}</div>
      `;
    }).join("");
  } else {
    weekListHtml = `
      <div class="section-label" style="margin-top:20px;">Your syllabus</div>
      <div class="week-list">${weeks.map(weekRowHtml).join("")}</div>
    `;
  }

  const legStatHtml = c.legs ? (() => {
    const currentEntry = weeks[Math.min(c.currentWeek, c.weeks) - 1];
    const currentLegNum = c.status === "completed" ? c.legs.length : (currentEntry ? currentEntry.legIndex + 1 : 1);
    return `<div><b>${currentLegNum}/${c.legs.length}</b><small>Current leg</small></div>`;
  })() : "";

  return `
    <div class="ticket" id="ticket">
      <div class="ticket__stripe">
        <span style="background:${country.colours.primary}"></span>
        <span style="background:${country.colours.secondary}"></span>
        <span style="background:${country.colours.tertiary}"></span>
      </div>
      <div class="ticket__eyebrow">${trip.label} · ${country.capital}</div>
      <div class="ticket__title"><span class="flag-icon ticket__flag">${country.flag}</span>${country.name}</div>
      <div class="ticket__meta">
        ${legStatHtml}
        <div><b>${c.weeks}</b><small>Weeks total</small></div>
        <div><b>${c.status === "completed" ? c.weeks : c.currentWeek}</b><small>${c.status === "completed" ? "Completed" : "Current week"}</small></div>
      </div>
      <div class="ticket__progress">
        <div class="ticket__progress-track"><div class="ticket__progress-fill" style="width:${pct}%"></div></div>
        <div class="ticket__progress-label">${pct}% trip-ready</div>
      </div>
      ${c.status === "completed" ? `<button class="ticket__cta" data-action="open-phrasebook">View offline phrasebook</button>` : ""}
      ${needsFeedback(c) ? `<button class="ticket__cta" data-action="open-feedback">Share trip feedback</button>` : ""}
    </div>

    <div class="culture-card">
      <div class="culture-card__label">Know before you go</div>
      <div class="culture-card__body">${country.cultureTip}</div>
    </div>

    ${weekListHtml}
  `;
}

/* ================================================================
   SCREEN: PHRASEBOOK
   Only reachable from a COMPLETED course's dashboard (see the
   `ticket__cta` button in screenDashboard) — see PRD §13 for why this
   is gated to completion rather than available mid-course. Compiles
   every phrase this course ever taught (main bank + transport bank)
   plus the etiquette/culture notes into one offline-style reference.
   The "Download" button is a deliberate stub: it shows a toast rather
   than producing a file, same pattern as the disabled tab-bar items.

   ASSUMPTION: Framing the phrasebook as a "you finished, here's your
   reward" artefact (completed-only) drives more course completion than
   treating it as a progressively-unlocked utility would — i.e.,
   withholding it is a completion incentive, not just a
   scope-simplification.

   HYPOTHESIS: We believe gating the phrasebook to completed courses
   increases the likelihood users finish all weeks, vs. a partial
   phrasebook available mid-course (which might let people feel "done
   enough" after grabbing the phrases they want). We'll know this is
   wrong if testers report they wanted the phrasebook mid-course and it
   becomes an abandonment trigger rather than a completion driver.

   VALIDATION METRIC: In-course intent signal — track how often (and at
   what week) users try to reach a phrasebook/reference view before
   it's unlocked, if we instrument an in-app "view phrasebook" attempt
   from the locked dashboard state; compare completion rate
   qualitatively via exit surveys for users who drop off before
   finishing.
   ================================================================ */
function screenPhrasebook(payload){
  const c = payload.course;
  const country = travelerCountry(c.countryKey);
  const trip = TRIP_TYPES[c.tripKey];

  // An Admin-authored country falls back to published Phrases (§7) for
  // "Essentials" (see travelerPhraseBank) — but has no "Getting around"
  // bank or etiquette list yet, since neither has an admin-authored
  // equivalent, so those stay gated on the legacy transport bank
  // specifically rather than on country.phrases being present at all.
  const phrasesHtml = country.phrases ? `
    <div class="section-label">Essentials</div>
    <div class="vocab-grid">
      ${country.phrases.map(vocabCardHtml).join("")}
    </div>

    ${country.transport ? `
      <div class="section-label" style="margin-top:20px;">Getting around</div>
      <div class="vocab-grid">
        ${country.transport.phrases.map(vocabCardHtml).join("")}
      </div>
    ` : ""}

    <div class="culture-card" style="margin-top:20px;">
      <div class="culture-card__label">Good to know</div>
      <div class="culture-card__body">${country.cultureTip}</div>
      ${country.transport ? `
        <ul class="etiquette-list" style="margin-top:10px;">
          ${country.transport.etiquette.map(item => `<li>${item}</li>`).join("")}
        </ul>
      ` : ""}
    </div>
  ` : `
    <div class="culture-card" style="margin-top:20px;">
      <div class="culture-card__label">Good to know</div>
      <div class="culture-card__body">${country.cultureTip}</div>
    </div>
    <div class="admin-empty" style="margin-top:20px;">No offline phrasebook has been authored for ${escapeHtml(country.name)} yet.</div>
  `;

  return `
    <div class="ticket" id="ticket">
      <div class="ticket__stripe">
        <span style="background:${country.colours.primary}"></span>
        <span style="background:${country.colours.secondary}"></span>
        <span style="background:${country.colours.tertiary}"></span>
      </div>
      <div class="ticket__eyebrow">Offline phrasebook · ${country.capital}</div>
      <div class="ticket__title"><span class="flag-icon ticket__flag">${country.flag}</span>${country.name}</div>
      <button class="ticket__cta" data-action="download-phrasebook">Download for offline use</button>
    </div>

    <p class="lesson-intro">Every phrase and etiquette tip from your ${trip.label.toLowerCase()} course, in one place — no signal needed once it's downloaded.</p>

    ${phrasesHtml}
  `;
}

/* ================================================================
   SCREEN: FEEDBACK
   Only reachable once `needsFeedback` is true (the dashboard ticket CTA
   and the home board row both surface it — see PRD §14) — i.e. the
   trip's return date has already passed and no feedback has been
   submitted yet. Deliberately independent of lesson-completion status:
   a course that stalled at week 2 still had a real trip happen, and
   that's arguably the more useful feedback to collect, not less.

   ASSUMPTION: A 1-5 NPS-style scale plus a single yes/no question about
   culture/etiquette content specifically (see PRD §7 comment on
   `buildTransportQuiz`) is enough signal to test the PRD §9 hypothesis,
   without needing a longer post-trip survey that risks a lower response
   rate.

   VALIDATION METRIC: Feedback-prompt response rate (submitted vs. ever
   shown), and the culture Y/N split specifically, benchmarked against
   overall NPS — if culture "yes" doesn't correlate with a higher score,
   that undercuts the "culture is a real differentiator" bet from PRD §4.
   ================================================================ */
function screenFeedback(payload){
  feedbackDraft = { score:null, cultureHelped:null };
  const c = payload.course;
  const country = travelerCountry(c.countryKey);

  return `
    <p style="font-size:13px;color:var(--slate);margin:6px 2px 14px;">Your ${country.name} trip has wrapped up — a couple of quick questions while it's fresh.</p>

    <label class="field-label" style="margin-top:6px;">How likely are you to recommend Holaday to a friend planning a similar trip?</label>
    <div class="feedback-scale" id="feedback-scale">
      ${[1,2,3,4,5].map(n => `<button data-action="feedback-score" data-score="${n}" data-selected="false">${n}</button>`).join("")}
    </div>
    <div class="feedback-scale-labels"><span>Not likely</span><span>Very likely</span></div>

    <label class="field-label">Did anything you learned about local customs or etiquette come in useful on the trip?</label>
    <div class="feedback-yn" id="feedback-culture">
      <button data-action="feedback-culture" data-value="yes" data-selected="false">Yes</button>
      <button data-action="feedback-culture" data-value="no" data-selected="false">No</button>
    </div>

    <label class="field-label" for="feedback-notes">Anything else worth telling us? (optional)</label>
    <textarea class="notes" id="feedback-notes" placeholder="e.g. wish there'd been more on tipping, the transport lesson saved me on day one..."></textarea>

    <div class="sticky-cta">
      <button class="btn-primary" id="feedback-cta" data-action="submit-feedback" disabled>Rate your trip above</button>
    </div>
  `;
}

function updateFeedbackCta(){
  const cta = document.getElementById("feedback-cta");
  if (!cta) return;
  if (feedbackDraft.score){
    cta.disabled = false;
    cta.textContent = "Submit feedback";
  }
}

/* ================================================================
   SCREEN: LESSON
   A lesson is now a sequence of one-question-per-page screens (see PRD
   §11a) — `payload.stepIndex` picks which beat of `buildLessonBeats`
   to show, each pushed as its own stack entry. There's no separate
   "read the content, then get quizzed on it" split any more: every
   page IS a scenario-framed question, mixing three styles so the
   lesson doesn't feel like the same drill five times in a row:
     "produce"     -> "How do you say X?" (recall the local phrase)
     "comprehend"  -> a local phrase is quoted -> "what did they say?"
     "symbol"      -> a sign/icon is shown -> "what does it mean?"
     "situational" -> week 3 only, "what would you do?" judgement call
   Weeks 1-2 are phrase lessons: "Airport & Arrival Essentials" always
   uses phrases 0-3 of the country's bank, and week 2's title is
   trip-type-flavoured but reuses phrases 4-7 of the same bank — see
   PRD §7 for why (36 hand-authored phrase sets isn't worth it for a
   prototype). Week 3 is always a distinct CULTURE lesson — Public
   Transport — with its own bespoke per-country beat plan (see each
   country's `transport.beatPlan` above) rather than more vocab, so the
   "etiquette is first-class" claim in PRD §4 is actually demonstrated,
   not just asserted. The last beat of every lesson still gates
   "Mark lesson complete" the same way regardless of lesson type.
   ================================================================ */
function vocabCardHtml(p){
  return `
    <div class="vocab-card">
      <div class="vocab-card__en">${p.en}</div>
      <div class="vocab-card__local">${p.local}</div>
      <div class="vocab-card__translit">${p.translit}</div>
    </div>`;
}

function lessonMeta(week, country, trip){
  if (week === 3) return { title:"Public Transport & Getting Around", type:"Culture lesson" };
  if (week === 1) return { title:"Airport & Arrival Essentials", type:"Phrase lesson" };
  return { title:trip.lesson2, type:"Phrase lesson" };
}

/* ----- beat construction -----
   makeQuestion builds the shuffled options/correctIndex for any MCQ;
   produceBeat/comprehendBeat turn one phrase-bank entry into a
   translate-out or translate-in question; symbolBeat/situationalBeat
   wrap hand-authored content (icons, "what would you do" scenarios)
   into the same beat shape so screenLesson/renderBeat don't need to
   care which kind they're looking at. */
function makeQuestion(promptText, correctText, distractorTexts){
  const options = shuffle([correctText, ...distractorTexts]);
  return { q: promptText, options, correctIndex: options.indexOf(correctText) };
}
function produceBeat(phraseBank, index, context, distractorCount){
  const p = phraseBank[index];
  const pool = phraseBank.filter((_, i) => i !== index);
  const distractors = shuffle(pool).slice(0, distractorCount).map(x => x.local);
  const mq = makeQuestion(`How do you say "${p.en}"?`, p.local, distractors);
  return { kind:"produce", context, ...mq };
}
function comprehendBeat(phraseBank, index, context, question, distractorCount){
  const p = phraseBank[index];
  const pool = phraseBank.filter((_, i) => i !== index);
  const distractors = shuffle(pool).slice(0, distractorCount).map(x => x.en);
  const mq = makeQuestion(question, p.en, distractors);
  return { kind:"comprehend", context, heard:p.local, ...mq };
}
function symbolBeat(context, symbol, question, correct, distractors){
  const mq = makeQuestion(question, correct, distractors);
  return { kind:"symbol", context, symbol, ...mq };
}
function situationalBeat(scenario, context){
  const distractors = scenario.options.filter((_, i) => i !== scenario.correctIndex);
  const mq = makeQuestion(scenario.q, scenario.options[scenario.correctIndex], distractors);
  return { kind:"situational", context, ...mq };
}

// Turns a beat-plan descriptor (see ARRIVAL_BEAT_PLAN / EXPLORE_BEAT_PLAN
// / each country's transport.beatPlan) into an actual beat object with
// computed MCQ options. `phraseBank` + `distractorCount` differ between
// the 8-phrase country bank (7 other entries to pull distractors from)
// and the 3-phrase transport bank (only 2 others), so both are passed
// in rather than hard-coded.
function buildBeat(entry, phraseBank, distractorCount, scenario){
  switch (entry.kind){
    case "produce": return produceBeat(phraseBank, entry.phraseIndex, entry.context, distractorCount);
    case "comprehend": return comprehendBeat(phraseBank, entry.phraseIndex, entry.context, entry.question, distractorCount);
    case "symbol": return symbolBeat(entry.context, entry.symbol, entry.question, entry.correct, entry.distractors);
    case "situational": return situationalBeat(scenario, entry.context);
  }
}

function buildLessonBeats(country, trip, week){
  if (week === 3){
    const t = country.transport;
    return t.beatPlan.map(entry => buildBeat(entry, t.phrases, 2, t.scenario));
  }
  const plan = week === 1 ? ARRIVAL_BEAT_PLAN : EXPLORE_BEAT_PLAN;
  return plan.map(entry => buildBeat(entry, country.phrases, 2));
}

// Turns an authored admin Lesson's Questions into real beats, via the
// same adminQuestionToBeat() the admin Lesson editor's own live preview
// uses (see screenAdminLesson) — the traveler is looking at literally
// the same rendering path an author checked before publishing.
function adminLessonBeats(lessonId){
  const lesson = adminLessons.find(l => l.id === lessonId);
  return lesson ? lesson.data.questions.map(q => adminQuestionToBeat(q, lesson.data)).filter(Boolean) : [];
}

// Picks legacy hardcoded beats or authored-Lesson beats for a given
// week of a course, based on how that week was resolved in
// finalizeCourse() (see course.syllabus / resolveBlueprintSyllabus).
function courseLessonBeats(course, week){
  const entry = course.syllabus[week - 1];
  if (entry && entry.source === "authored") return adminLessonBeats(entry.lessonId);
  const country = travelerCountry(course.countryKey);
  if (!country.phrases) return []; // no legacy phrase bank — screenDashboard's built-gate should keep this unreachable
  const trip = TRIP_TYPES[course.tripKey];
  return buildLessonBeats(country, trip, week);
}

function renderBeat(beat){
  const visual = beat.kind === "symbol"
    ? `<div class="beat-symbol"><span class="beat-symbol__icon">${SYMBOLS[beat.symbol]}</span></div>`
    : beat.kind === "comprehend"
    ? `<div class="beat-heard">"${beat.heard}"</div>`
    : "";
  return `
    <div class="beat-card">
      <div class="beat-card__context">${beat.context}</div>
      ${visual}
      <div class="beat-card__question">${beat.q}</div>
      ${beat.options.map((opt, oi) => `<button class="quiz__opt" data-action="beat-answer" data-choice-index="${oi}">${opt}</button>`).join("")}
      <div class="quiz__feedback" id="beat-feedback"></div>
    </div>
  `;
}

function screenLesson(payload){
  const c = payload.course;
  const country = travelerCountry(c.countryKey);
  const trip = TRIP_TYPES[c.tripKey];
  const week = payload.week;
  const stepIndex = payload.stepIndex || 0;
  const entry = c.syllabus[week - 1];
  const meta = entry.source === "authored" ? { title: entry.title, type: entry.type + " lesson" } : lessonMeta(week, country, trip);
  const beats = courseLessonBeats(c, week);
  const total = beats.length;
  const isLast = stepIndex + 1 >= total;

  currentBeat = beats[stepIndex];
  beatResult = null;
  const pct = Math.round((stepIndex / total) * 100);

  return `
    <div class="lesson-hero" id="lesson-hero">
      <div class="lesson-hero__eyebrow">Week ${week} · ${country.name} · ${meta.type}</div>
      <div class="lesson-hero__title">${meta.title}</div>
    </div>

    <div class="beat-progress">
      <div class="beat-progress__track"><div class="beat-progress__fill" style="width:${pct}%"></div></div>
      <div class="beat-progress__label">Question ${stepIndex + 1} of ${total}</div>
    </div>

    ${renderBeat(currentBeat)}

    <div class="lesson-cta">
      <button class="btn-primary" id="beat-continue-btn" data-action="beat-continue" data-week="${week}" data-final="${isLast}" disabled>Answer to continue</button>
    </div>
  `;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================================================================
   ADMIN SCREENS (demo-phase — ADMIN-CONTENT-PLAN.md §10)

   Destination/Language/Module/Lesson/Phrase/Blueprint authoring (§2-5,
   §7) all share the status lifecycle below.
   ================================================================ */
const ADMIN_STATUS_LABELS = {
  missing: "Missing", draft: "Draft", staged: "Staged", published: "Published", archived: "Archived"
};
function adminStatusChip(status){
  return `<span class="admin-status admin-status--${status}">${ADMIN_STATUS_LABELS[status]}</span>`;
}

function adminRecordRowHtml(action, id, flagHtml, name, sub, status){
  return `
    <button class="admin-list-row" data-action="${action}" data-id="${id}">
      ${flagHtml || ""}
      <span class="admin-list-row__mid">
        <div class="admin-list-row__name">${escapeHtml(name)}</div>
        <div class="admin-list-row__sub">${sub}</div>
      </span>
      ${adminStatusChip(status)}
    </button>
  `;
}

// Every content type that carries the draft/staged/publish lifecycle
// (§6), flattened into one list — the Staged screen groups by status
// rather than by content type, so "what's ready to publish" doesn't
// require checking four separate screens.
function contentTypeRecordsByStatus(status){
  return [
    ...adminDestinations.filter(d => d.status === status).map(d =>
      adminRecordRowHtml("admin-open-destination", d.id, `<span class="admin-list-row__flag flag-icon">${adminFlagMarkup(d)}</span>`, d.data.name, `Destination · v${d.version}`, d.status)),
    ...adminModules.filter(m => m.status === status).map(m =>
      adminRecordRowHtml("admin-open-module", m.id, "", m.data.name, `Module · v${m.version}`, m.status)),
    ...adminLessons.filter(l => l.status === status).map(l =>
      adminRecordRowHtml("admin-open-lesson", l.id, "", l.data.title, `Lesson · v${l.version}`, l.status)),
    ...adminBlueprints.filter(b => b.status === status).map(b =>
      adminRecordRowHtml("admin-open-blueprint", b.id, "", TRIP_TYPES[b.data.tripKey].label, `Blueprint · v${b.version}`, b.status)),
    ...adminPhrases.filter(p => p.status === status).map(p =>
      adminRecordRowHtml("admin-open-phrase", p.id, "", p.data.en, `Phrase · v${p.version}`, p.status))
  ].join("");
}

function screenAdminHome(){
  const destCounts = { draft:0, staged:0, published:0, archived:0 };
  adminDestinations.forEach(d => destCounts[d.status]++);
  const totalStaged =
    adminDestinations.filter(d => d.status === "staged").length +
    adminModules.filter(m => m.status === "staged").length +
    adminLessons.filter(l => l.status === "staged").length +
    adminBlueprints.filter(b => b.status === "staged").length +
    adminPhrases.filter(p => p.status === "staged").length;

  return `
    <p style="font-size:13px;color:var(--slate);margin:6px 2px 20px;">Demo-phase content authoring surface (ADMIN-CONTENT-PLAN.md).</p>

    <div class="section-label">Content</div>
    <button class="admin-card" data-action="admin-open-languages">
      <div class="admin-card__title">Languages</div>
      <div class="admin-card__meta">${adminLanguages.length} language${adminLanguages.length === 1 ? "" : "s"}</div>
    </button>
    <button class="admin-card" data-action="admin-open-destinations">
      <div class="admin-card__title">Destinations</div>
      <div class="admin-card__meta">${destCounts.published} published · ${destCounts.draft} draft · ${destCounts.staged} staged</div>
    </button>

    <div class="section-label">Publishing</div>
    <button class="admin-card" data-action="admin-open-staged">
      <div class="admin-card__title">Staged</div>
      <div class="admin-card__meta">${totalStaged} item${totalStaged === 1 ? "" : "s"} ready to publish</div>
    </button>
  `;
}

// Destinations pane: Countries is the primary tab, with Modules/Lessons
// nested here as filterable tabs (filter by country) rather than their
// own admin-home entries, and Blueprints reachable here too — but only
// here, never under Languages, because a Blueprint resolves per-country,
// never per-language.
function adminPaneTabBarHtml(tabs, activeTab, tabAction){
  return `
    <div class="admin-tab-bar">
      ${tabs.map(t => t.action
        ? `<button data-action="${t.action}">${t.label}</button>`
        : `<button data-action="${tabAction}" data-tab="${t.key}" data-active="${activeTab === t.key}">${t.label}</button>`
      ).join("")}
    </div>
  `;
}

/* ================================================================

   Lesson/Blueprint) — a Language is reference taxonomy a Country
   points at, not itself staged/published content per §6. Modules and
   Lessons nest here as filterable tabs too (filter by language) — the
   Destinations-pane and Languages-pane Modules/Lessons tabs are two
   different filtered views over the same underlying lists, not two
   separate sets of content. No Blueprints tab here — see above.

function screenAdminLanguages(){

    { key: "languages", label: "Languages" },
    { key: "modules", label: "Modules" },
    { key: "lessons", label: "Lessons" },

  ], adminLanguagesTab, "admin-languages-tab");

  if (adminLanguagesTab === "modules") return tabBar + languagesModulesTabHtml();
  if (adminLanguagesTab === "lessons") return tabBar + languagesLessonsTabHtml();
  if (adminLanguagesTab === "phrases") return tabBar + languagesPhrasesTabHtml();
